    /* per-slot accent (9 AM blue, 11 AM teal, 4 PM magenta) and per-role accent */
    /* --cb/--ct = chip fill + text (9 AM dark blue #0B3D82, 11 AM cyan #079FC8, 4 PM light cyan #9AE5EF); --sc = brighter accent used for borders and glow */
    :root[data-theme="dark"] [data-slot="0"] { --sc:#3B82E0; --cb:#0B3D82; --ct:#FFFFFF; }
    :root[data-theme="dark"] [data-slot="1"] { --sc:#079FC8; --cb:#079FC8; --ct:#04213A; }
    :root[data-theme="dark"] [data-slot="2"] { --sc:#9AE5EF; --cb:#9AE5EF; --ct:#0B3D82; }
    :root[data-theme="dark"] .role-row[data-role="0"] { --rc:#F5B301; }
    :root[data-theme="dark"] .role-row[data-role="1"] { --rc:#22B8F0; }
    :root[data-theme="dark"] .role-row[data-role="2"] { --rc:#A855F7; }
    :root[data-theme="dark"] .role-row[data-role="3"] { --rc:#F0555F; }
    :root[data-theme="dark"] .role-row { box-shadow: inset 4px 0 0 var(--rc, transparent); }
    :root[data-theme="dark"] .role-row .role-dot { background: var(--rc, #A9782F) !important; box-shadow: 0 0 8px var(--rc, transparent); }

    /* slot chips on top: glowing pills */
    :root[data-theme="dark"] .slot-chip {
      background: var(--cb) !important; color: var(--ct) !important;
      border-radius: 999px !important;
      box-shadow: 0 0 16px -2px color-mix(in srgb, var(--sc) 55%, transparent), inset 0 1px 0 rgba(255,255,255,0.18);
    }
    /* thin bar above each box */
    :root[data-theme="dark"] .vol-slot > [aria-hidden="true"] { background: var(--sc) !important; box-shadow: 0 0 8px color-mix(in srgb, var(--sc) 60%, transparent); }

    /* the name boxes: slot tint, slot-colored left border, soft glow on hover/focus */
    :root[data-theme="dark"] .vol-slot input,
    :root[data-theme="dark"] .vol-slot div[role="button"]:not([tabindex="-1"]) {
      background: linear-gradient(180deg, color-mix(in srgb, var(--sc) 13%, #14203A), color-mix(in srgb, var(--sc) 5%, #0F1A30)) !important;
      border-radius: 10px !important;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 2px 8px rgba(0,0,0,0.30);
    }
    :root[data-theme="dark"] .vol-slot:not(.vol-warn) input,
    :root[data-theme="dark"] .vol-slot:not(.vol-warn) div[role="button"]:not([tabindex="-1"]) {
      border: 1px solid color-mix(in srgb, var(--sc) 42%, transparent) !important;
      border-left: 3px solid color-mix(in srgb, var(--sc) 90%, #fff 10%) !important;
    }
    :root[data-theme="dark"] .vol-slot:not(.vol-warn) div[role="button"]:not([tabindex="-1"]):hover,
    :root[data-theme="dark"] .vol-slot:not(.vol-warn) div[role="button"]:not([tabindex="-1"]):focus-visible,
    :root[data-theme="dark"] .vol-slot:not(.vol-warn) input:focus {
      border-color: var(--sc) !important;
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--sc) 30%, transparent), 0 0 16px color-mix(in srgb, var(--sc) 40%, transparent) !important;
    }

    /* buttons */
    :root[data-theme="dark"] .btn-print { background: linear-gradient(180deg, #2F6FE0, #1F4FB3) !important; border-radius: 10px !important; box-shadow: 0 4px 14px -4px rgba(59,130,246,0.6); }

    if (/pm/i.test(m[3])) h += 12;
    return h * 60 + min;
  }
  m = s.match(/^(\d{1,2}):(\d{2})$/);
  if (m) return parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
  return null;
}
function minutesToHHMM(total) {
  const wrapped = ((total % 1440) + 1440) % 1440;
  const h = Math.floor(wrapped / 60);
  const m = wrapped % 60;
  return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
}
function slotOffsetMinutes(slot) {
  const base = parseClockToMinutes(SLOTS[0]);
  const cur = parseClockToMinutes(slot);
  if (base == null || cur == null) return 0;
  return cur - base;
}
// Shifted times that land in the afternoon/evening are shown in normal
// 12-hour style (e.g. "3:00 – 4:00 PM") instead of 24-hour "15:00 – 16:00".
// Morning times keep the same HH:MM style the run sheet is typed in.
function fmtShifted(total) {
  const w = ((total % 1440) + 1440) % 1440;
  return w >= 720 ? minutesToClock12(w) : minutesToHHMM(w);
}
function shiftTimeText(text, offsetMinutes) {
  const s = norm(text);
  if (!s || !offsetMinutes) return s;
  const parts = s.split(/\s[–-]\s/);
  if (parts.length === 2) {
    const a = parseClockToMinutes(parts[0]);
    const b = parseClockToMinutes(parts[1]);
    if (a != null && b != null) {
      let fa = fmtShifted(a + offsetMinutes);
      const fb = fmtShifted(b + offsetMinutes);
      // Same AM/PM on both ends → say it once: "3:00 – 4:00 PM".
      const ma = fa.match(/\s(AM|PM)$/);
      const mb = fb.match(/\s(AM|PM)$/);
      if (ma && mb && ma[1] === mb[1]) fa = fa.replace(/\s(AM|PM)$/, "");
      return `${fa} – ${fb}`;
    }
    return s;
  }
  const single = parseClockToMinutes(s);
  if (single != null) return fmtShifted(single + offsetMinutes);
  return s;
}
function shiftDividerLabel(label, slot) {
  const s = norm(label);
  if (!s) return s;
  const base = SLOTS[0];
  if (slot === base) return s;
  if (s.includes(base)) return s.split(base).join(slot);
  return s;
}

// Call time is typed once (against the first service slot). For other slots
// it shifts by the same gap as the run sheet's clock times, keeping the
// typed style (12-hour "8:00 AM" stays 12-hour). A per-slot entry in
// printSettings.callTimes (set in Manage Teams) always wins over the shift.
function minutesToClock12(total) {
  const wrapped = ((total % 1440) + 1440) % 1440;
  const h24 = Math.floor(wrapped / 60);
  const m = wrapped % 60;
  const h12 = h24 % 12 === 0 ? 12 : h24 % 12;
  return `${h12}:${String(m).padStart(2, "0")} ${h24 < 12 ? "AM" : "PM"}`;
}
function callTimeForSlot(printSettings, slot) {
  const ps = printSettings || {};
  const override = norm((ps.callTimes || {})[slot]);
  if (override) return override;
  const base = norm(ps.callTime);
  if (!base || slot === SLOTS[0]) return base;
  const mins = parseClockToMinutes(base);
  if (mins == null) return base;
  const shifted = mins + slotOffsetMinutes(slot);
  return /[AaPp][Mm]\s*$/.test(base) ? minutesToClock12(shifted) : minutesToHHMM(shifted);
}

// A print-program row can be limited to specific service weeks via
// `showWeeks: [1,2,...]`. No showWeeks (or an empty list) means "every week".
function rowVisibleForWeek(row, week) {
  return !row.showWeeks || row.showWeeks.length === 0 || row.showWeeks.includes(week);
}

// A print-program row's Time/Duration can also be overridden for specific
// weeks and/or specific slots (e.g. Celebration Song runs 3 MINS on Week 1
// but 5 MINS on Weeks 2-5, or a future 3:00 PM service needs its own
// schedule entirely). `row.overrides` is a list of
// { id, weeks: [..] (empty = every week), slots: [..] (empty = every slot),
//   time, duration }. The most specific match wins (an override naming both
// weeks and slots beats one naming only weeks or only slots; ties go to the
// override added most recently). If a matching override supplies a time,
// that time is used exactly as typed (no auto-shifting) since it was
// authored for that slot directly; if it leaves time blank (overriding only
// duration), the normal shifted base time is used instead.
//
// Divider sections (kind: "divider") use this same mechanism via their own
// `overrides` array so a divider's displayed time (e.g. the printed
// "END OF 9:00 AM SERVICE — 10:10") can be pushed later/earlier on weeks
// where an earlier row's duration was overridden and the service runs long.
function overrideSpecificity(ov) {
  return (ov.weeks && ov.weeks.length ? 2 : 0) + (ov.slots && ov.slots.length ? 1 : 0);
}
function resolveRowTiming(row, week, slot, timeOffset) {
  const overrides = row.overrides || [];
  let best = null;
  let bestScore = -1;
  overrides.forEach((ov) => {
    const weekOk = !ov.weeks || ov.weeks.length === 0 || ov.weeks.includes(week);
    const slotOk = !ov.slots || ov.slots.length === 0 || ov.slots.includes(slot);
    if (!weekOk || !slotOk) return;
    const score = overrideSpecificity(ov);
    if (score >= bestScore) { bestScore = score; best = ov; }
  });
  const timeIsOverridden = !!(best && norm(best.time));
  const duration = best && norm(best.duration) ? best.duration : row.duration;
  const time = timeIsOverridden ? best.time : shiftTimeText(row.time, timeOffset);
  return { time: time || "", duration: duration || "" };
}

// Resolve what a print-program row should display: a linked team/role's
// live assignment (with conflict flags), fixed text that's the same every
// month, or a free-text box the user can type into right on the print page.
// Free-text values are keyed by week+slot+row so each service keeps its
// own text (e.g. different songs each Sunday).
function resolvePrintRow(config, monthState, week, slot, row) {
  if (row.linkedRole) {
    const [teamId, roleId] = row.linkedRole.split("::");
    const team = config.teams.find((t) => t.id === teamId);
    const role = team && team.roles.find((r) => r.id === roleId);
    if (team && role) {
      const key = assignKey(week, slot, teamId, roleId);
      const name = monthState.assignments[key] || "";
      const issues = name ? findIssues(config, monthState, week, slot, teamId, roleId, name) : [];
      return { value: name, editable: false, issues };
    }
  }
  if (norm(row.fixedText)) return { value: row.fixedText, editable: false, issues: [] };
  const cvKey = `${week}|${slot}|${row.id}`;
  const value = (monthState.customValues && monthState.customValues[cvKey]) || "";
  return { value, editable: true, issues: [] };
}

// Resolve the live value behind a role tag (e.g. "music::song-leader"),
// used for the extra lines that can be shown under a Program-column label
// (e.g. song titles listed under "PRAISE AND WORSHIP").
function resolveRoleTagValue(config, monthState, week, slot, tag) {
  const [teamId, roleId] = (tag || "").split("::");
  const team = config.teams.find((t) => t.id === teamId);
  const role = team && team.roles.find((r) => r.id === roleId);
  if (!team || !role) return "";
  const key = assignKey(week, slot, teamId, roleId);
  return monthState.assignments[key] || "";
}

// Resolve the verse text entered (in Assign volunteers) for a print-program
// row's linked role, but only when that role has been marked "Add a verse
// box next to this role" (role.hasVerse) in Manage Teams. Used so the print
// run sheet can show the verse as its own row under the linked task.
function resolveRowVerse(config, monthState, week, slot, row) {
  if (!row.linkedRole) return "";
  const [teamId, roleId] = row.linkedRole.split("::");
  const team = config.teams.find((t) => t.id === teamId);
  const role = team && team.roles.find((r) => r.id === roleId);
  if (!team || !role || !role.hasVerse) return "";
  const key = assignKey(week, slot, teamId, roleId);
  return (monthState.verses && monthState.verses[key]) || "";
}

function isCompatible(teamAId, teamBId, teams, compatiblePairs) {
  if (teamAId === teamBId) return true;
  const a = teams.find((t) => t.id === teamAId);
  const b = teams.find((t) => t.id === teamBId);
  if ((a && a.flexible) || (b && b.flexible)) return true;
  return compatiblePairs.includes(pairKey(teamAId, teamBId));
}

function findIssues(config, monthState, week, slot, teamId, roleId, name) {
  const target = normKey(name);
  if (!target) return [];
  const issues = [];
  const selfKey = assignKey(week, slot, teamId, roleId);
  const selfTag = roleTag(teamId, roleId);
  for (const [key, val] of Object.entries(monthState.assignments)) {
    if (key === selfKey) continue;
    if (normKey(val) !== target) continue;
    const [w, s, tId, rId] = key.split("|");
    if (Number(w) !== week || s !== slot) continue;
    const otherTeam = config.teams.find((t) => t.id === tId);
    const otherRole = otherTeam && otherTeam.roles.find((r) => r.id === rId);
    if (!otherTeam || !otherRole) continue;

    const otherTag = roleTag(tId, rId);
    const explicitlyAllowed = (config.compatibleGroups || []).some((g) => g.includes(selfTag) && g.includes(otherTag));
    if (explicitlyAllowed) continue;

    if (tId === teamId) {
      issues.push({ type: "duplicate", team: otherTeam, role: otherRole });
    } else if (!isCompatible(teamId, tId, config.teams, config.compatiblePairs)) {
      issues.push({ type: "Schedule Conflict", team: otherTeam, role: otherRole });
    }
  }
  return issues;
}

// ---- Light / dark theme toggle (moon / sun button) ----
function getTheme() {
  return document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
}
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  try { localStorage.setItem("ministry-scheduler-theme", t); } catch (e) { /* ignore */ }
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute("content", t === "dark" ? "#171615" : "#F6F1E4");

function ThemeToggle({ style, className }) {

    <button type="button" className={"theme-toggle no-print" + (className ? " " + className : "")} style={style}

// Real login, backed by Firebase Authentication (email + password) instead
// of a self-reported name. "Sign in" is for people who already created an
// account; "Create account" lets a first-time volunteer set one up
// themselves without needing Firebase console access. The name they enter
// at signup becomes their Firebase displayName ("nickname"), which is only
// used for presence and for matching their name against the schedule (see
// MyScheduleView). Edit access itself is decided purely by the Editors
// list in Manage Teams, which is keyed by the person's registered email —
// so a team leader adds someone by their email, and that person's nickname
// can be anything and can even be changed later without affecting access.
// Friendly error messages for the "change password" flow (re-authenticating
// with the current password, then setting a new one). Kept separate from
// AuthGate's own friendlyError since the failure cases differ slightly (e.g.
// a wrong "current password" here isn't the same as a wrong sign-in password).
function passwordErrorMessage(err) {
  const code = err && err.code;
  if (code === "auth/wrong-password" || code === "auth/invalid-credential" || code === "auth/invalid-login-credentials") return "That's not your current password.";
  if (code === "auth/weak-password") return "New password should be at least 6 characters.";
  if (code === "auth/requires-recent-login") return "For security, please sign out and sign in again, then retry changing your password.";
  if (code === "auth/too-many-requests") return "Too many attempts — please wait a bit and try again.";
  if (code === "auth/network-request-failed") return "Network error — check your connection and try again.";
  return (err && err.message) || "Couldn't change your password.";
}

// Plain outline eye / eye-slash icons for the password show/hide toggles

}

      <path d="M9.5 9.9a3.2 3.2 0 0 0 4.6 4.5" />

function AuthGate({ auth, onSignedIn, onBack }) {
  const [mode, setMode] = useState("signin"); // "signin" | "signup" | "reset"
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [displayName, setDisplayName] = useState("");
  const [error, setError] = useState("");
  const [notice, setNotice] = useState("");
  const [busy, setBusy] = useState(false);
  const [showPassword, setShowPassword] = useState(false);
  // Holds the just-signed-in Firebase User object while we wait to find out
  // whether their email is verified. Kept only so the "Resend verification
  // email" button below has something to call — we've already signed them
  // back out (see submit()) since an unverified account shouldn't get into
  // the app yet.
  const [unverifiedUser, setUnverifiedUser] = useState(null);

  const friendlyError = (err) => {
    const code = err && err.code;
    if (code === "auth/invalid-email") return "That email doesn't look right.";
    if (code === "auth/missing-email") return "Enter your email.";
    if (code === "auth/user-not-found") return "No account with that email yet — try Create account.";
    if (code === "auth/wrong-password" || code === "auth/invalid-credential" || code === "auth/invalid-login-credentials") return "Wrong email or password.";
    if (code === "auth/email-already-in-use") return "That email already has an account — try Sign in instead.";
    if (code === "auth/weak-password") return "Password should be at least 6 characters.";
    if (code === "auth/too-many-requests") return "Too many attempts — please wait a bit and try again.";
    if (code === "auth/network-request-failed") return "Network error — check your connection and try again.";
    return (err && err.message) || "Something went wrong.";
  };

  const submit = async () => {
    setError("");
    setNotice("");
    const cleanEmail = norm(email);
    if (mode === "reset") {
      if (!cleanEmail) { setError("Enter your email first."); return; }
      setBusy(true);
      try {
        await auth.sendPasswordResetEmail(cleanEmail);
        setNotice("Password reset email sent — check your inbox.");
      } catch (err) {
        setError(friendlyError(err));
      } finally {
        setBusy(false);
      }
      return;
    }
    if (!cleanEmail || !password) { setError("Enter your email and password."); return; }
    if (mode === "signup" && !norm(displayName)) { setError("Enter your name too."); return; }
    setBusy(true);
    try {
      if (mode === "signup") {
        const cred = await auth.createUserWithEmailAndPassword(cleanEmail, password);
        await cred.user.updateProfile({ displayName: norm(displayName) });
        setUnverifiedUser(null);
        onSignedIn(cred.user);
      } else {
        const cred = await auth.signInWithEmailAndPassword(cleanEmail, password);
        setUnverifiedUser(null);
        onSignedIn(cred.user);
      }
    } catch (err) {
      setError(friendlyError(err));
    } finally {
      setBusy(false);
    }
  };

  const resendVerification = async () => {
    if (!unverifiedUser) return;
    setError("");
    setNotice("");
    setBusy(true);
    try {
      await unverifiedUser.sendEmailVerification();
      setNotice("Verification email resent — check your inbox.");
    } catch (err) {
      setError(friendlyError(err));
    } finally {
      setBusy(false);
    }
  };

  const switchMode = (next) => {
    setMode(next);
    setError("");
    setNotice("");
    setUnverifiedUser(null);
  };

  return (
    <div style={{ ...styles.setupScreen, position: "relative" }}>
      <ThemeToggle style={{ position: "absolute", top: "calc(16px + env(safe-area-inset-top, 0px))", right: 16 }} />
      <div style={styles.setupCard}>
        {onBack && (
          <button onClick={onBack} style={styles.backLink}>← Back</button>
        )}
        <h1 style={{ ...styles.h1, marginBottom: 10 }}>
          {mode === "signup" ? "Create your account" : mode === "reset" ? "Reset your password" : "Sign in"}
        </h1>
        <p style={styles.setupText}>
          {mode === "signup"
            ? "Set up your login for the scheduler. Your edit access depends on the email you sign up with being added to the Editors list by your team leader — the name below is just how you'll show up on the schedule."
            : mode === "reset"
            ? "Enter the email on your account and we'll send you a reset link."
            : "Sign in to view and edit the schedule."}
        </p>
        <div style={{ display: "flex", flexDirection: "column", gap: 10, marginTop: 14 }}>
          {mode === "signup" && (
            <input value={displayName} onChange={(e) => setDisplayName(e.target.value)}
              placeholder="Your name (e.g. Zero Torres)" style={styles.input} autoFocus />
          )}
          <input value={email} onChange={(e) => setEmail(e.target.value)} type="email"
            placeholder="Email" style={styles.input} autoFocus={mode !== "signup"}
            onKeyDown={(e) => { if (e.key === "Enter") submit(); }} />
          {mode !== "reset" && (
            <div style={styles.passwordFieldWrap}>
              <input value={password} onChange={(e) => setPassword(e.target.value)} type={showPassword ? "text" : "password"}
                placeholder="Password" style={{ ...styles.input, paddingRight: 40 }}
                autoComplete={mode === "signup" ? "new-password" : "current-password"}
                onKeyDown={(e) => { if (e.key === "Enter") submit(); }} />
              <button type="button" onClick={() => setShowPassword((s) => !s)} style={styles.passwordToggleBtn}
                aria-label={showPassword ? "Hide password" : "Show password"} title={showPassword ? "Hide password" : "Show password"}>
                {showPassword ? <EyeOffIcon /> : <EyeIcon />}
              </button>
            </div>
          )}
          {error && <div style={{ color: "var(--tA6402F)", fontSize: 13, fontFamily: "system-ui, sans-serif" }}>{error}</div>}
          {notice && <div style={{ color: "var(--t3B6B3E)", fontSize: 13, fontFamily: "system-ui, sans-serif" }}>{notice}</div>}
          {unverifiedUser && (
            <button onClick={resendVerification} disabled={busy}
              style={{ background: "none", border: "none", color: "var(--t1F3864)", fontSize: 12.5, cursor: "pointer", fontFamily: "system-ui, sans-serif", padding: 0, textAlign: "left", fontWeight: 600 }}>
              Resend verification email
            </button>
          )}
          <button onClick={submit} disabled={busy} style={{ ...styles.smallBtn, padding: "10px 14px", opacity: busy ? 0.6 : 1 }}>
            {busy ? "Please wait…" : mode === "signup" ? "Create account" : mode === "reset" ? "Send reset email" : "Sign in"}
          </button>
          <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
            {mode !== "signup" && (
              <button onClick={() => switchMode("signup")}
                style={{ background: "none", border: "none", color: "var(--t7A6E4E)", fontSize: 12.5, cursor: "pointer", fontFamily: "system-ui, sans-serif", padding: 0, textAlign: "left" }}>
                New here? Create an account
              </button>
            )}
            {mode !== "signin" && (
              <button onClick={() => switchMode("signin")}
                style={{ background: "none", border: "none", color: "var(--t7A6E4E)", fontSize: 12.5, cursor: "pointer", fontFamily: "system-ui, sans-serif", padding: 0, textAlign: "left" }}>
                Already have an account? Sign in
              </button>
            )}
            {mode !== "reset" && (
              <button onClick={() => switchMode("reset")}
                style={{ background: "none", border: "none", color: "var(--t7A6E4E)", fontSize: 12.5, cursor: "pointer", fontFamily: "system-ui, sans-serif", padding: 0, textAlign: "left" }}>
                Forgot password?
              </button>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

// No-login view for anyone who just needs to check a schedule or grab a
// printable master list. Reuses MyScheduleView (typing a name instead of
// reading it off a Firebase auth account) and MasterListView (including its
// print button) exactly as the full app does, but never calls
// updateMonthState, so nothing here can write to the shared schedule.
function QuickView({ config, monthState, year, month, onPrevMonth, onNextMonth, onLogin }) {
  const [qtab, setQtab] = useState("myschedule"); // "myschedule" | "master"
  const [week, setWeek] = useState(() => {
    const sunday = upcomingSunday(new Date());
    return sunday.getFullYear() === year && sunday.getMonth() + 1 === month ? Math.ceil(sunday.getDate() / 7) : 1;
  });
  const [slot, setSlot] = useState(SLOTS[0]);
  const [guestName, setGuestName] = useState(() => {
    try { return localStorage.getItem("ministry-scheduler-guest-name") || ""; } catch (e) { return ""; }
  });
  useEffect(() => {
    try { localStorage.setItem("ministry-scheduler-guest-name", guestName); } catch (e) { /* ignore */ }
  }, [guestName]);
  const noopUpdate = useCallback(() => {}, []);

  // Distinct volunteer names in this month that match what's typed so far.
  // Hidden once the box holds one exact full name (nothing left to pick).
  const nameSuggestions = useMemo(() => {
    const q = norm(guestName);
    if (!q || !monthState) return [];
    const seen = new Map();
    Object.values(monthState.assignments || {}).forEach((v) => {
      const name = norm(v);
      if (name && !seen.has(normKey(name)) && namePrefixMatch(name, q)) seen.set(normKey(name), name);
    });
    const list = Array.from(seen.values()).sort((a, b) => a.localeCompare(b));
    if (list.length === 1 && normKey(list[0]) === normKey(q)) return [];
    return list.slice(0, 10);
  }, [guestName, monthState]);

  if (!config || !monthState) {
    return (
      <React.Fragment>
        <Watermark />
        <div style={styles.setupScreen}>
          <div style={styles.setupText}>Connecting…</div>
        </div>
      </React.Fragment>
    );
  }

  return (
    <React.Fragment>
      <Watermark />
      <div className="app-shell" style={styles.quickViewShell}>
        <header className="no-print qv-header" style={styles.quickViewHeader}>
          <div style={styles.quickViewBrand}>
            <img src="./icons/victory.png" alt="" style={styles.brandMark} />
            <div>
              <div className="qv-title" style={styles.quickViewBrandTitle}>Victory Alfonso</div>
              <div className="qv-sub" style={styles.quickViewBrandSub}>Quick View — no account needed</div>
            </div>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <button onClick={onLogin} style={styles.smallBtn}>🔑 Login</button>
            <ThemeToggle />
          </div>
        </header>

        <main className="app-main" style={styles.quickViewBody}>
          <div className="no-print" style={styles.mobileControls}>
            <div style={styles.mobileControlsRow}>
              <div style={styles.mobileMonthNav}>
                <button onClick={onPrevMonth} style={styles.monthNavBtn} aria-label="Previous month">‹</button>
                <div style={styles.mobileMonthLabel}>{monthLabel(year, month)}</div>
                <button onClick={onNextMonth} style={styles.monthNavBtn} aria-label="Next month">›</button>
              </div>
            </div>
            {qtab === "master" && (
              <React.Fragment>
                <div style={styles.mobileControlsRow}>
                  {WEEKS.map((w) => {
                    const text = weekButtonText(w, monthState.weekLabels, year, month);
                    if (!text && w !== week) return null;
                    return (
                      <button key={w} onClick={() => setWeek(w)}
                        style={{ ...styles.mobileWeekBtn, ...(w === week ? styles.weekBtnActive : {}) }}>
                        {text || "–"}
                      </button>
                    );
                  })}
                  {SLOTS.map((s) => (
                    <button key={s} onClick={() => setSlot(s)}
                      style={{ ...styles.mobileSlotBtn, ...(s === slot ? styles.slotBtnActive : {}) }}>
                      {s}
                    </button>
                  ))}
                </div>
                <div style={styles.mobileWeekDate}>{weekDisplayLabel(week, monthState.weekLabels, year, month)}</div>
              </React.Fragment>
            )}
          </div>

          <div className="no-print" style={{ display: "flex", gap: 8, margin: "16px 0 20px", flexWrap: "wrap" }}>
            <button onClick={() => setQtab("myschedule")}
              style={qtab === "myschedule" ? styles.smallBtn : styles.ghostBtn}>🗓️ My Schedule</button>
            <button onClick={() => setQtab("master")}
              style={qtab === "master" ? styles.smallBtn : styles.ghostBtn}>📋 Master List</button>
          </div>

          {qtab === "myschedule" ? (
            <div>
              <div className="no-print" style={{ ...styles.lightCard, marginBottom: 16, maxWidth: 420 }}>
                <div style={styles.fieldLabel}>Your name</div>
                <input type="text" value={guestName} onChange={(e) => setGuestName(e.target.value)}
                  placeholder="e.g. Zerah Torres" style={styles.input} autoComplete="off" />
                {nameSuggestions.length > 0 && (
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 10 }}>
                    {nameSuggestions.map((n) => (
                      <button key={n} onClick={() => setGuestName(n)} style={styles.ghostBtn}>{highlightPrefix(n, guestName)}</button>
                    ))}
                  </div>
                )}
                <div style={{ ...styles.pairNote, marginTop: 8, marginBottom: 0 }}>
                  Type the first letter of your first name or surname — matches show up as you type. Tap a name to pick it.
                </div>
              </div>
              {norm(guestName) ? (
                <MyScheduleView config={config} monthState={monthState} userName={guestName} year={year} month={month} partial />
              ) : (
                <div style={styles.masterCard}>
                  <div style={styles.emptyNote}>Type your name above to see your assignments.</div>
                </div>
              )}
            </div>
          ) : (
            <MasterListView config={config} monthState={monthState} updateMonthState={noopUpdate} week={week} slot={slot} year={year} month={month} />
          )}
        </main>
      </div>
    </React.Fragment>
  );
}

function App() {
  const now = new Date();
  // Start on the coming Sunday (today if it's Sunday) so the right week is open
  const startSunday = upcomingSunday(now);
  const [year, setYear] = useState(startSunday.getFullYear());
  const [month, setMonth] = useState(startSunday.getMonth() + 1);
  const [config, setConfig] = useState(null);
  const [monthState, setMonthState] = useState(null);
  const [loadedKey, setLoadedKey] = useState(null);
  const loadedKeyRef = useRef(null);
  const monthLoading = FIREBASE_CONFIGURED && loadedKey !== periodKey(year, month);
  const [week, setWeek] = useState(Math.ceil(startSunday.getDate() / 7));
  const [slot, setSlot] = useState(SLOTS[0]);
  const [activeTeamId, setActiveTeamId] = useState(DEFAULT_TEAMS[0].id);
  const [tab, setTab] = useState("assign");
  const [authUser, setAuthUser] = useState(undefined); // undefined = checking, null = signed out
  const [entryScreen, setEntryScreen] = useState("choice"); // "choice" | "login" | "quickview" — only used while signed out
  // Firebase mutates auth.currentUser in place when updateProfile() resolves,
  // so setAuthUser(auth.currentUser) alone wouldn't produce a new reference
  // for React to notice. This override holds the freshly-saved nickname for
  // the rest of the session so the UI updates immediately; it's cleared
  // whenever the signed-in user changes.
  const [displayNameOverride, setDisplayNameOverride] = useState(null);
  const userName = authUser ? norm(displayNameOverride ?? authUser.displayName ?? (authUser.email || "").split("@")[0]) : "";
  // Permission lookups key off the registered email, not the display name/
  // nickname — a nickname is easy for anyone to type at signup and would
  // otherwise let someone claim another editor's access just by matching
  // their name. userName above is still used for presence and for matching
  // names typed into the schedule itself.
  const userEmail = authUser ? normKey(authUser.email || "") : "";
  const [onlineUsers, setOnlineUsers] = useState([]);
  const [isMobile, setIsMobile] = useState(() => (typeof window !== "undefined" ? window.matchMedia("(max-width: 860px)").matches : false));
  const saveTimer = useRef(null);
  const configSaveTimer = useRef(null);
  const migratedRef = useRef(false);

  useEffect(() => {
    if (!auth) { setAuthUser(null); return; }
    const unsub = auth.onAuthStateChanged((u) => { setAuthUser(u); if (!u) setEntryScreen("choice"); });
    return unsub;
  }, []);

  useEffect(() => { setDisplayNameOverride(null); }, [authUser && authUser.uid]);

  // Lets a signed-in user change the name/nickname they show up as on the
  // schedule, without needing Firebase console access. Edit access itself
  // still depends on the Editors list (keyed by email, see the note above
  // AuthGate), so renaming here never grants or revokes anything — it just
  // updates how this person is displayed and matched against assignments.
  const updateNickname = useCallback(async (newName) => {
    const clean = norm(newName);
    if (!clean || !auth || !auth.currentUser) return { ok: false, error: "Enter a name." };
    try {
      await auth.currentUser.updateProfile({ displayName: clean });
      setDisplayNameOverride(clean);
      return { ok: true };
    } catch (err) {
      return { ok: false, error: (err && err.message) || "Couldn't save that name." };
    }
  }, []);

  // Lets a signed-in user change their own account password directly, without
  // having to sign out and use the "forgot password" email link. Firebase
  // requires a recent sign-in before allowing a sensitive change like this,
  // so we re-authenticate with the current password first.
  const changePassword = useCallback(async (currentPassword, newPassword) => {
    if (!auth || !auth.currentUser || !auth.currentUser.email) return { ok: false, error: "You're not signed in." };
    try {
      const credential = firebase.auth.EmailAuthProvider.credential(auth.currentUser.email, currentPassword);
      await auth.currentUser.reauthenticateWithCredential(credential);
      await auth.currentUser.updatePassword(newPassword);
      return { ok: true };
    } catch (err) {
      return { ok: false, error: passwordErrorMessage(err) };
    }
  }, []);

  useEffect(() => {
    if (!FIREBASE_CONFIGURED) return;
    const listener = configRef.on("value", (snapshot) => {
      const val = snapshot.val();
      if (val) {
        const safeTeams = (val.teams || DEFAULT_TEAMS).map((t) => ({
          ...t,
          roles: t.roles || [],
        }));
        setConfig({ ...emptyConfig(), ...val, teams: safeTeams, printProgram: val.printProgram || defaultPrintProgram() });
        return;
      }
      if (migratedRef.current) return;
      migratedRef.current = true;
      firebase.database().ref("ministry-scheduler-state").once("value").then((oldSnap) => {
        const old = oldSnap.val();
        if (old && (old.teams || old.assignments)) {
          const conf = { teams: old.teams || DEFAULT_TEAMS, compatiblePairs: old.compatiblePairs || [], compatibleGroups: old.compatibleGroups || [], restrictions: old.restrictions || {} };
          configRef.set(conf);
          setConfig(conf);
          const curKey = periodKey(now.getFullYear(), now.getMonth() + 1);
          firebase.database().ref(`ministry-scheduler-months/${curKey}`).set({
            assignments: old.assignments || {},
            weekLabels: old.weekLabels || {},
          });
        } else {
          const conf = emptyConfig();
          configRef.set(conf);
          setConfig(conf);
        }
      });
    });
    return () => configRef.off("value", listener);
  }, []);

  useEffect(() => {
    if (!FIREBASE_CONFIGURED) return;
    const key = periodKey(year, month);
    const ref = monthRef(year, month);
    const listener = ref.on("value", (snapshot) => {
      loadedKeyRef.current = key;
      setMonthState({ ...emptyMonthState(), ...(snapshot.val() || {}) });
      setLoadedKey(key);
    });
    return () => ref.off("value", listener);
  }, [year, month]);

  useEffect(() => {
    if (!FIREBASE_CONFIGURED || !userName || !authUser) return;
    const myPresenceRef = firebase.database().ref(`presence/${authUser.uid}`);
    const connectedRef = firebase.database().ref(".info/connected");
    const onConnected = connectedRef.on("value", (snap) => {
      if (snap.val() === true) {
        myPresenceRef.onDisconnect().remove();
        myPresenceRef.set({ name: userName, since: firebase.database.ServerValue.TIMESTAMP });
      }
    });
    const presenceListRef = firebase.database().ref("presence");
    const onPresence = presenceListRef.on("value", (snapshot) => {
      const val = snapshot.val() || {};
      setOnlineUsers(Object.entries(val).map(([id, v]) => ({ id, ...v })));
    });
    return () => {
      connectedRef.off("value", onConnected);
      presenceListRef.off("value", onPresence);
      myPresenceRef.remove();
    };
  }, [userName, authUser]);

  useEffect(() => {
    const mq = window.matchMedia("(max-width: 860px)");
    const handler = (e) => setIsMobile(e.matches);
    if (mq.addEventListener) mq.addEventListener("change", handler);
    else mq.addListener(handler);
    return () => {
      if (mq.removeEventListener) mq.removeEventListener("change", handler);
      else mq.removeListener(handler);
    };
  }, []);

  const updateConfig = useCallback((updater) => {
    setConfig((prev) => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      clearTimeout(configSaveTimer.current);
      configSaveTimer.current = setTimeout(() => {
        if (configRef) configRef.set(next);
      }, 300);
      return next;
    });
  }, []);

  const updateMonthState = useCallback((updater) => {
    if (FIREBASE_CONFIGURED && loadedKeyRef.current !== periodKey(year, month)) return;
    setMonthState((prev) => {
      const base = prev || emptyMonthState();
      const next = typeof updater === "function" ? updater(base) : updater;
      clearTimeout(saveTimer.current);
      saveTimer.current = setTimeout(() => {
        monthRef(year, month).set(next);
      }, 300);
      return next;
    });
  }, [year, month]);

  const shiftMonth = (delta) => {
    let m = month + delta;
    let y = year;
    while (m > 12) { m -= 12; y += 1; }
    while (m < 1) { m += 12; y -= 1; }
    setMonth(m);
    setYear(y);
  };

  // Whether this name has an explicit entry in the restrictions list at all.
  // No entry = this person cannot edit any ministry's assignments, the
  // service details tab, or Manage Teams. Only names on the list with
  // "can manage teams" checked get into Manage Teams — EXCEPT: if literally
  // no one in the whole list has "can manage teams" checked yet, Manage
  // Teams stays open to everyone. Without this, the very first save could
  // lock everyone out with no way back in through the app.
  // Migration safety net: configs saved before this change may still have
  // Editors-list entries keyed by the old display name/nickname instead of
  // email. Match by email first (the current, secure behavior); only fall
  // back to a name-keyed entry if this account has no email key yet, so
  // nobody gets silently locked out while the list is being migrated. Once
  // an entry is re-saved through the Editors list it's always keyed by
  // email, so this fallback naturally stops applying to it.
  const restrictionsObj = config ? (config.restrictions || {}) : {};
  const legacyNameKey = normKey(userName);
  const matchedRestrictionKey = !config
    ? null
    : Object.prototype.hasOwnProperty.call(restrictionsObj, emailToKey(userEmail))
    ? emailToKey(userEmail)
    : (legacyNameKey && !legacyNameKey.includes("@") && Object.prototype.hasOwnProperty.call(restrictionsObj, legacyNameKey))
    ? legacyNameKey
    : null;
  const hasRestrictionEntry = !!matchedRestrictionKey;
  const noManagerSetYet = !Object.values(restrictionsObj).some((v) => normalizeRestriction(v).canManage);
  const restrictionEntry = matchedRestrictionKey ? normalizeRestriction(restrictionsObj[matchedRestrictionKey]) : { teams: [], canManage: false };
  const allowedTeamIds = restrictionEntry.teams;
  const canManage = (hasRestrictionEntry && restrictionEntry.canManage) || noManagerSetYet;
  const canEditServiceInfo = allowedTeamIds.includes(ADMIN_TEAM_ID);

  useEffect(() => {
    if (!hasRestrictionEntry) return;
    if (allowedTeamIds.length && !allowedTeamIds.includes(activeTeamId)) setActiveTeamId(allowedTeamIds[0]);
    if (tab === "manage" && !canManage) setTab("assign");
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [hasRestrictionEntry, canManage, allowedTeamIds.join(","), activeTeamId, tab]);

  if (!FIREBASE_CONFIGURED) return (<React.Fragment><Watermark /><SetupScreen /></React.Fragment>);
  if (authUser === undefined) {
    return (
      <React.Fragment>
        <Watermark />
        <div style={styles.setupScreen}>
          <div style={styles.setupText}>Checking your session…</div>
        </div>
      </React.Fragment>
    );
  }
  if (!authUser) {
    if (entryScreen === "quickview") {
      return (
        <QuickView config={config} monthState={monthState} year={year} month={month}
          onPrevMonth={() => shiftMonth(-1)} onNextMonth={() => shiftMonth(1)}
          onLogin={() => setEntryScreen("login")} />
      );
    }
    if (entryScreen === "login") {
      return (<React.Fragment><Watermark /><AuthGate auth={auth} onSignedIn={setAuthUser} onBack={() => setEntryScreen("choice")} /></React.Fragment>);
    }
    return (<React.Fragment><Watermark /><EntryChoice onQuickView={() => setEntryScreen("quickview")} onLogin={() => setEntryScreen("login")} /></React.Fragment>);
  }
  if (!config || !monthState) {
    return (
      <React.Fragment>
        <Watermark />
        <div style={styles.setupScreen}>
          <div style={styles.setupText}>Connecting…</div>
        </div>
      </React.Fragment>
    );
  }

  const activeTeam = config.teams.find((t) => t.id === activeTeamId) || config.teams[0];
  const effectiveTab = !canManage && tab === "manage" ? "assign" : tab;

  return (
    <React.Fragment>
      <Watermark />
      <div className="app-shell" style={styles.app}>
      <Sidebar config={config} monthState={monthState} week={week} setWeek={setWeek} slot={slot} setSlot={setSlot}
        tab={effectiveTab} setTab={setTab} activeTeamId={activeTeam && activeTeam.id}
        setActiveTeamId={setActiveTeamId} userName={userName} onlineUsers={onlineUsers}
        allowedTeamIds={allowedTeamIds} hasRestrictionEntry={hasRestrictionEntry} canManage={canManage} monthLabelText={monthLabel(year, month)}
        year={year} month={month} onRenameUser={updateNickname} onChangePassword={changePassword}
        onPrevMonth={() => shiftMonth(-1)} onNextMonth={() => shiftMonth(1)} isMobile={isMobile} />
      {/* On the ministry tabs main must not be its own scroll container, or the pinned
          9:00 AM / 11:00 AM / 4:00 PM header can't stick while the page scrolls. */}
      <main className={`app-main${monthLoading ? " month-loading" : ""}`} style={{ ...styles.main, ...(isMobile ? styles.mainMobile : {}), ...(effectiveTab === "assign" ? { overflowY: "visible", ...(isMobile ? {} : { paddingTop: 0 }) } : {}) }}>
        {isMobile && (
          <MobileControls monthState={monthState} week={week} setWeek={setWeek} slot={slot} setSlot={setSlot}
            monthLabelText={monthLabel(year, month)} year={year} month={month} onPrevMonth={() => shiftMonth(-1)} onNextMonth={() => shiftMonth(1)}
            onlineUsers={onlineUsers} userName={userName} hideSlots={effectiveTab === "assign"} />
        )}
        {effectiveTab === "myschedule" && (
          <MyScheduleView config={config} monthState={monthState} userName={userName} year={year} month={month} />
        )}
        {effectiveTab === "assign" && (
          <AssignView config={config} updateConfig={updateConfig} monthState={monthState} updateMonthState={updateMonthState} week={week} setWeek={setWeek} slot={slot} team={activeTeam}
            year={year} month={month} locked={!activeTeam || !allowedTeamIds.includes(activeTeam.id)} isMobile={isMobile} userName={userName}
            onPrevMonth={() => shiftMonth(-1)} onNextMonth={() => shiftMonth(1)} />
        )}
        {effectiveTab === "info" && (
          <ServiceInfoView monthState={monthState} updateMonthState={updateMonthState} week={week} slot={slot}
            year={year} month={month} locked={!canEditServiceInfo} userName={userName} />
        )}
        {effectiveTab === "master" && <MasterListView config={config} monthState={monthState} updateMonthState={updateMonthState} week={week} slot={slot} year={year} month={month} />}
        {effectiveTab === "events" && (
          <EventsView config={config} updateConfig={updateConfig} canEdit={canManage || canEditServiceInfo} />
        )}
        {effectiveTab === "manage" && canManage && (
          <ManageView config={config} updateConfig={updateConfig} monthState={monthState} updateMonthState={updateMonthState}
            monthLabelText={monthLabel(year, month)} year={year} month={month} isMobile={isMobile} />
        )}
      </main>

      </div>
    </React.Fragment>
  );
}

// ---- Events tab: one-off services (prayer meeting, Sambang Gabi, etc.) ----
// Saved inside config.events so it syncs like the rest of the config.
const padTwo = (n) => String(n).padStart(2, "0");

const blankEvent = () => ({
  id: uid(), title: "", subtitle: "", date: "", startTime: "19:00", announcements: "",
  rows: [{ id: uid(), duration: "", program: "", volunteer: "" }],
});

function addMinutesToClock(startTime, minutes) {
  const [h, m] = (startTime || "").split(":").map((n) => parseInt(n, 10));
  if (isNaN(h) || isNaN(m)) return "";
  const total = (((h * 60 + m + minutes) % 1440) + 1440) % 1440;
  return `${padTwo(Math.floor(total / 60))}:${padTwo(total % 60)}`;
}

function clockLabel(time) {
  const [h, m] = (time || "").split(":").map((n) => parseInt(n, 10));
  if (isNaN(h) || isNaN(m)) return "";
  return `${h % 12 || 12}:${padTwo(m)} ${h >= 12 ? "PM" : "AM"}`;
}

function eventDateLabel(dateStr) {
  const [y, m, d] = (dateStr || "").split("-").map((n) => parseInt(n, 10));
  if (isNaN(y) || isNaN(m) || isNaN(d)) return "";
  return `${MONTH_NAMES[m - 1]} ${d}, ${y}`;
}

// Rows can sit before the service starts, during it, or after it ends
const EVENT_PHASES = [
  { id: "before", label: "Before service", short: "Before" },
  { id: "during", label: "During service", short: "During" },
  { id: "after", label: "After service", short: "After" },
];
const phaseOf = (row) => row.phase || "during";

// Names for an event live in event.assignments, keyed by "teamId|roleId" (same idea as the Sunday assignKey).
// Task rows link to a role, ministry blocks list roles, and both read the same key.
const eventRoleKey = (teamId, roleId) => `${teamId}|${roleId}`;
const blockRoleKey = (block, role) => eventRoleKey(block.teamId, role.roleId ? role.roleId : `c:${role.id}`);
const eventVolunteer = (event, key) => (key && (event.assignments || {})[key]) || "";
const splitRoleKey = (key) => {
  const at = (key || "").indexOf("|");
  return at < 0 ? ["", ""] : [key.slice(0, at), key.slice(at + 1)];
};
const rowMinutes = (row) => (parseInt(row.duration, 10) > 0 ? parseInt(row.duration, 10) : 0);

function clockToMinutes(time) {
  const [h, m] = (time || "").split(":").map((n) => parseInt(n, 10));
  return isNaN(h) || isNaN(m) ? null : h * 60 + m;
}
function minutesToClock(total) {
  const t = ((total % 1440) + 1440) % 1440;
  return `${padTwo(Math.floor(t / 60))}:${padTwo(t % 60)}`;
}

// A program = a row carrying Start at / Mins / Program name, plus the blank rows under it (its roles/tasks).
function rawEventGroups(rows, phaseId) {
  const groups = [];
  rows.filter((r) => phaseOf(r) === phaseId).forEach((r) => {
    const startsGroup = groups.length === 0 || norm(r.duration) || norm(r.startAt) || norm(r.program);
    if (startsGroup) groups.push([r]);
    else groups[groups.length - 1].push(r);
  });
  return groups;
}
// Display order of a phase's programs: those with a "Start at" sort by that time (same time keeps the
// order they were added, so overlaps stay put); a program with no "Start at" stays right after the one above it.
function eventGroups(event, phaseId) {
  const chains = [];
  rawEventGroups(event.rows || [], phaseId).forEach((g) => {
    const t = clockToMinutes(g[0].startAt);
    if (t !== null || chains.length === 0) chains.push({ t, groups: [g], i: chains.length });
    else chains[chains.length - 1].groups.push(g);
  });
  chains.sort((a, b) => ((a.t === null ? -1 : a.t) - (b.t === null ? -1 : b.t)) || a.i - b.i);
  return chains.flatMap((c) => c.groups);
}

// Rows run one after another. "Before" rows count backwards from the service start.
// A row with its own "start at" jumps to that time, so rows can overlap (call time + music practice).
function computeEventRows(event) {
  const rows = event.rows || [];
  const serviceStart = clockToMinutes(event.startTime);
  const beforeTotal = rows.filter((r) => phaseOf(r) === "before").reduce((sum, r) => sum + rowMinutes(r), 0);
  const ordered = EVENT_PHASES.flatMap((p) => eventGroups(event, p.id).flat());
  let cursor = serviceStart === null ? null : serviceStart - beforeTotal;
  let lastPhase = "before";
  return ordered.map((row) => {
    const phase = phaseOf(row);
    if (phase !== lastPhase) {
      if (phase === "during" && serviceStart !== null) cursor = serviceStart;
      lastPhase = phase;
    }
    const fixedStart = clockToMinutes(row.startAt);
    if (fixedStart !== null) cursor = fixedStart;
    const mins = rowMinutes(row);
    if (cursor === null) return { row, phase, time: "", durationText: "" };
    if (!mins) return { row, phase, time: fixedStart !== null ? minutesToClock(cursor) : "", durationText: "" };
    const from = cursor;
    cursor += mins;
    return { row, phase, time: `${minutesToClock(from)} – ${minutesToClock(cursor)}`, durationText: mins === 60 ? "1 HR" : `${mins} MINS` };
  });
}

// end time = start time + the "during" rows
function eventEndTime(event) {
  const duringTotal = (event.rows || []).filter((r) => phaseOf(r) === "during").reduce((sum, r) => sum + rowMinutes(r), 0);
  return duringTotal > 0 ? addMinutesToClock(event.startTime, duringTotal) : "";
}

        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        setField("cover", canvas.toDataURL("image/jpeg", 0.8));

                          </div>
                          {keys.length > 0 && (
                            <span style={{ fontSize: 11, fontWeight: 700, padding: "3px 10px", borderRadius: 20, whiteSpace: "nowrap",
                              ...(complete ? { background: "rgba(127,176,122,0.2)", color: "#9BE08F", border: "1px solid rgba(127,176,122,0.6)" } : { background: "rgba(229,164,48,0.18)", color: "#F2C265", border: "1px solid rgba(229,164,48,0.55)" }) }}>
                              {complete ? "✓ Complete" : `${filled} of ${keys.length}`}
                            </span>
                          )}
                        </div>
                        {(subLines.length > 0 || lines.length > 0 || norm(first.programNote)) && (
                          <div style={{ marginTop: 6, paddingTop: 6, borderTop: "1px solid rgba(255,255,255,0.1)", fontSize: 12.5 }}>
                            {subLines.map((l) => (
                              <div key={l.k} style={{ opacity: 0.95 }}>
                                <span style={{ opacity: 0.7 }}>{l.label}: </span>{norm(l.value) ? l.value : <span style={{ opacity: 0.5 }}>— open —</span>}
                              </div>
                            ))}
                            {norm(first.programNote) && <div style={{ whiteSpace: "pre-wrap", opacity: 0.85 }}>{first.programNote}</div>}
                            {lines.map((l) => (
                              <div key={l.id}>
                                <span style={{ opacity: 0.7 }}>{l.label}{l.label ? ": " : ""}</span>
                                {norm(l.value) ? <b style={{ fontWeight: 600 }}>{l.value}</b> : <span style={{ opacity: 0.5 }}>— open —</span>}
                                {norm(l.verse) && <span style={{ fontStyle: "italic", opacity: 0.8 }}> · {l.verse}</span>}
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              ))}

              {ministries.length > 0 && (
                <div>
                  <div style={{ fontSize: 10.5, fontWeight: 700, letterSpacing: 0.7, textTransform: "uppercase", color: "rgba(255,255,255,0.6)", margin: "16px 2px 6px" }}>Ministries</div>
                  {ministries.map((b) => (
                    <div key={b.id} style={{ background: "rgba(255,255,255,0.1)", border: "1px solid rgba(255,255,255,0.12)", borderRadius: 12, padding: "11px 14px", marginBottom: 8 }}>
                      <div style={{ fontWeight: 700, fontSize: 13.5, color: "#FFFFFF", marginBottom: 4 }}>{b.title}</div>
                      {(b.roles || []).map((r) => {
                        const v = eventVolunteer(ev, blockRoleKey(b, r));
                        return (
                          <div key={r.id} style={{ fontSize: 12.5 }}>
                            <span style={{ opacity: 0.7 }}>{r.label}: </span>{norm(v) ? <b style={{ fontWeight: 600 }}>{v}</b> : <span style={{ opacity: 0.5 }}>— open —</span>}
                          </div>
                        );
                      })}
                    </div>
                  ))}
                </div>
              )}

              {norm(ev.announcements) && (
                <div>
                  <div style={{ fontSize: 10.5, fontWeight: 700, letterSpacing: 0.7, textTransform: "uppercase", color: "rgba(255,255,255,0.6)", margin: "16px 2px 6px" }}>Announcements</div>
                  <div style={{ background: "rgba(255,255,255,0.1)", border: "1px solid rgba(255,255,255,0.12)", borderRadius: 12, padding: "11px 14px", fontSize: 12.5, whiteSpace: "pre-wrap" }}>{ev.announcements}</div>
                </div>
              )}
            </div>
          </div>
        </div>
      </div>,
      document.body
    );
  };

  // ministries: a block per team, with only the roles picked for this event
  const teams = config.teams || [];
  const addMinistry = (teamId) => {
    const team = teams.find((t) => t.id === teamId);
    if (!team) return;
    updateEvent(openId, (e) => ({
      ...e,
      ministries: [...(e.ministries || []), {
        id: uid(), teamId, title: team.name,
        roles: (team.roles || []).map((r) => ({ id: uid(), roleId: r.id, label: r.name, value: "" })),
      }],
    }));
  };
  const updateMinistry = (blockId, updater) => updateEvent(openId, (e) => ({
    ...e, ministries: (e.ministries || []).map((b) => (b.id === blockId ? updater(b) : b)),
  }));
  const removeMinistry = (blockId) => updateEvent(openId, (e) => ({ ...e, ministries: (e.ministries || []).filter((b) => b.id !== blockId) }));
  const toggleTeamRole = (block, teamRole) => updateMinistry(block.id, (b) => {
    const current = b.roles || [];
    if (current.some((r) => r.roleId === teamRole.id)) return { ...b, roles: current.filter((r) => r.roleId !== teamRole.id) };
    return { ...b, roles: [...current, { id: uid(), roleId: teamRole.id, label: teamRole.name, value: "" }] };
  });
  const setMinistryRole = (block, roleRowId, field, value) => updateMinistry(block.id, (b) => ({
    ...b, roles: (b.roles || []).map((r) => (r.id === roleRowId ? { ...r, [field]: value } : r)),
  }));
  const addCustomRole = (block) => updateMinistry(block.id, (b) => ({ ...b, roles: [...(b.roles || []), { id: uid(), roleId: null, label: "", value: "" }] }));
  const removeMinistryRole = (block, roleRowId) => updateMinistry(block.id, (b) => ({ ...b, roles: (b.roles || []).filter((r) => r.id !== roleRowId) }));

  const createEvent = () => {
    const created = blankEvent();
    updateConfig((prev) => ({ ...prev, events: [...(prev.events || []), created] }));
    setOpenId(created.id);
    setMode("edit");
  };
  const duplicateEvent = (source) => {
    const copy = { ...source, id: uid(), title: `${source.title} (copy)`, date: "", assignments: {}, verses: {}, rows: source.rows.map((r) => ({ ...r, id: uid() })),
      ministries: (source.ministries || []).map((b) => ({ ...b, id: uid(), roles: (b.roles || []).map((r) => ({ ...r, id: uid() })) })) };
    updateConfig((prev) => ({ ...prev, events: [...(prev.events || []), copy] }));
    setOpenId(copy.id);
    setMode("edit");
  };
  const deleteEvent = (event) => {
    if (!window.confirm(`Delete "${event.title || "Untitled event"}"?`)) return;
    updateConfig((prev) => ({ ...prev, events: (prev.events || []).filter((e) => e.id !== event.id) }));
    setOpenId(null);
    setMode("list");
  };

  const labelStyle = { fontSize: 12, fontWeight: 700, color: "var(--t6B6B6B)", marginBottom: 3 };
  const fieldWrap = { display: "flex", flexDirection: "column", flex: "1 1 180px", minWidth: 0 };

  if (mode === "print" && openEvent) {
    const computed = computeEventRows(openEvent);
    // blank Time/Program cells get merged into the row above, same as the Master List
    const spanList = (starts) => starts.map((isStart, i) => {
      if (!isStart) return 0;
      let span = 1;
      while (i + span < starts.length && !starts[i + span]) span++;
      return span;
    });
    const bandText = (word) => `${word} OF ${(openEvent.title || "EVENT").toUpperCase()}`;
    const roleNameFor = (key) => {
      const [teamId, roleId] = splitRoleKey(key);
      const team = (config.teams || []).find((t) => t.id === teamId);
      const role = team && (team.roles || []).find((r) => r.id === roleId);
      return role ? role.name : "";
    };
    // verse typed by the ministry, only for roles with "Add a verse box" turned on in Manage Teams
    const verseFor = (key) => {
      const [teamId, roleId] = splitRoleKey(key);
      const team = (config.teams || []).find((t) => t.id === teamId);
      const role = team && (team.roles || []).find((r) => r.id === roleId);
      return role && role.hasVerse ? ((openEvent.verses || {})[key] || "") : "";
    };
    const renderPhaseRows = (phaseId) => {
      const group = computed.filter((c) => c.phase === phaseId);
      const timeSpans = spanList(group.map((c, i) => i === 0 || !!c.time));
      const programSpans = spanList(group.map((c, i) => i === 0 || !!norm(c.row.program)));
      return group.map(({ row, time, durationText }, i) => (
        <tr key={row.id}>
          {timeSpans[i] > 0 && <td rowSpan={timeSpans[i]} style={styles.sheetTd}>{time}</td>}
          {timeSpans[i] > 0 && <td rowSpan={timeSpans[i]} style={styles.sheetTd}>{durationText}</td>}
          {programSpans[i] > 0 && <td rowSpan={programSpans[i]} style={styles.sheetTd}></td>}
          {programSpans[i] > 0 && (
            <td rowSpan={programSpans[i]} style={{ ...styles.sheetTd, fontWeight: 700, verticalAlign: "middle", whiteSpace: "pre-wrap" }}>
              {row.program}
              {(() => {
                const subLines = (row.programSubRoles || []).map((k) => eventVolunteer(openEvent, k)).filter((v) => norm(v));
                if (subLines.length === 0 && !norm(row.programNote)) return null;
                return (
                  <div style={{ fontWeight: 400, fontSize: 10.5, marginTop: 4 }}>
                    {subLines.map((v, idx) => <div key={idx}>{v}</div>)}
                    {norm(row.programNote) && <div>{row.programNote}</div>}
                  </div>
                );
              })()}
            </td>
          )}
          <td style={styles.sheetTd}>
            {row.task}
            {norm(verseFor(row.linkedRole)) && (
              <div style={{ fontWeight: 400, fontStyle: "italic", fontSize: 10.5, marginTop: row.task ? 3 : 0, color: "var(--t3B5A8A)" }}>{verseFor(row.linkedRole)}</div>
            )}
          </td>
          <td style={styles.sheetTd}>{row.fixedText || eventVolunteer(openEvent, row.linkedRole)}</td>
          <td style={{ ...styles.sheetTd, textAlign: "center" }}>
            <span style={{ display: "inline-block", width: 12, height: 12, border: "1px solid var(--l23211D)", borderRadius: 3 }} />
          </td>
        </tr>
      ));
    };
    return (
      <div className="print-sheet-wrap" style={styles.viewWrap}>
        <div className="no-print sheet-toolbar">
          <button onClick={() => setMode(backMode === "edit" && canEdit ? "edit" : "detail")} style={{ ...styles.smallBtn, whiteSpace: "normal" }}>← Back</button>
          <button onClick={() => window.print()} style={{ ...styles.smallBtn, background: "var(--bA9782F)", whiteSpace: "normal" }}>🖨 Print</button>
        </div>
        <div className="sheet-scroll">
          <div className="print-sheet paper" style={styles.sheet}>
            <div className="print-sheet-watermark" style={styles.sheetWatermark} aria-hidden="true">
              <img src="./icons/VictoryWatermark.png" alt="" style={styles.sheetWatermarkImg} />
            </div>
            <div style={styles.sheetInner}>
              <div style={styles.sheetBannerMain}>{(printSettings.campus || "VICTORY ALFONSO").toUpperCase()}</div>
              <div style={styles.sheetBannerBold}>{(openEvent.title || "EVENT").toUpperCase()}</div>
              {openEvent.subtitle && <div style={styles.sheetBannerLight}>{openEvent.subtitle}</div>}
              {[clockLabel(openEvent.startTime) && `START TIME: ${clockLabel(openEvent.startTime)}`, clockLabel(eventEndTime(openEvent)) && `END TIME: ${clockLabel(eventEndTime(openEvent))}`].filter(Boolean).length > 0 && (
                <div style={styles.sheetBannerSub}>
                  {[clockLabel(openEvent.startTime) && `START TIME: ${clockLabel(openEvent.startTime)}`, clockLabel(eventEndTime(openEvent)) && `END TIME: ${clockLabel(eventEndTime(openEvent))}`].filter(Boolean).join(" | ")}
                </div>
              )}
              {openEvent.date && <div style={styles.sheetBannerSub}>{eventDateLabel(openEvent.date)}</div>}
              <table style={{ ...styles.sheetTable, tableLayout: "fixed" }}>
                <colgroup>
                  <col style={{ width: "9%" }} />
                  <col style={{ width: "8%" }} />
                  <col style={{ width: "17%" }} />
                  <col style={{ width: "17%" }} />
                  <col style={{ width: "25%" }} />
                  <col style={{ width: "20%" }} />
                  <col style={{ width: "4%" }} />
                </colgroup>
                <thead>
                  <tr>
                    <th style={styles.sheetTh}>Time</th>
                    <th style={styles.sheetTh}>Duration</th>
                    <th style={styles.sheetTh}></th>
                    <th style={styles.sheetTh}>Program</th>
                    <th style={styles.sheetTh}>Task</th>
                    <th style={styles.sheetTh}>Volunteer(s)</th>
                    <th style={styles.sheetTh}></th>
                  </tr>
                </thead>
                <tbody>
                  {renderPhaseRows("before")}
                  <tr data-divider="1"><td colSpan={7} style={styles.sheetBand}>{bandText("START")}</td></tr>
                  {renderPhaseRows("during")}
                  <tr data-divider="1"><td colSpan={7} style={styles.sheetBand}>{bandText("END")}</td></tr>
                  {renderPhaseRows("after")}
                </tbody>
              </table>
              {(() => {
                const ministries = openEvent.ministries || [];
                const renderMinistry = (block) => (
                  <div key={block.id} style={{ marginBottom: 14 }}>
                    <div style={styles.sheetSectionHead}>{(block.title || "").toUpperCase()}</div>
                    <table style={{ ...styles.sheetTable, tableLayout: "fixed", width: "100%" }}>
                      <colgroup>
                        <col style={{ width: "58%" }} />
                        <col />
                      </colgroup>
                      <tbody>
                        {(block.roles || []).map((r) => (
                          <tr key={r.id}>
                            <td style={styles.sheetTd}>{r.label}</td>
                            <td style={styles.sheetTd}>{eventVolunteer(openEvent, blockRoleKey(block, r))}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                );
                const headCount = openEvent.showHeadCount && (
                  <div style={{ marginBottom: 14, maxWidth: 320 }}>
                    <div style={styles.sheetSectionHead}>HEAD COUNT</div>
                    <table style={styles.sheetTable}>
                      <tbody>
                        {["Volunteer", "Adult", "Kids", "Total"].map((label) => (
                          <tr key={label}>
                            <td style={{ ...styles.sheetTdTall, fontWeight: label === "Total" ? 700 : 400 }}>{label}</td>
                            <td style={{ ...styles.sheetTdTall, width: 80 }}></td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                );
                const announcements = norm(openEvent.announcements) && (
                  <div>
                    <div style={styles.sheetSectionHead}>ANNOUNCEMENTS</div>
                    <div style={{ border: "1px solid var(--l23211D)", borderTop: "none", padding: "8px 10px", fontSize: 12.5, whiteSpace: "pre-wrap" }}>{openEvent.announcements}</div>
                  </div>
                );
                if (ministries.length === 0 && !headCount && !announcements) return null;
                return (
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginTop: 14, alignItems: "start" }}>
                    <div>{ministries.filter((_, i) => i % 2 === 0).map(renderMinistry)}{headCount}</div>
                    <div>{ministries.filter((_, i) => i % 2 === 1).map(renderMinistry)}{announcements}</div>
                  </div>
                );
              })()}
            </div>
          </div>
        </div>
      </div>
    );
  }

  if (mode === "edit" && openEvent && canEdit) {
    return (
      <div style={styles.viewWrap}>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 14 }}>
          <button onClick={() => setMode("list")} style={styles.smallBtn}>← All events</button>
          <button onClick={() => { setBackMode("edit"); setMode("print"); }} style={{ ...styles.smallBtn, background: "var(--bA9782F)" }}>Preview / Print</button>
          <button onClick={() => duplicateEvent(openEvent)} style={{ ...styles.smallBtn, background: "var(--b2F4858)" }}>Duplicate</button>
          <button onClick={() => deleteEvent(openEvent)} style={{ ...styles.smallBtn, background: "var(--bA6402F)" }}>Delete</button>
        </div>

        <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 10 }}>
          <div style={fieldWrap}>
            <div style={labelStyle}>Event name</div>
            <input value={openEvent.title} onChange={(e) => setField("title", e.target.value)} placeholder="Prayer Meeting Night" style={styles.roleEditInput} />
          </div>
          <div style={fieldWrap}>
            <div style={labelStyle}>Subtitle (optional)</div>
            <input value={openEvent.subtitle} onChange={(e) => setField("subtitle", e.target.value)} placeholder="Theme or verse" style={styles.roleEditInput} />
          </div>
        </div>
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 16 }}>
          <div style={fieldWrap}>
            <div style={labelStyle}>Date</div>
            <input type="date" value={openEvent.date} onChange={(e) => setField("date", e.target.value)} style={styles.roleEditInput} />
          </div>
          <div style={fieldWrap}>
            <div style={labelStyle}>Service start time</div>
            <input type="time" value={openEvent.startTime} onChange={(e) => setField("startTime", e.target.value)} style={styles.roleEditInput} />
          </div>
          <div style={fieldWrap}>
            <div style={labelStyle}>End time (computed)</div>
            <div style={{ ...styles.roleEditInput, background: "transparent", border: "1px dashed var(--lD8CFB0)" }}>{clockLabel(eventEndTime(openEvent)) || "—"}</div>
          </div>
        </div>

        <div style={{ marginBottom: 16 }}>
          <div style={labelStyle}>Cover photo (optional)</div>
          <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
            {openEvent.cover && <img src={openEvent.cover} alt="" style={{ width: 64, height: 84, objectFit: "cover", borderRadius: 8, border: "1px solid var(--lD8CFB0)" }} />}
            <label style={{ ...styles.smallBtn, background: "var(--b2F4858)", cursor: "pointer" }}>
              {openEvent.cover ? "Change photo" : "Upload photo"}
              <input type="file" accept="image/*" style={{ display: "none" }}
                onChange={(ev) => { uploadCover(ev.target.files && ev.target.files[0]); ev.target.value = ""; }} />
            </label>
            {openEvent.cover && <button onClick={() => setField("cover", "")} style={{ ...styles.smallBtn, background: "var(--bA6402F)" }}>Remove</button>}
          </div>
        </div>
        <button onClick={() => openProgramModal("during", null)} style={{ ...styles.smallBtn, marginBottom: 8 }}>+ Program</button>
        <div style={labelStyle}>Program flow (start time = when the service starts; programs with a “Start at” are sorted by time automatically — the rest follow the program above them)</div>
        {(() => {
          const computed = computeEventRows(openEvent);
          return EVENT_PHASES.map((phase) => {
            const groups = groupsForPhase(openEvent, phase.id);
            return (
              <div key={phase.id} style={{ marginBottom: 14 }}>
                <div style={{ fontSize: 13, fontWeight: 800, margin: "8px 0 6px", color: "var(--t1F3864)" }}>{phase.label}</div>
                {groups.map((group, gi) => {
                  const first = group[0];
                  const time = (computed.find((c) => c.row.id === first.id) || {}).time;
                  const title = norm(first.program) || norm(first.task) || "Untitled program";
                  const lines = group.filter((r, i) => !(i === 0 && !norm(first.program)) && (norm(r.task) || r.linkedRole || norm(r.fixedText)));
                  return (
                    <div key={first.id} style={{ border: "1px solid var(--lD8CFB0)", borderRadius: 8, padding: "8px 10px", marginBottom: 6, display: "flex", gap: 8, alignItems: "flex-start", flexWrap: "wrap" }}>
                      <div style={{ flex: "1 1 220px", minWidth: 0 }}>
                        <div style={{ fontWeight: 700, fontSize: 13.5 }}>{title}</div>
                        <div style={{ fontSize: 11.5, color: "var(--t6B6B6B)" }}>
                          {[time, rowMinutes(first) ? `${rowMinutes(first)} mins` : "", first.startAt ? `start at ${clockLabel(first.startAt)}` : ""].filter(Boolean).join(" · ") || "—"}
                        </div>
                        {(first.programSubRoles || []).length > 0 && (
                          <div style={{ fontSize: 12, marginTop: 2, color: "var(--t6B6B6B)" }}>
                            Extra lines: {first.programSubRoles.map((k) => { const i2 = linkedLabel(k); return i2 ? i2.role : k; }).join(", ")}
                          </div>
                        )}
                        {lines.map((r) => {
                          const info = linkedLabel(r.linkedRole);
                          return (
                            <div key={r.id} style={{ fontSize: 12, marginTop: 2 }}>
                              • {r.task || (info && info.role) || r.fixedText}
                              {info && <span style={{ color: "var(--t6B6B6B)" }}> — {info.team} · {info.role}</span>}
                              {!info && r.task && norm(r.fixedText) && <span style={{ color: "var(--t6B6B6B)" }}> — {r.fixedText}</span>}
                            </div>
                          );
                        })}
                      </div>
                      <button onClick={() => openProgramModal(phase.id, group)} style={{ ...styles.smallBtn, background: "var(--b2F4858)" }}>Edit</button>
                      <button onClick={() => removeGroup(group)} style={{ ...styles.smallBtn, background: "var(--bA6402F)" }} aria-label="Remove program">✕</button>
                    </div>
                  );
                })}
              </div>
            );
          });
        })()}

        <div style={{ fontSize: 13, fontWeight: 800, margin: "18px 0 6px", color: "var(--t1F3864)" }}>Ministries</div>
        {(openEvent.ministries || []).map((block) => {
          const team = teams.find((t) => t.id === block.teamId);
          return (
            <div key={block.id} style={{ border: "1px solid var(--lD8CFB0)", borderRadius: 8, padding: 10, marginBottom: 10 }}>
              <div style={{ display: "flex", gap: 6, marginBottom: 8 }}>
                <input value={block.title} onChange={(e) => updateMinistry(block.id, (b) => ({ ...b, title: e.target.value }))} style={{ ...styles.roleEditInput, fontWeight: 700 }} />
                <button onClick={() => removeMinistry(block.id)} style={{ ...styles.smallBtn, background: "var(--bA6402F)" }} aria-label="Remove ministry">✕</button>
              </div>
              {team && (team.roles || []).length > 0 && (
                <div style={{ display: "flex", flexWrap: "wrap", gap: 12, marginBottom: 8 }}>
                  {team.roles.map((teamRole) => (
                    <label key={teamRole.id} style={{ fontSize: 12.5, display: "flex", alignItems: "center", gap: 4 }}>
                      <input type="checkbox" checked={(block.roles || []).some((r) => r.roleId === teamRole.id)} onChange={() => toggleTeamRole(block, teamRole)} />
                      {teamRole.name}
                    </label>
                  ))}
                </div>
              )}
              {(block.roles || []).map((r) => (
                <div key={r.id} style={{ display: "flex", gap: 6, marginBottom: 6 }}>
                  <input value={r.label} onChange={(e) => setMinistryRole(block, r.id, "label", e.target.value)} placeholder="Role" style={{ ...styles.roleEditInput, flex: "1 1 120px" }} />
                  <button onClick={() => removeMinistryRole(block, r.id)} style={{ ...styles.smallBtn, background: "var(--bA6402F)" }} aria-label="Remove role">✕</button>
                </div>
              ))}
              <button onClick={() => addCustomRole(block)} style={{ ...styles.smallBtn, background: "var(--b2F4858)" }}>+ Custom role</button>
            </div>
          );
        })}
        <select value="" onChange={(e) => e.target.value && addMinistry(e.target.value)} style={{ ...styles.roleEditInput, maxWidth: 260 }}>
          <option value="">+ Add ministry…</option>
          {teams.filter((t) => !(openEvent.ministries || []).some((b) => b.teamId === t.id)).map((t) => <option key={t.id} value={t.id}>{t.name}</option>)}
        </select>

        <div style={{ ...labelStyle, marginTop: 18 }}>Announcements (optional)</div>
        <textarea value={openEvent.announcements} onChange={(e) => setField("announcements", e.target.value)} rows={3}
          style={{ ...styles.roleEditInput, width: "100%", boxSizing: "border-box", resize: "vertical" }} />
        <label style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 14, fontSize: 13.5 }}>
          <input type="checkbox" checked={!!openEvent.showHeadCount} onChange={(e) => setField("showHeadCount", e.target.checked)} />
          Include head count box on the sheet
        </label>
        {programModal && renderProgramModal()}
      </div>
    );
  }

  return (
    <div style={styles.viewWrap}>
      <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 18, flexWrap: "wrap" }}>

                    <div style={{ fontWeight: 400, fontSize: 10.5, opacity: 0.85 }}>{prog.programs} program{prog.programs === 1 ? "" : "s"}</div>

            })}
          </div>
        );
      })()}
      {mode === "detail" && openEvent && renderEventDetail()}
