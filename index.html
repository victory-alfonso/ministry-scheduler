  );
}

// Ministry-side view of the Events: pick an event, fill in this ministry's roles for it.
// Names are saved on the event (event.assignments), so the event sheet picks them up.
function TeamEventsAssign({ config, updateConfig, team, locked, isMobile, onBack }) {
  const [eventId, setEventId] = useState(null);
  const events = (config.events || []).slice().sort((a, b) => (a.date || "9999").localeCompare(b.date || "9999"));
  const event = events.find((e) => e.id === eventId);

  // roles this ministry fills in an event: the ones picked for its bottom block,
  // plus any task row linked to one of its roles
  const rolesForEvent = (e) => {
    const list = [];
    const seen = new Set();
    const add = (key, label) => {
      if (seen.has(key)) return;
      seen.add(key);
      list.push({ key, label });
    };
    const block = (e.ministries || []).find((b) => b.teamId === team.id);
    if (block) (block.roles || []).forEach((r) => add(blockRoleKey(block, r), r.label));
    (e.rows || []).forEach((row) => {
      const [linkedTeamId, linkedRoleId] = splitRoleKey(row.linkedRole);
      if (linkedTeamId !== team.id) return;
      const teamRole = (team.roles || []).find((r) => r.id === linkedRoleId);
      if (teamRole) add(row.linkedRole, teamRole.name);
    });
    // roles shown as extra lines under a program (e.g. 1st/2nd/3rd Song) are filled in by their ministry too
    (e.rows || []).forEach((row) => (row.programSubRoles || []).forEach((key) => {
      const [subTeamId, subRoleId] = splitRoleKey(key);
      if (subTeamId !== team.id) return;
      const subRole = (team.roles || []).find((r) => r.id === subRoleId);
      if (subRole) add(key, subRole.name);
    }));
    return list;
  };

  const setRoleValue = (key, value) => updateConfig((prev) => ({
    ...prev,
    events: (prev.events || []).map((e) => {
      if (e.id !== eventId) return e;
      const next = { ...(e.assignments || {}) };
      if (norm(value)) next[key] = value;
      else delete next[key];
      return { ...e, assignments: next };
    }),
  }));

  const setVerseValue = (key, value) => updateConfig((prev) => ({
    ...prev,
    events: (prev.events || []).map((e) => {
      if (e.id !== eventId) return e;
      const next = { ...(e.verses || {}) };
      if (norm(value)) next[key] = value;
      else delete next[key];
      return { ...e, verses: next };
    }),
  }));

  const roles = event ? rolesForEvent(event) : [];

  return (
    <div style={styles.viewWrap}>
      <header style={styles.viewHeader}>
        <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 12, flexWrap: "wrap" }}>
          <h1 style={styles.h1}>{team.name} · Events</h1>
          <button onClick={event ? () => setEventId(null) : onBack} style={styles.smallBtn}>
            {event ? "← All events" : "← Back to schedule"}
          </button>
        </div>
        {event && (
          <div style={styles.viewMeta}>
            {[event.title || "Untitled event", eventDateLabel(event.date), clockLabel(event.startTime)].filter(Boolean).join(" · ")}
          </div>
        )}
      </header>

      {!event && (
        <div>
          {events.length === 0 && <div style={styles.emptyNote}>No events yet. Events are added in the Events tab.</div>}
          {events.map((e) => {
            const count = rolesForEvent(e).length;
            return (
              <button key={e.id} onClick={() => setEventId(e.id)}
                style={{ display: "block", width: "100%", textAlign: "left", cursor: "pointer", border: "1px solid var(--lD8CFB0)", borderRadius: 10, background: "var(--bFFFFFF)", padding: "12px 14px", marginBottom: 8, fontFamily: "system-ui, sans-serif" }}>
                <div style={{ fontWeight: 700, color: "var(--t1F3864)" }}>{e.title || "Untitled event"}</div>
                <div style={{ fontSize: 12.5, color: "var(--t6B6B6B)", marginTop: 2 }}>
                  {[eventDateLabel(e.date) || "No date yet", clockLabel(e.startTime)].filter(Boolean).join(" · ")}
                  {" — "}{count > 0 ? `${count} role(s) for this ministry` : "this ministry isn't in this event"}
                </div>
              </button>
            );
          })}
        </div>
      )}

      {event && roles.length === 0 && (
        <div style={styles.emptyNote}>{team.name} has no roles in this event yet. Ask an admin to link one of its roles to a task, or add the ministry, under Events.</div>
      )}
      {event && roles.length > 0 && (
        <div style={styles.rolesCard}>
          {roles.map((role, i) => {
            const [, roleId] = splitRoleKey(role.key);
            const teamRole = (team.roles || []).find((r) => r.id === roleId);
            const roleVolunteers = ((teamRole && teamRole.volunteers) || []).slice().sort((a, b) => a.localeCompare(b));
            return (
              <div key={role.key} className="role-row" style={{ ...styles.roleRow, ...(i % 2 === 1 ? styles.roleRowAlt : {}), borderTop: i === 0 ? "none" : "1px solid var(--lEFE7D3)", ...(isMobile ? { flexDirection: "column", gap: 8 } : {}) }}>
                <div style={{ ...styles.roleName, ...(isMobile ? { width: "100%", paddingTop: 0 } : {}) }}><span className="role-dot" style={styles.roleNameDot} />{role.label}</div>
                <div style={{ ...styles.roleInputWrap, ...(isMobile ? { width: "100%" } : {}) }}>
                  <VolunteerNameInput
                    value={eventVolunteer(event, role.key)}
                    onChange={(val) => setRoleValue(role.key, val)}
                    volunteers={roleVolunteers}
                    locked={locked}
                    placeholder="Volunteer name"
                    allowAbove={!isMobile}
                    compact={isMobile}
                    popupTitle={`${role.label} · ${event.title || "Event"}`}
                    popupMinWidth={220}
                    style={{ ...styles.input, flex: 1, ...(locked ? { background: "var(--bF3EFE2)", cursor: "default" } : {}) }}
                  />
                  {teamRole && teamRole.hasVerse && (
                    <input value={(event.verses || {})[role.key] || ""} onChange={(ev) => setVerseValue(role.key, ev.target.value)}
                      placeholder="Verse (John 3:16)" readOnly={locked} autoComplete="off"
                      style={{ ...styles.input, width: "100%", boxSizing: "border-box", marginTop: 6, ...(locked ? { background: "var(--bF3EFE2)", cursor: "default" } : {}) }} />
                  )}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function MobileControls({ monthState, week, setWeek, slot, setSlot, monthLabelText, year, month, onPrevMonth, onNextMonth, onlineUsers, userName, hideSlots }) {
  const others = (onlineUsers || []).filter((u) => norm(u.name).toLowerCase() !== norm(userName).toLowerCase());
  const [showPresence, setShowPresence] = useState(false);
  const [coords, setCoords] = useState(null);
  const presenceWrapRef = useRef(null);
  const pillRef = useRef(null);
  const popupRef = useRef(null);

  // The pill sits inside a row that scrolls horizontally
  // (mobileControlsRow has overflowX set), and setting only one axis of
  // overflow makes browsers force the other axis to "auto" too — which
  // clips anything absolutely positioned outside that row's own box. So
  // the names dropdown is rendered through a portal into document.body and
  // positioned with position:fixed against the pill's own bounding box,
  // the same trick used for the volunteer-name suggestion popup below.
  const updateCoords = useCallback(() => {
    const el = pillRef.current;
    if (!el) return;
    const rect = el.getBoundingClientRect();
    setCoords({ top: rect.bottom + 6, right: window.innerWidth - rect.right });
  }, []);

  useEffect(() => {
    if (!showPresence) return;
    updateCoords();
    const handleOutside = (e) => {
      if (presenceWrapRef.current && presenceWrapRef.current.contains(e.target)) return;
      if (popupRef.current && popupRef.current.contains(e.target)) return;
      setShowPresence(false);
    };
    document.addEventListener("mousedown", handleOutside);
    window.addEventListener("scroll", updateCoords, true);
    window.addEventListener("resize", updateCoords);
    return () => {
      document.removeEventListener("mousedown", handleOutside);
      window.removeEventListener("scroll", updateCoords, true);
      window.removeEventListener("resize", updateCoords);
    };
  }, [showPresence, updateCoords]);

  return (
    <div className="no-print" style={styles.mobileControls}>
      <div style={styles.mobileControlsRow}>
        <div className="month-nav-keep" style={styles.mobileMonthNav}>
          <button onClick={onPrevMonth} style={styles.monthNavBtn} aria-label="Previous month">‹</button>
          <div style={styles.mobileMonthLabel}>{monthLabelText}</div>
          <button onClick={onNextMonth} style={styles.monthNavBtn} aria-label="Next month">›</button>
        </div>
        <div ref={presenceWrapRef} style={{ position: "relative" }}>
          <button ref={pillRef} onClick={() => setShowPresence((v) => !v)} style={styles.mobilePresencePill}>
            🟢 {1 + others.length} online
          </button>
          {showPresence && coords && ReactDOM.createPortal(
            <div ref={popupRef} className="no-print"
              style={{ ...styles.mobilePresenceDropdown, position: "fixed", top: coords.top, right: coords.right }}>
              <div style={styles.mobilePresenceDropdownItem}><span style={styles.presenceDot} />{userName} (you)</div>
              {others.map((u) => (
                <div key={u.id} style={styles.mobilePresenceDropdownItem}><span style={styles.presenceDot} />{u.name}</div>
              ))}
            </div>,
            document.body
          )}
        </div>
      </div>
      <div style={styles.mobileControlsRow}>
        {WEEKS.map((w) => {
          const text = weekButtonText(w, monthState.weekLabels, year, month);
          if (!text && w !== week) return null;
          return (
            <button key={w} onClick={() => setWeek(w)}
              style={{ ...styles.mobileWeekBtn, ...(w === week ? styles.weekBtnActive : {}) }}>
              {text || "–"}
            </button>
          );
        })}
        {!hideSlots && SLOTS.map((s) => (
          <button key={s} onClick={() => setSlot(s)}
            style={{ ...styles.mobileSlotBtn, ...(s === slot ? styles.slotBtnActive : {}) }}>
            {s}
          </button>
        ))}
      </div>
      <div style={styles.mobileWeekDate}>{weekDisplayLabel(week, monthState.weekLabels, year, month)}</div>
    </div>
  );
}

function initials(name) {
  const parts = norm(name).split(/\s+/).filter(Boolean);
  if (parts.length === 0) return "?";
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[1][0]).toUpperCase();
}

  const [confirmOpen, setConfirmOpen] = useState(false);
  const [mode, setMode] = useState("edit"); // "edit" | "print"
  const [showEvents, setShowEvents] = useState(false); // this ministry's view of the Events tab
  const [exporting, setExporting] = useState(null); // null | "image" | "pdf"
  const sheetRef = useRef(null);

  // ---- Per-role volunteer list editing (add / remove right on the ministry tab) ----
  // Same data as Manage Teams (role.volunteers in the shared config), so the
  // dropdown on each role and the Manage Teams list always stay in sync.
  const [openVolRoles, setOpenVolRoles] = useState({}); // roleId -> bool (panel expanded)
  const [volDraft, setVolDraft] = useState({});         // roleId -> textarea text
  const parseVolunteerNames = (raw) =>
    (raw || "").split(/[\n,]/).map((x) => norm(x)).filter(Boolean);
  const addVolunteers = (roleId) => {
    if (locked || !team) return;
    const names = parseVolunteerNames(volDraft[roleId]);
    if (names.length === 0) return;
    updateConfig((prev) => ({
      ...prev,
      teams: prev.teams.map((t) => {
        if (t.id !== team.id) return t;
        return {
          ...t,
          roles: t.roles.map((r) => {
            if (r.id !== roleId) return r;
            const existing = r.volunteers || [];
            const seen = new Set(existing.map((v) => normKey(v)));
            const additions = [];
            names.forEach((nm) => {
              const k = normKey(nm);
              if (seen.has(k)) return;
              seen.add(k);
              additions.push(nm);
            });
            if (additions.length === 0) return r;
            return { ...r, volunteers: [...existing, ...additions] };
          }),
        };
      }),
    }));
    setVolDraft((prev) => ({ ...prev, [roleId]: "" }));
  };
  const removeVolunteerFromRole = (roleId, name) => {
    if (locked || !team) return;
    updateConfig((prev) => ({
      ...prev,
      teams: prev.teams.map((t) => {
        if (t.id !== team.id) return t;
        return {
          ...t,
          roles: t.roles.map((r) => (r.id === roleId ? { ...r, volunteers: (r.volunteers || []).filter((v) => v !== name) } : r)),
        };
      }),
    }));
  };

  // Same share/download + capture approach as the Master List's print sheet:
  // phones get the native share sheet (so the image can go straight into a
  // group chat), desktop just downloads the file.
  const isMobileDevice = () =>
    /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
    (navigator.userAgentData && navigator.userAgentData.mobile);

  const shareOrDownloadBlob = useCallback(async (blob, filename, mimeType) => {
    try {
      const file = new File([blob], filename, { type: mimeType });
      if (isMobileDevice() && navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: filename });
        return;
      }
    } catch (err) {
      if (err && err.name === "AbortError") return;
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }, []);

  const exportMonthSheet = useCallback(async (kind, sheetLabel) => {
    const source = sheetRef.current;
    if (!source || !window.html2canvas || exporting) return;
    setExporting(kind);
    let wrapper = null;
    try {
      const CAPTURE_SCALE = 2;
      const CONTENT_W = 740;
      const clone = source.cloneNode(true);
      clone.style.zoom = "1";
      clone.style.width = `${CONTENT_W}px`;
      clone.style.margin = "0";
      wrapper = document.createElement("div");
      wrapper.style.position = "fixed";
      wrapper.style.top = "0";
      wrapper.style.left = "-99999px";
      wrapper.appendChild(clone);
      document.body.appendChild(wrapper);
      await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));

      const rawCanvas = await window.html2canvas(clone, {
        scale: CAPTURE_SCALE,
        backgroundColor: "#FFFFFF",
        useCORS: true,
      });
      document.body.removeChild(wrapper);
      wrapper = null;

      const safeName = sheetLabel.replace(/[\\/:*?"<>|]/g, "").trim();
      if (kind === "image") {
        await new Promise((resolve) => {
          rawCanvas.toBlob(async (blob) => {
            if (blob) await shareOrDownloadBlob(blob, `${safeName}.png`, "image/png");
            resolve();
          }, "image/png");
        });
      } else {
        const { jsPDF } = window.jspdf;
        const imgData = rawCanvas.toDataURL("image/jpeg", 0.95);
        const pdfW = rawCanvas.width / CAPTURE_SCALE;
        const pdfH = rawCanvas.height / CAPTURE_SCALE;
        const pdf = new jsPDF({ orientation: pdfW > pdfH ? "landscape" : "portrait", unit: "px", format: [pdfW, pdfH] });
        pdf.addImage(imgData, "JPEG", 0, 0, pdfW, pdfH);
        await shareOrDownloadBlob(pdf.output("blob"), `${safeName}.pdf`, "application/pdf");
      }
    } catch (err) {
      if (wrapper && wrapper.parentNode) wrapper.parentNode.removeChild(wrapper);
      console.error(err);
      alert("Couldn't export. Please try again.");
    }
    setExporting(null);
  }, [exporting, shareOrDownloadBlob]);

  if (!team) return null;
  const setName = (roleId, value, slotArg = slot) => {
    if (locked) return;
    updateMonthState((prev) => {
      const key = assignKey(week, slotArg, team.id, roleId);
      const oldValue = norm(prev.assignments[key]);
      const nextAssignments = { ...prev.assignments };
      if (norm(value)) nextAssignments[key] = value;
      else delete nextAssignments[key];
      let nextEditMeta = withEditMeta({ ...(prev.editMeta || {}) }, key, userName);
      // First service -> copy to the other services, but only where they
      // are still empty or same as the old value (so edited ones stay as is)
      const role = team.roles.find((r) => r.id === roleId);
      if (copiesFirstSlot(role) && slotArg === SLOTS[0]) {
        SLOTS.slice(1).forEach((otherSlot) => {
          const otherKey = assignKey(week, otherSlot, team.id, roleId);
          if (norm(nextAssignments[otherKey]) !== oldValue) return;
          if (norm(value)) nextAssignments[otherKey] = value;
          else delete nextAssignments[otherKey];
          nextEditMeta = withEditMeta(nextEditMeta, otherKey, userName);
        });
      }
      return { ...prev, assignments: nextAssignments, editMeta: nextEditMeta };
    });
  };
  const setVerse = (roleId, value, slotArg = slot) => {
    if (locked) return;
    updateMonthState((prev) => {
      const key = assignKey(week, slotArg, team.id, roleId);
      const nextVerses = { ...(prev.verses || {}) };
      if (norm(value)) nextVerses[key] = value;
      else delete nextVerses[key];
      const nextEditMeta = withEditMeta({ ...(prev.editMeta || {}) }, key + "__verse", userName);
      return { ...prev, verses: nextVerses, editMeta: nextEditMeta };
    });
  };
  const hasAnyValue = team.roles.some((role) => SLOTS.some((s) => {
    const key = assignKey(week, s, team.id, role.id);
    return norm(monthState.assignments[key]) || norm((monthState.verses || {})[key]);
  }));
  const confirmClearAll = () => {
    setConfirmOpen(false);
    updateMonthState((prev) => {
      const nextAssignments = { ...prev.assignments };
      const nextVerses = { ...(prev.verses || {}) };
      let nextEditMeta = { ...(prev.editMeta || {}) };
      team.roles.forEach((role) => SLOTS.forEach((s) => {
        const key = assignKey(week, s, team.id, role.id);
        delete nextAssignments[key];
        delete nextVerses[key];
        nextEditMeta = withEditMeta(nextEditMeta, key, userName);
        nextEditMeta = withEditMeta(nextEditMeta, key + "__verse", userName);
      }));
      return { ...prev, assignments: nextAssignments, verses: nextVerses, editMeta: nextEditMeta };
    });
  };
  if (mode === "print") {
    const monthLabelText = monthLabel(year, month);
    const sheetLabel = `${team.name} - ${monthLabelText}`;
    const printSettings = config.printSettings || {};
    // Only include weeks that actually fall in this month (or have a manual
    // date override) — a 5th week that doesn't correspond to a real Sunday
    // was rendering as a whole extra blank table, wasting space.
    // "Online Prayer Lead" is a Thursday role. To keep every printed date
    // inside the month being printed, week n uses the nth Thursday OF THIS
    // MONTH (never a Thursday from the previous/next month). A week with a
    // Sunday but no matching Thursday just skips that row, and a Thursday
    // with no matching Sunday gets its own small block.
    const nthThursdayOfMonth = (w) => {
      if (!(year && month)) return null;
      const first = new Date(year, month - 1, 1);
      const day = 1 + ((4 - first.getDay() + 7) % 7) + (w - 1) * 7;
      const d = new Date(year, month - 1, day);
      return d.getMonth() === month - 1 ? d : null;
    };
    const weeksData = WEEKS.map((w) => {
      const manual = norm(monthState.weekLabels && monthState.weekLabels[w]);
      const hasSunday = !!(manual || (year && month && nthSundayOfMonth(year, month, w)));
      const thu = nthThursdayOfMonth(w);
      return {
        week: w,
        hasSunday,
        dateLabel: hasSunday ? weekDisplayLabel(w, monthState.weekLabels, year, month) : null,
        thursdayLabel: thu ? `Thursday, ${MONTH_NAMES[thu.getMonth()]} ${thu.getDate()}` : null,
      };
    }).filter((w) => w.hasSunday || (w.thursdayLabel && team.roles.some((r) => norm(r.name).toLowerCase() === "online prayer lead")));
    const isThursdayRole = (r) => norm(r.name).toLowerCase() === "online prayer lead";
    const sundayRoles = team.roles.filter((r) => !isThursdayRole(r));
    const thursdayRoles = team.roles.filter(isThursdayRole);
    // Plain Excel/Google-Sheets-style grid: dark navy date bar, a medium
    // blue for both the time-slot header row and the role-name column, thin
    // black gridlines, white value cells. No card chrome, shadow, rounded
    // corners, or watermark — this view is meant to be screenshotted/printed
    // as a clean roster, not styled like the rest of the app.
    const NAVY_DARK = "#153D64";
    const NAVY_MED = "#215C98";
    const GRID = "#000000";
    const dateBarCell = { background: NAVY_DARK, color: "#FFFFFF", fontWeight: 700, fontSize: 13, textAlign: "center", padding: "6px 8px", border: `1px solid ${GRID}` };
    const headerCell = { background: NAVY_MED, color: "#FFFFFF", fontWeight: 700, fontSize: 12, textAlign: "center", padding: "5px 8px", border: `1px solid ${GRID}` };
    const roleCell = { background: NAVY_MED, color: "#FFFFFF", fontWeight: 700, fontSize: 12.5, textAlign: "left", padding: "5px 10px", border: `1px solid ${GRID}`, whiteSpace: "nowrap" };
    const valueCell = { background: "var(--bFFFFFF)", color: "var(--t1A1A1A)", fontSize: 12.5, textAlign: "left", padding: "5px 10px", border: `1px solid ${GRID}`, whiteSpace: "normal" };
    return (
      <div className="print-sheet-wrap" style={styles.viewWrap}>
        <div className="no-print sheet-toolbar">
          <button onClick={() => setMode("edit")} style={{ ...styles.smallBtn, whiteSpace: "normal" }}>← Back</button>
          <button onClick={() => window.print()} style={{ ...styles.smallBtn, background: "var(--bA9782F)", whiteSpace: "normal" }}>🖨 Print</button>
          <button onClick={() => exportMonthSheet("image", sheetLabel)} disabled={!!exporting}
            style={{ ...styles.smallBtn, background: "var(--b2F4858)", opacity: exporting && exporting !== "image" ? 0.6 : 1, whiteSpace: "normal" }}>
            {exporting === "image" ? "Working…" : "🖼 Save as Image"}
          </button>
          <button onClick={() => exportMonthSheet("pdf", sheetLabel)} disabled={!!exporting}
            style={{ ...styles.smallBtn, background: "var(--b2F4858)", opacity: exporting && exporting !== "pdf" ? 0.6 : 1, whiteSpace: "normal" }}>
            {exporting === "pdf" ? "Working…" : "📄 Save as PDF"}
          </button>
        </div>
        <div className="sheet-scroll">
          {/* Plain block, same pattern as the Master List's sheet (styles.sheet):
              no flex/centering here, so this div and the table inside it are
              free to stretch to the full width of the printable page instead
              of shrink-wrapping to their content and leaving blank margin. */}
          <div ref={sheetRef} className="paper" style={{ background: "var(--bFFFFFF)", padding: 12, minWidth: 480 }}>
            {/* Same banner style as the Master List's run sheet (dark navy
                title bar + light-blue sub bar), just with the ministry name
                worked into the sub line instead of a single service time.
                No inline-block wrapper here either, so the banner spans the
                same full width as the table below it. */}
            <div style={{ border: "2px solid var(--l23211D)", marginBottom: 14, fontFamily: "Calibri, Arial, sans-serif" }}>
              <div style={styles.sheetBannerMain}>{printSettings.churchName || "VICTORY ALFONSO CHURCH SUNDAY SERVICE"}</div>
              <div style={styles.sheetBannerSub}>
                {[printSettings.campus || "VICTORY ALFONSO", team.name, monthLabelText].filter(Boolean).join(" | ")}
              </div>
            </div>
            {weeksData.length === 0 ? (
              <div style={{ fontFamily: "Calibri, Arial, sans-serif", color: "var(--t8A7F5E)", textAlign: "center", padding: 20 }}>
                No Sundays found for this month.
              </div>
            ) : (
              // One shared table for the whole sheet (not a separate table per
              // week) so the browser sizes every column to fit the widest
              // content across ALL weeks at once — columns hug the role names
              // and volunteer names tightly instead of sitting at a fixed
              // percentage width, and every week still lines up exactly since
              // it's literally the same table.
              <table style={{ borderCollapse: "collapse", fontFamily: "Calibri, Arial, sans-serif", width: "100%", tableLayout: "fixed" }}>
                {/* Fixed layout: role column gets a set share, and the 9am / 11am / 4pm
                    columns split the rest equally so they're always the same width. */}
                <colgroup>
                  <col style={{ width: "22%" }} />
                  {SLOTS.map((s) => (<col key={s} style={{ width: `${78 / SLOTS.length}%` }} />))}
                </colgroup>
                {weeksData.map((w, wi) => (
                  // Each week gets its own tbody (still the same shared table,
                  // so column widths stay lined up across every week) with
                  // break-inside: avoid so the browser's print pagination
                  // can't slice a week's block in half between pages — it
                  // pushes the whole block to the next page instead.
                  <tbody key={w.week} style={{ breakInside: "avoid", pageBreakInside: "avoid" }}>
                    {wi > 0 && (
                      <tr><td colSpan={1 + SLOTS.length} style={{ border: "none", padding: 0, height: 14 }} /></tr>
                    )}
                    {w.hasSunday && (
                      <tr>
                        <th colSpan={1 + SLOTS.length} style={dateBarCell}>{w.dateLabel}</th>
                      </tr>
                    )}
                    {w.hasSunday && (
                      <tr>
                        <th style={headerCell}></th>
                        {SLOTS.map((s) => (<th key={s} style={headerCell}>{s.replace("AM", "am").replace("PM", "pm")}</th>))}
                      </tr>
                    )}
                    {!w.hasSunday ? null : team.roles.length === 0 ? (
                      <tr><td style={valueCell} colSpan={1 + SLOTS.length}>No roles set up for this team yet.</td></tr>
                    ) : (
                      sundayRoles.map((role) => (
                        <tr key={role.id}>
                          <td style={roleCell}>{role.name}</td>
                          {SLOTS.map((s) => {
                            const key = assignKey(w.week, s, team.id, role.id);
                            const name = monthState.assignments[key] || "";
                            const verse = (monthState.verses || {})[key] || "";
                            return (
                              <td key={s} style={valueCell}>
                                {name}
                                {role.hasVerse && verse && (
                                  <div style={{ fontSize: 10.5, color: "var(--t6B6B6B)", marginTop: 2, whiteSpace: "normal" }}>{verse}</div>
                                )}
                              </td>
                            );
                          })}
                        </tr>
                      ))
                    )}
                    {w.thursdayLabel && thursdayRoles.map((role) => {
                      // One name per week: collect whatever was assigned in any time slot.
                      const names = [];
                      SLOTS.forEach((s) => {
                        const nm = norm(monthState.assignments[assignKey(w.week, s, team.id, role.id)]);
                        if (nm && !names.includes(nm)) names.push(nm);
                      });
                      return (
                        <tr key={role.id}>
                          <td style={roleCell}>{role.name}</td>
                          <td style={valueCell} colSpan={SLOTS.length}>
                            <span style={{ fontWeight: 700 }}>{w.thursdayLabel}</span>
                            {names.length > 0 ? ` — ${names.join(" / ")}` : ""}
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                ))}
              </table>
            )}
          </div>
        </div>
      </div>
    );
  }

  if (showEvents) {
    return <TeamEventsAssign config={config} updateConfig={updateConfig} team={team} locked={locked} isMobile={isMobile} onBack={() => setShowEvents(false)} />;
  }

  return (
    <div style={styles.viewWrap}>
      {/* On desktop the title, month picker, Sunday dates and service-time chips are one
          frozen block that stays pinned while the roles scroll underneath. */}
      <div style={isMobile ? undefined : { position: "sticky", top: 0, zIndex: 20, background: "var(--bF6F1E4)", paddingTop: 8 }}>
      <header style={{ ...styles.viewHeader, ...(isMobile ? {} : { marginBottom: 4 }) }}>
        <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 12, flexWrap: "wrap" }}>
          <h1 style={isMobile ? styles.h1 : { ...styles.h1, lineHeight: 1.1 }}>{team.name}</h1>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <button onClick={() => setShowEvents(true)} style={{ ...styles.smallBtn, background: "var(--b2F4858)" }}>📅 Events</button>
            <button onClick={() => setMode("print")} className="btn-print" style={styles.smallBtn}>🖨 Print month</button>
            {!locked && (
              <button onClick={() => hasAnyValue && setConfirmOpen(true)} disabled={!hasAnyValue} className="btn-clear"
                style={{ ...styles.smallBtn, background: "var(--bA6402F)", opacity: hasAnyValue ? 1 : 0.45, cursor: hasAnyValue ? "pointer" : "default" }}>
                Clear all
              </button>
            )}
            <ThemeToggle className="theme-toggle-view" />
          </div>
        </div>
        <div style={{ ...styles.viewMeta, display: "flex", alignItems: "center", flexWrap: "wrap", gap: 8, ...(isMobile ? {} : { marginTop: 2 }) }}>
          {!isMobile && (
            <div className="no-print month-nav-keep" style={styles.headerMonthNav}>
              <button onClick={onPrevMonth} style={styles.headerMonthBtn} aria-label="Previous month">‹</button>
              <div style={styles.headerMonthLabel}>{monthLabel(year, month)}</div>
              <button onClick={onNextMonth} style={styles.headerMonthBtn} aria-label="Next month">›</button>
            </div>
          )}
          <span>
          {isMobile
            ? weekDisplayLabel(week, monthState.weekLabels, year, month)
            : (norm(monthState.weekLabels && monthState.weekLabels[week])
                ? weekDisplayLabel(week, monthState.weekLabels, year, month)
                : "")}{isMobile ? " · All services" : ""}
          </span>
          {team.flexible && <span style={styles.flexTag}>compatible with every team</span>}
          {locked && <span style={styles.flexTag}>view only — you can only edit your ministry</span>}
        </div>
      </header>
      {/* Column header: one colored chip per service time, so every role row
          below shows all the services side by side and nobody has to switch
          time slots to fill in the 11:00 AM or 4:00 PM names. It sits outside
          rolesCard (which scrolls horizontally) so it can stay pinned to the
          top while scrolling. */}
      <div className="no-print" style={{
        ...(isMobile ? { position: "sticky", top: "env(safe-area-inset-top, 0px)", zIndex: 20 } : {}),
        background: "var(--bF6F1E4)", display: "flex", alignItems: "center",
        ...(isMobile ? { padding: "6px 0 8px", gap: 0 } : { padding: "4px 23px 8px 0", gap: 20 }),
      }}>
        {!isMobile && (
          <div style={{ width: 233, flexShrink: 0, display: "flex", gap: 5 }}>
            {WEEKS.map((w) => {
              const text = weekButtonText(w, monthState.weekLabels, year, month);
              if (!text && w !== week) return null;
              const active = w === week;
              return (
                <button key={w} onClick={() => setWeek(w)} aria-label={`Service date ${weekDisplayLabel(w, monthState.weekLabels, year, month)}`}
                  style={{
                    flex: 1, minWidth: 0, height: 46, borderRadius: 10, cursor: "pointer", padding: 0,
                    display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 1,
                    fontFamily: "system-ui, sans-serif",
                    border: `1px solid ${active ? "var(--l1F3864)" : "var(--lD8CFB0)"}`,
                    background: active ? "var(--b1F3864)" : "var(--bFFFFFF)",
                  }}>
                  <span style={{ fontSize: 8, fontWeight: 600, letterSpacing: "0.08em", color: active ? "#E3C27A" : "var(--t8A7F5E)" }}>SUN</span>
                  <span style={{ fontSize: 16, fontWeight: active ? 700 : 600, color: active ? "#FFFFFF" : "var(--t1F3864)" }}>{text || "–"}</span>
                </button>
              );
            })}
          </div>
        )}
        <div style={{ flex: 1, minWidth: 0, display: "grid", gridTemplateColumns: `repeat(${SLOTS.length}, minmax(0, 1fr))`, gap: isMobile ? 6 : 10 }}>
          {SLOTS.map((s, si) => (
            <div key={s} className="slot-chip" data-slot={si} style={{
              background: slotColor(si), color: "#FFFFFF", fontWeight: 600, textAlign: "center",
              borderRadius: 8, fontFamily: "system-ui, sans-serif",
              ...(isMobile ? { fontSize: 11.5, padding: "8px 0" } : { fontSize: 14, padding: "9px 0" }),
            }}>{s}</div>
          ))}
        </div>
      </div>
      </div>
      <div style={styles.rolesCard}>
        {team.roles.length === 0 && <div style={styles.emptyNote}>This team has no roles yet. Add some under Manage teams.</div>}
        {team.roles.map((role, i) => {
          const roleVolunteers = (role.volunteers || []).slice().sort((a, b) => a.localeCompare(b));
          return (
            <div key={role.id} className="role-row" data-role={i % 4} style={{ ...styles.roleRow, ...(i % 2 === 1 ? styles.roleRowAlt : {}), borderTop: i === 0 ? "none" : "1px solid var(--lEFE7D3)", ...(isMobile ? { flexDirection: "column", gap: 8, padding: "12px 10px" } : {}) }}>
              <div style={{ ...styles.roleName, ...(isMobile ? { width: "100%", paddingTop: 0 } : {}) }}><span className="role-dot" style={styles.roleNameDot} />{role.name}</div>
                <div style={{ ...styles.roleInputWrap, ...(isMobile ? { width: "100%" } : {}) }}>
                <div style={{ display: "grid", gridTemplateColumns: `repeat(${SLOTS.length}, minmax(0, 1fr))`, gap: isMobile ? 6 : 10, alignItems: "start" }}>
                  {SLOTS.map((s, si) => {
                    const key = assignKey(week, s, team.id, role.id);
                    const value = monthState.assignments[key] || "";
                    const verseValue = (monthState.verses && monthState.verses[key]) || "";
                    const issues = findIssues(config, monthState, week, s, team.id, role.id, value);
                    const hasConflict = issues.some((x) => x.type === "Schedule Conflict");
                    const hasDup = issues.some((x) => x.type === "duplicate");
                    const dupIssues = issues.filter((x) => x.type === "duplicate");
                    const conflictIssues = issues.filter((x) => x.type === "Schedule Conflict");
                    const warningParts = [];
                    if (dupIssues.length > 0) warningParts.push(`Also serving as ${dupIssues.map((iss) => iss.role.name).join(" & ")} on this team`);
                    if (conflictIssues.length > 0) warningParts.push(`Also scheduled for ${conflictIssues.map((iss) => `${iss.team.name} — ${iss.role.name}`).join(" & ")}`);
                    const nameWarningText = warningParts.length > 0 ? warningParts.join(" | ") : null;
                    const meta = (monthState.editMeta && monthState.editMeta[key]) || null;
                    const verseMeta = (monthState.editMeta && monthState.editMeta[key + "__verse"]) || null;
                    // On a phone each column is only ~90px wide, so the field gets
                    // smaller text/padding and wraps long names instead of cutting them off.
                    const cellStyle = isMobile ? { padding: "7px 5px", fontSize: 12, lineHeight: 1.25, minHeight: 38, borderLeft: "1px solid var(--lD8CFB0)" } : {};
                    return (
                      <div key={s} className={"vol-slot" + (hasConflict || hasDup ? " vol-warn" : "")} data-slot={si} style={{ minWidth: 0 }}>

                            style={{ ...styles.input, width: "100%", boxSizing: "border-box", ...(isMobile ? { padding: "6px 5px", fontSize: 12, borderLeft: "1px solid var(--lD8CFB0)" } : {}), ...(locked ? { background: "var(--bF3EFE2)", cursor: "default" } : {}) }}

                </div>

                    <button

                        ) : (

                              </span>
                            ))}
                          </div>
                        )}
                        <div style={{ display: "flex", gap: 6, alignItems: "flex-start", flexWrap: "wrap" }}>
                          <textarea
                            value={volDraft[role.id] || ""}
                            onChange={(e) => setVolDraft((prev) => ({ ...prev, [role.id]: e.target.value }))}
                            onKeyDown={(e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); addVolunteers(role.id); } }}
                            placeholder="Add volunteer name(s)…"
                            rows={1}
                            style={{ ...styles.input, width: "auto", flex: 1, minWidth: 160, resize: "vertical", minHeight: 38, boxSizing: "border-box", fontFamily: "system-ui, sans-serif" }} />

                        </div>
                      </div>
                    )}

                )}

            </div>
          );
        })}
      </div>
      {confirmOpen && (
        <ClearNamesModal teamName={team.name} onCancel={() => setConfirmOpen(false)} onConfirm={confirmClearAll}
          body={`This will remove all volunteer names and verses from this ministry tab for this week (${SLOTS.join(", ")}), and update the Master List.`} />
      )}
    </div>
  );
}

// Lets the signed-in user change the name they show up as on the schedule
// (their Firebase displayName). Purely cosmetic/matching — see the note by
// updateNickname in App for why this never affects edit access.
function RenameModal({ currentName, onRenameUser, onDone }) {
  const [value, setValue] = useState(currentName || "");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");

  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onDone(); };
    document.addEventListener("keydown", onKey);
    return () => document.removeEventListener("keydown", onKey);
  }, [onDone]);

  const save = async () => {
    if (!norm(value)) { setError("Enter a name."); return; }
    setBusy(true);
    setError("");
    const result = await onRenameUser(value);
    setBusy(false);
    if (result && result.ok) {
      onDone();
    } else {
      setError((result && result.error) || "Couldn't save that name.");
    }
  };

  return ReactDOM.createPortal(
    <div className="no-print" style={styles.modalOverlay} onMouseDown={(e) => { if (e.target === e.currentTarget) onDone(); }}>
      <div style={styles.modalCard}>
        <div style={styles.modalIconRow}>
          <div style={{ ...styles.modalIconBadge, background: "var(--b1F3864)" }}>✎</div>
          <div style={styles.modalTitle}>Edit Your Name</div>
        </div>
        <div style={styles.modalBody}>
          This is the name shown on the schedule and used to match your
          assignments. It doesn't affect who can edit — that's controlled by
          your team leader's Editors list.
        </div>
        <input type="text" value={value} autoFocus
          onChange={(e) => setValue(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") save(); }}
          placeholder="e.g. Zerah Torres" style={{ ...styles.input, marginBottom: error ? 8 : 16 }} />
        {error && <div style={{ color: "var(--tA6402F)", fontSize: 12.5, fontFamily: "system-ui, sans-serif", marginBottom: 16 }}>{error}</div>}
        <div style={styles.modalActions}>
          <button onClick={onDone} style={styles.modalCancelBtn} disabled={busy}>Cancel</button>
          <button onClick={save} style={{ ...styles.smallBtn, padding: "9px 18px", opacity: busy ? 0.6 : 1 }} disabled={busy}>
            {busy ? "Saving…" : "Save"}
          </button>
        </div>
      </div>
    </div>,
    document.body
  );
}

// Lets a signed-in user change their own account password from inside the
// app, instead of having to sign out and use the "forgot password" email
// link. Firebase requires a recent sign-in for a change like this, so the
// user re-enters their current password first, which we use to re-
// authenticate before setting the new one.
function ChangePasswordModal({ onChangePassword, onDone }) {
  const [currentPassword, setCurrentPassword] = useState("");
  const [newPassword, setNewPassword] = useState("");
  const [confirmPassword, setConfirmPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  const [done, setDone] = useState(false);
  const [showCurrent, setShowCurrent] = useState(false);
  const [showNew, setShowNew] = useState(false);
  const [showConfirm, setShowConfirm] = useState(false);

  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onDone(); };
    document.addEventListener("keydown", onKey);
    return () => document.removeEventListener("keydown", onKey);
  }, [onDone]);

  const save = async () => {
    setError("");
    if (!currentPassword) { setError("Enter your current password."); return; }
    if (!newPassword || newPassword.length < 6) { setError("New password should be at least 6 characters."); return; }
    if (newPassword !== confirmPassword) { setError("New passwords don't match."); return; }
    setBusy(true);
    const result = await onChangePassword(currentPassword, newPassword);
    setBusy(false);
    if (result && result.ok) {
      setDone(true);
    } else {
      setError((result && result.error) || "Couldn't change your password.");
    }
  };

  return ReactDOM.createPortal(
    <div className="no-print" style={styles.modalOverlay} onMouseDown={(e) => { if (e.target === e.currentTarget) onDone(); }}>
      <div style={styles.modalCard}>
        <div style={styles.modalIconRow}>
          <div style={{ ...styles.modalIconBadge, background: "var(--b1F3864)" }}>🔒</div>
          <div style={styles.modalTitle}>Change Password</div>
        </div>
        {done ? (
          <React.Fragment>
            <div style={styles.modalBody}>Your password has been updated.</div>
            <div style={styles.modalActions}>
              <button onClick={onDone} style={{ ...styles.smallBtn, padding: "9px 18px" }}>Done</button>
            </div>
          </React.Fragment>
        ) : (
          <React.Fragment>
            <div style={styles.modalBody}>
              Enter your current password, then choose a new one.
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: error ? 8 : 16 }}>
              <div style={styles.passwordFieldWrap}>
                <input type={showCurrent ? "text" : "password"} value={currentPassword} autoFocus autoComplete="current-password"
                  onChange={(e) => setCurrentPassword(e.target.value)}
                  placeholder="Current password" style={{ ...styles.input, paddingRight: 40 }} />
                <button type="button" onClick={() => setShowCurrent((s) => !s)} style={styles.passwordToggleBtn}
                  aria-label={showCurrent ? "Hide password" : "Show password"} title={showCurrent ? "Hide password" : "Show password"}>
                  {showCurrent ? <EyeOffIcon /> : <EyeIcon />}
                </button>
              </div>
              <div style={styles.passwordFieldWrap}>
                <input type={showNew ? "text" : "password"} value={newPassword} autoComplete="new-password"
                  onChange={(e) => setNewPassword(e.target.value)}
                  placeholder="New password" style={{ ...styles.input, paddingRight: 40 }} />
                <button type="button" onClick={() => setShowNew((s) => !s)} style={styles.passwordToggleBtn}
                  aria-label={showNew ? "Hide password" : "Show password"} title={showNew ? "Hide password" : "Show password"}>
                  {showNew ? <EyeOffIcon /> : <EyeIcon />}
                </button>
              </div>
              <div style={styles.passwordFieldWrap}>
                <input type={showConfirm ? "text" : "password"} value={confirmPassword} autoComplete="new-password"
                  onChange={(e) => setConfirmPassword(e.target.value)}
                  onKeyDown={(e) => { if (e.key === "Enter") save(); }}
                  placeholder="Confirm new password" style={{ ...styles.input, paddingRight: 40 }} />
                <button type="button" onClick={() => setShowConfirm((s) => !s)} style={styles.passwordToggleBtn}
                  aria-label={showConfirm ? "Hide password" : "Show password"} title={showConfirm ? "Hide password" : "Show password"}>
                  {showConfirm ? <EyeOffIcon /> : <EyeIcon />}
                </button>
              </div>
            </div>
            {error && <div style={{ color: "var(--tA6402F)", fontSize: 12.5, fontFamily: "system-ui, sans-serif", marginBottom: 16 }}>{error}</div>}
            <div style={styles.modalActions}>
              <button onClick={onDone} style={styles.modalCancelBtn} disabled={busy}>Cancel</button>
              <button onClick={save} style={{ ...styles.smallBtn, padding: "9px 18px", opacity: busy ? 0.6 : 1 }} disabled={busy}>
                {busy ? "Saving…" : "Save"}
              </button>
            </div>
          </React.Fragment>
        )}
      </div>
    </div>,
    document.body
  );
}

// A volunteer-name text input with a custom popup dropdown of saved names for
// this role. The dropdown is rendered through a portal into document.body
// and positioned with position:fixed against the input's own bounding box,
// so it floats above everything (never gets clipped by a scrolling/overflow
// ancestor like the roles card) and always has room to fully show itself.
// Opening it via click/focus always shows the FULL saved list for the role
// (not narrowed to whatever text is already in the box) so a name that's
// already been chosen — including one currently flagged as a conflict or
// duplicate — can still be swapped for someone else with one click. Typing
// further narrows the list as usual. Selecting a suggestion, or typing a
// brand new name, only fills the field — it never writes back to the saved
// Press-and-hold "last changed by" info badge. Sits absolutely inside a
// position:relative wrapper around a field, at the field's right edge.
// Anchor its coordinates off `anchorRef` (the field itself) so the tooltip
// is portaled to <body> with fixed positioning — this keeps it from being
// clipped by any ancestor's overflow (e.g. the scrollable roles card).
function LastChangedBadge({ meta, anchorRef, align }) {
  const [show, setShow] = useState(false);
  const [coords, setCoords] = useState(null);
  const [shiftX, setShiftX] = useState(0);
  const tooltipRef = useRef(null);
  const metaTime = metaTimeText(meta);
  const hasMeta = hasMetaInfo(meta);

  const updateCoords = useCallback(() => {
    const el = anchorRef.current;
    if (!el) return;
    const rect = el.getBoundingClientRect();
    setCoords({ top: rect.bottom + 6, right: window.innerWidth - rect.right });
  }, [anchorRef]);

  useEffect(() => {
    if (!show) return;
    updateCoords();
    window.addEventListener("scroll", updateCoords, true);
    window.addEventListener("resize", updateCoords);
    return () => {
      window.removeEventListener("scroll", updateCoords, true);
      window.removeEventListener("resize", updateCoords);
    };
  }, [show, updateCoords]);

  // Nudge the tooltip back onto the screen if it would spill past the
  // left/right edge once its actual rendered width is known.
  useEffect(() => {
    if (!show || !coords || !tooltipRef.current) { setShiftX(0); return; }
    const margin = 8;
    const rect = tooltipRef.current.getBoundingClientRect();
    let shift = 0;
    if (rect.right > window.innerWidth - margin) shift -= (rect.right - (window.innerWidth - margin));
    if (rect.left + shift < margin) shift += (margin - (rect.left + shift));
    setShiftX(shift);
  }, [show, coords]);

  if (!hasMeta) return null;

  return (
    <React.Fragment>
      <button
        type="button"
        aria-label="Last changed by"
        onMouseDown={(e) => { e.preventDefault(); updateCoords(); setShow(true); }}
        onMouseUp={() => setShow(false)}
        onMouseLeave={() => setShow(false)}
        onTouchStart={(e) => { e.preventDefault(); updateCoords(); setShow(true); }}
        onTouchEnd={() => setShow(false)}
        onTouchCancel={() => setShow(false)}
        onContextMenu={(e) => e.preventDefault()}
        style={{
          position: "absolute", right: 8,
          ...(align === "top" ? { top: 10 } : { top: "50%", transform: "translateY(-50%)" }),
          width: 22, height: 22, borderRadius: "50%", border: "none", padding: 0,
          display: "flex", alignItems: "center", justifyContent: "center",
          background: show ? "var(--bD8CFB0)" : "transparent",
          cursor: "pointer", overflow: "hidden",
          userSelect: "none", WebkitUserSelect: "none", WebkitTouchCallout: "none", touchAction: "manipulation",
          transition: "background 0.15s ease",
        }}
      >
        <span style={{
          position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center",
          fontSize: 13, fontWeight: 700, fontFamily: "Georgia, serif",
          color: "var(--tA99B72)", lineHeight: 1,
          opacity: show ? 0 : 1, transform: show ? "scale(0.4) rotate(-20deg)" : "scale(1) rotate(0deg)",
          transition: "opacity 0.18s ease, transform 0.18s ease",
          pointerEvents: "none", WebkitTouchCallout: "none", WebkitUserSelect: "none", userSelect: "none",
        }}>i</span>
        <img src="./icons/victory.png" alt="" draggable="false" style={{
          position: "absolute", inset: 0, width: "100%", height: "100%", objectFit: "cover", objectPosition: "50% 50%", borderRadius: "50%",
          opacity: show ? 1 : 0, transform: show ? "scale(1) rotate(0deg)" : "scale(0.4) rotate(20deg)",
          transition: "opacity 0.18s ease, transform 0.18s ease",
          pointerEvents: "none", WebkitTouchCallout: "none", WebkitUserSelect: "none", userSelect: "none",
        }} />
      </button>
      {show && coords && ReactDOM.createPortal(
        <div ref={tooltipRef} className="no-print" style={{
          position: "fixed", top: coords.top, right: coords.right, zIndex: 1000001,
          background: "#2A2620", color: "#F6F1E4", fontSize: 11.5, fontStyle: "italic",
          fontFamily: "system-ui, sans-serif", padding: "6px 10px", borderRadius: 6,
          whiteSpace: "nowrap", boxShadow: "0 6px 14px rgba(0,0,0,0.25)", pointerEvents: "none",
          transform: `translateX(${shiftX}px)`,
        }}>
          Last changed by {meta.by}{metaTime ? ` · ${metaTime}` : ""}
        </div>,
        document.body
      )}
    </React.Fragment>
  );
}

// Small inline "i" info icon for the Master List, standing in for the
// always-on "name · Xh ago" caption. Tap-and-hold (or hover on desktop)
// swaps the "i" for the victory logo and pops a "Last changed by" tooltip —
// same crossfade as LastChangedBadge above. Released/blurred, it reverts.
// Renders nothing when there's no edit history to show. Deliberately a
// plain inline element (not a flex wrapper) so it sits inside the name
// text like a word and wraps with it, instead of forcing the name onto
// one unbreakable line that can overflow its column.
function MasterEditInfo({ meta, style }) {
  const [show, setShow] = useState(false);
  const [coords, setCoords] = useState(null);
  const [shiftX, setShiftX] = useState(0);
  const btnRef = useRef(null);
  const tooltipRef = useRef(null);
  const metaTime = metaTimeText(meta);
  const hasMeta = hasMetaInfo(meta);

  const updateCoords = useCallback(() => {
    const el = btnRef.current;
    if (!el) return;
    const rect = el.getBoundingClientRect();
    setCoords({ top: rect.bottom + 6, left: rect.left });
  }, []);

  useEffect(() => {
    if (!show) return;
    updateCoords();
    window.addEventListener("scroll", updateCoords, true);
    window.addEventListener("resize", updateCoords);
    return () => {
      window.removeEventListener("scroll", updateCoords, true);
      window.removeEventListener("resize", updateCoords);
    };
  }, [show, updateCoords]);

  // Once the tooltip is actually in the DOM, measure it and nudge it back
  // onto the screen if it would otherwise spill past the left/right edge —
  // this is what keeps "Last changed by ..." readable near screen edges.
  useEffect(() => {
    if (!show || !coords || !tooltipRef.current) { setShiftX(0); return; }
    const margin = 8;
    const rect = tooltipRef.current.getBoundingClientRect();
    let shift = 0;
    if (rect.right > window.innerWidth - margin) shift -= (rect.right - (window.innerWidth - margin));
    if (rect.left + shift < margin) shift += (margin - (rect.left + shift));
    setShiftX(shift);
  }, [show, coords]);

  if (!hasMeta) return null;

  return (
    <React.Fragment>
      <button
        ref={btnRef}
        type="button"
        aria-label="Last changed by"
        onMouseDown={(e) => { e.preventDefault(); updateCoords(); setShow(true); }}
        onMouseUp={() => setShow(false)}
        onMouseLeave={() => setShow(false)}
        onTouchStart={(e) => { e.preventDefault(); updateCoords(); setShow(true); }}
        onTouchEnd={() => setShow(false)}
        onTouchCancel={() => setShow(false)}
        onContextMenu={(e) => e.preventDefault()}
        style={{ ...styles.masterMetaBtn, background: show ? "var(--bD8CFB0)" : "transparent", ...(style || {}) }}
      >
        <span style={{
          position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center",
          fontSize: 10.5, fontWeight: 700, fontFamily: "Georgia, serif",
          color: "var(--tA99B72)", lineHeight: 1,
          opacity: show ? 0 : 1, transform: show ? "scale(0.4) rotate(-20deg)" : "scale(1) rotate(0deg)",
          transition: "opacity 0.18s ease, transform 0.18s ease",
          pointerEvents: "none", WebkitTouchCallout: "none", WebkitUserSelect: "none", userSelect: "none",
        }}>i</span>
        <img src="./icons/victory.png" alt="" draggable="false" style={{
          position: "absolute", inset: 0, width: "100%", height: "100%", objectFit: "cover", objectPosition: "50% 50%", borderRadius: "50%",
          opacity: show ? 1 : 0, transform: show ? "scale(1) rotate(0deg)" : "scale(0.4) rotate(20deg)",
          transition: "opacity 0.18s ease, transform 0.18s ease",
          pointerEvents: "none", WebkitTouchCallout: "none", WebkitUserSelect: "none", userSelect: "none",
        }} />
      </button>
      {show && coords && ReactDOM.createPortal(
        <div ref={tooltipRef} className="no-print" style={{
          position: "fixed", top: coords.top, left: coords.left, zIndex: 1000001,
          background: "#2A2620", color: "#F6F1E4", fontSize: 11.5, fontStyle: "italic",
          fontFamily: "system-ui, sans-serif", padding: "6px 10px", borderRadius: 6,
          whiteSpace: "nowrap", boxShadow: "0 6px 14px rgba(0,0,0,0.25)", pointerEvents: "none",
          transform: `translateX(${shiftX}px)`,
        }}>
          Last changed by {meta.by}{metaTime ? ` · ${metaTime}` : ""}
        </div>,
        document.body
      )}
    </React.Fragment>
  );
}

// Plain text/number/textarea field with an optional press-and-hold "last
// changed by" badge at its right edge. Used anywhere a single field (not
// the volunteer-name autocomplete) needs its own edit-attribution.
function TextFieldWithMeta({ value, onChange, locked, placeholder, style, meta, multiline, rows, inputMode, align, wrapStyle }) {
  const ref = useRef(null);
  const hasMeta = hasMetaInfo(meta);
  const fieldStyle = hasMeta ? { ...style, paddingRight: 34 } : style;
  return (
    <div style={{ position: "relative", ...(wrapStyle || {}) }}>
      {multiline ? (
        <textarea ref={ref} value={value} onChange={(e) => onChange(e.target.value)}
          placeholder={placeholder} readOnly={locked} rows={rows} style={fieldStyle} />
      ) : (
        <input ref={ref} value={value} onChange={(e) => onChange(e.target.value)}
          placeholder={placeholder} readOnly={locked} inputMode={inputMode} style={fieldStyle} autoComplete="off" />
      )}
      {hasMeta && <LastChangedBadge meta={meta} anchorRef={ref} align={align} />}
    </div>
  );
}

// volunteer list on its own; that list is only ever edited deliberately
// from Manage Teams.
// compact: used for the narrow 3-column phone cells — names wrap instead of
//   truncating, and the search icon / "last changed" badge move into the picker
//   popup so they don't eat space inside a ~90px box.
// popupTitle / popupMinWidth: heading ("Admin · 11:00 AM") and minimum width
//   for the picker popup, so it's clear which box you're filling in.
function VolunteerNameInput({ value, onChange, volunteers, locked, placeholder, style, meta, allowAbove = true, warningText, compact = false, popupTitle, popupMinWidth = 0 }) {
  const [open, setOpen] = useState(false);
  const [closing, setClosing] = useState(false);
  const closeTimerRef = useRef(null);
  const [search, setSearch] = useState("");
  const [coords, setCoords] = useState(null);
  const [isEditing, setIsEditing] = useState(false);
  const wrapRef = useRef(null);
  const anchorRef = useRef(null);
  const popupRef = useRef(null);
  const viewportSettleTimer = useRef(null);
  const frozenPopupRef = useRef({ filtered: [], coords: null });

  // Closing plays a quick shrink-and-fade before it actually unmounts, so
  // the popup feels like it retracts rather than just vanishing.
  const closePopup = useCallback(() => {
    setOpen((wasOpen) => {
      if (!wasOpen) return wasOpen;
      setClosing(true);
      clearTimeout(closeTimerRef.current);
      closeTimerRef.current = setTimeout(() => setClosing(false), 150);
      return false;
    });
  }, []);

  useEffect(() => () => clearTimeout(closeTimerRef.current), []);
  // Whether to show the keyboard is about the input device, not window
  // width — a narrow desktop window is still mouse-driven, so we check
  // pointer type directly instead of reusing the layout's isMobile flag.
  const [isTouchDevice] = useState(() => (typeof window !== "undefined" && window.matchMedia ? window.matchMedia("(pointer: coarse)").matches : false));

  const hasMeta = hasMetaInfo(meta) && !compact;
  // On a touchscreen there's a keyboard to worry about, so clicking the box
  // only shows the picker; the search icon is the opt-in way to type. On a
  // mouse-driven device, clicking the box edits directly, like a normal field.
  const showSearchIcon = !locked && isTouchDevice && !compact;

  // Once the keyboard finishes opening (visualViewport stops changing), check
  // once whether it now covers the focused input, and if so nudge the page up
  // by exactly the overlap. Debounced so mid-animation resize events don't
  // each add their own extra scroll — that repeated stacking was the bounce.
  useEffect(() => {
    const vv = window.visualViewport;
    if (!vv) return;
    const handleViewportResize = () => {
      clearTimeout(viewportSettleTimer.current);
      viewportSettleTimer.current = setTimeout(() => {
        const el = anchorRef.current;
        if (!el || document.activeElement !== el) return;
        const rect = el.getBoundingClientRect();
        const visibleBottom = vv.offsetTop + vv.height;
        const overlap = rect.bottom - visibleBottom;
        if (overlap > 0) window.scrollBy(0, overlap + 12);
      }, 120);
    };
    vv.addEventListener("resize", handleViewportResize);
    return () => {
      vv.removeEventListener("resize", handleViewportResize);
      clearTimeout(viewportSettleTimer.current);
    };
  }, []);

  // Picks whichever side (below or above the input) has more room, and caps
  // the popup's height to whatever space is actually visible — so on phones
  // it lands above the on-screen keyboard instead of hiding behind it.
  const updateCoords = useCallback(() => {
    const el = anchorRef.current;
    if (!el) return;
    const rect = el.getBoundingClientRect();
    const vv = window.visualViewport;
    const layoutHeight = window.innerHeight;
    const visibleTop = vv ? vv.offsetTop : 0;
    const visibleBottom = vv ? vv.offsetTop + vv.height : layoutHeight;
    const gap = 6;
    const margin = 10;
    const spaceBelow = visibleBottom - rect.bottom - gap - margin;
    const spaceAbove = rect.top - visibleTop - gap - margin;
    // On mobile the role name sits directly above this input (stacked column
    // layout), so flipping the popup above it would hide which role is being
    // filled in. allowAbove === false keeps it pinned below no matter what.
    const below = allowAbove === false || spaceBelow >= 120 || spaceBelow >= spaceAbove;
    const maxHeight = Math.max(100, Math.min(240, below ? spaceBelow : spaceAbove));
    // A narrow box (like a phone's 3-column cell) would give a tiny popup, so
    // enforce a minimum width and keep it fully on screen.
    const popupWidth = Math.max(rect.width, Math.min(popupMinWidth, window.innerWidth - margin * 2));
    const popupLeft = Math.max(margin, Math.min(rect.left, window.innerWidth - popupWidth - margin));
    if (below) {
      let top = rect.bottom + gap;
      // Clamp so the popup never runs off the bottom of the visible viewport,
      // even when allowAbove === false forces it to stay below no matter what
      // (e.g. the very last field on the page, like Benediction, where there
      // isn't enough real room underneath it).
      const maxTop = visibleBottom - margin - maxHeight;
      if (top > maxTop) top = Math.max(visibleTop + margin, maxTop);
      setCoords({ left: popupLeft, width: popupWidth, top, bottom: null, maxHeight });
    } else {
      setCoords({ left: popupLeft, width: popupWidth, top: null, bottom: layoutHeight - rect.top + gap, maxHeight });
    }
  }, [allowAbove, popupMinWidth]);

  // Tapping the box on a touchscreen just shows the picker — no keyboard,
  // so nothing to scroll for. With a mouse it edits directly, like a normal field.
  // Cancels any pending close-animation teardown so reopening mid-exit
  // doesn't get its "closing" flag cleared out from under it later.
  const cancelClosing = () => {
    clearTimeout(closeTimerRef.current);
    setClosing(false);
  };

  const openPicker = () => {
    if (locked) return;
    if (!isTouchDevice) { startTyping(); return; }
    if ((volunteers || []).length === 0) { startTyping(); return; }
    setSearch("");
    updateCoords();
    cancelClosing();
    setOpen(true);
  };

  const startTyping = () => {
    if (locked) return;
    setSearch("");
    setIsEditing(true);
    cancelClosing();
    setOpen(true);
  };

  useEffect(() => {
    if (!isEditing) return;
    updateCoords();
    const el = anchorRef.current;
    if (el) el.focus({ preventScroll: true });
  }, [isEditing, updateCoords]);

  useEffect(() => {
    if (!open) return;
    updateCoords();
    const handleOutside = (e) => {
      if (wrapRef.current && wrapRef.current.contains(e.target)) return;
      if (popupRef.current && popupRef.current.contains(e.target)) return;
      closePopup();
      setIsEditing(false);
    };
    document.addEventListener("mousedown", handleOutside);
    window.addEventListener("scroll", updateCoords, true);
    window.addEventListener("resize", updateCoords);
    const vv = window.visualViewport;
    if (vv) {
      vv.addEventListener("resize", updateCoords);
      vv.addEventListener("scroll", updateCoords);
    }
    return () => {
      document.removeEventListener("mousedown", handleOutside);
      window.removeEventListener("scroll", updateCoords, true);
      window.removeEventListener("resize", updateCoords);
      if (vv) {
        vv.removeEventListener("resize", updateCoords);
        vv.removeEventListener("scroll", updateCoords);
      }
    };
  }, [open, updateCoords]);

  const pick = (v) => {
    onChange(v);
    setSearch("");
    closePopup();
    setIsEditing(false);
  };

  const filtered = isEditing
    ? (volunteers || []).filter((v) => normKey(v).includes(normKey(search)))
    : (volunteers || []);

  // While the popup is open we keep a frozen snapshot of its list/position;
  // once it starts closing we keep rendering that snapshot instead of the
  // live values, so the exit animation doesn't jump or change content
  // mid-flight while it fades out.
  if (open && coords) frozenPopupRef.current = { filtered, coords };
  const popupData = open ? { filtered, coords } : frozenPopupRef.current;

  const rightPad = (hasMeta ? 34 : 0) + (showSearchIcon ? 30 : 0);
  const boxStyle = rightPad ? { ...style, paddingRight: rightPad } : style;

  return (
    <div ref={wrapRef} style={{ position: "relative", flex: 1 }}>
      {isEditing ? (
        <input
          ref={anchorRef}
          value={value}
          onChange={(e) => {
            onChange(e.target.value);
            setSearch(e.target.value);
            updateCoords();
            cancelClosing();
            setOpen(true);
          }}
          onBlur={() => setIsEditing(false)}
          placeholder={placeholder}
          style={compact ? { ...boxStyle, fontSize: 16 } : boxStyle}
          autoComplete="off"
        />
      ) : (
        <div
          ref={anchorRef}
          role="button"
          tabIndex={locked ? -1 : 0}
          onClick={openPicker}
          onKeyDown={(e) => { if (!locked && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openPicker(); } }}
          style={{
            ...boxStyle,
            display: "flex", alignItems: "center",
            ...(value ? {} : { color: "var(--tA99B72)" }),
            cursor: locked ? "default" : "pointer",
          }}
        >
          <span style={compact ? { minWidth: 0, flex: 1, overflowWrap: "anywhere" } : { overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
            {value || placeholder}
          </span>
          {warningText && <WarningIcon text={warningText} style={{ marginLeft: compact ? 3 : 6 }} />}
        </div>
      )}
      {showSearchIcon && (
        <button type="button" aria-label="Type or search a name"
          onMouseDown={(e) => e.preventDefault()}
          onClick={startTyping}
          style={{
            position: "absolute", top: "50%", transform: "translateY(-50%)",
            right: hasMeta ? 34 : 8, width: 22, height: 22, borderRadius: "50%",
            border: "none", background: "transparent", color: "var(--tA99B72)",
            display: "flex", alignItems: "center", justifyContent: "center",
            cursor: "pointer", padding: 0,
          }}
        >
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
            <circle cx="11" cy="11" r="7" />
            <line x1="16.65" y1="16.65" x2="21" y2="21" />
          </svg>
        </button>
      )}
      {hasMeta && <LastChangedBadge meta={meta} anchorRef={anchorRef} />}
      {(open || closing) && !locked && popupData.filtered.length > 0 && popupData.coords && ReactDOM.createPortal(
        <div ref={popupRef}
          className={
            "no-print suggest-popup-anim " +
            (popupData.coords.top != null ? "suggest-popup-below " : "suggest-popup-above ") +
            (open ? "suggest-popup-in" : "suggest-popup-out")
          }
          style={{
            ...styles.suggestPopup,
            left: popupData.coords.left, width: popupData.coords.width, maxHeight: popupData.coords.maxHeight,
            ...(popupData.coords.top != null ? { top: popupData.coords.top, bottom: "auto" } : { bottom: popupData.coords.bottom, top: "auto" }),
          }}>
          {(popupTitle || compact) && (
            <div style={{ padding: "9px 14px 8px", borderBottom: "1px solid rgba(255,255,255,0.16)", color: "var(--tC9D5EE)", fontSize: 12, lineHeight: 1.35, fontFamily: "system-ui, sans-serif" }}>
              {popupTitle && <div style={{ fontWeight: 600, letterSpacing: 0.2 }}>{popupTitle}</div>}
              {compact && hasMetaInfo(meta) && (
                <div style={{ fontStyle: "italic", opacity: 0.85, marginTop: 2 }}>
                  Last changed by {meta.by}{metaTimeText(meta) ? ` · ${metaTimeText(meta)}` : ""}
                </div>
              )}
              {compact && isTouchDevice && !isEditing && (
                <button type="button"
                  onMouseDown={(e) => e.preventDefault()}
                  onClick={startTyping}
                  style={{ marginTop: 6, padding: "5px 10px", border: "none", borderRadius: 6, background: "rgba(255,255,255,0.14)", color: "var(--tEDF1FA)", fontSize: 12, fontFamily: "system-ui, sans-serif", cursor: "pointer" }}>
                  ✎ Type a name instead
                </button>
              )}
            </div>
          )}
          {popupData.filtered.map((v, i) => (
            <div key={v} className="volunteer-suggest-item"
              style={{ ...styles.suggestItem, borderTop: i === 0 ? "none" : "1px solid rgba(255,255,255,0.16)" }}
              onMouseDown={(e) => { e.preventDefault(); pick(v); }}>
              {v}
            </div>
          ))}
        </div>,
        document.body
      )}
    </div>
  );
}

// Small pulsing warning icon shown beside a name that's already booked for
// another role on the same team — replaces the old always-visible "Also
// serving as X on this team" text. Tap or hover to see which role.
function WarningIcon({ text, style }) {
  const [show, setShow] = useState(false);
  const [coords, setCoords] = useState(null);
  const [shiftX, setShiftX] = useState(0);
  const btnRef = useRef(null);
  const tooltipRef = useRef(null);

  const updateCoords = useCallback(() => {
    const el = btnRef.current;
    if (!el) return;
    const rect = el.getBoundingClientRect();
    setCoords({ top: rect.bottom + 6, left: rect.left });
  }, []);

  useEffect(() => {
    if (!show) return;
    updateCoords();
    window.addEventListener("scroll", updateCoords, true);
    window.addEventListener("resize", updateCoords);
    return () => {
      window.removeEventListener("scroll", updateCoords, true);
      window.removeEventListener("resize", updateCoords);
    };
  }, [show, updateCoords]);

  useEffect(() => {
    if (!show || !coords || !tooltipRef.current) { setShiftX(0); return; }
    const margin = 8;
    const rect = tooltipRef.current.getBoundingClientRect();
    let shift = 0;
    if (rect.right > window.innerWidth - margin) shift -= (rect.right - (window.innerWidth - margin));
    if (rect.left + shift < margin) shift += (margin - (rect.left + shift));
    setShiftX(shift);
  }, [show, coords]);

  return (
    <React.Fragment>
      <button
        type="button"
        ref={btnRef}
        aria-label={text}
        onMouseDown={(e) => { e.preventDefault(); e.stopPropagation(); updateCoords(); setShow(true); }}
        onMouseUp={(e) => { e.preventDefault(); e.stopPropagation(); setShow(false); }}
        onMouseLeave={() => setShow(false)}
        onTouchStart={(e) => { e.preventDefault(); e.stopPropagation(); updateCoords(); setShow(true); }}
        onTouchEnd={(e) => { e.preventDefault(); e.stopPropagation(); setShow(false); }}
        onTouchCancel={() => setShow(false)}
        onClick={(e) => { e.preventDefault(); e.stopPropagation(); }}
        onContextMenu={(e) => e.preventDefault()}
        style={{ ...styles.warnIconBtn, ...(style || {}) }}>     
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C24A3A" strokeWidth="2.3" strokeLinecap="round" strokeLinejoin="round">
          <path d="M12 3.5 L22 20.5 H2 Z" />
          <line x1="12" y1="9.5" x2="12" y2="14" />
          <circle cx="12" cy="17.2" r="0.6" fill="#C24A3A" stroke="none" />
        </svg>
      </button>
      {show && coords && ReactDOM.createPortal(
        <div ref={tooltipRef} className="no-print" style={{
          position: "fixed", top: coords.top, left: coords.left, zIndex: 1000001,
          background: "#2A2620", color: "#F6F1E4", fontSize: 12, fontStyle: "italic",
          fontFamily: "system-ui, sans-serif", padding: "6px 10px", borderRadius: 6,
          maxWidth: 240, boxShadow: "0 6px 14px rgba(0,0,0,0.25)", pointerEvents: "none",
          transform: `translateX(${shiftX}px)`,
        }}>
          {text}
        </div>,
        document.body
      )}
    </React.Fragment>
  );
}

  );
}

// Vertical middle (as a 0-1 fraction of the sheet's height) of the space
// between the first and last divider rows ("START OF ..." / "END OF ...").
// Returns null if the sheet has fewer than two dividers.
function dividerMidRatio(sheetEl) {
  if (!sheetEl) return null;
  const rows = sheetEl.querySelectorAll("tr[data-divider]");
  if (rows.length < 2) return null;
  const sr = sheetEl.getBoundingClientRect();
  if (!sr.height) return null;
  const a = rows[0].getBoundingClientRect();
  const b = rows[rows.length - 1].getBoundingClientRect();
  return ((a.bottom + b.top) / 2 - sr.top) / sr.height;
}
