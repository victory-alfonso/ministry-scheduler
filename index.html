const PRINT_EXTRA_COL_LABEL = "";

function MasterListView({ config, monthState, updateMonthState, week, slot, year, month }) {
  const [view, setView] = useState("list");
  const [search, setSearch] = useState("");
  const [exporting, setExporting] = useState(null); // null | "image" | "pdf"
  const sheetRef = useRef(null);
  const wmImgRef = useRef(null);

  // Phones/tablets get the native share sheet (Messenger, WhatsApp, etc. are
  // registered there); desktop/laptop browsers mostly aren't registered with
  // any chat apps as share targets, so there we skip straight to a normal
  // file download that the user can then attach wherever they like.
  const isMobileDevice = () =>
    /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
    (navigator.userAgentData && navigator.userAgentData.mobile);

  // Turns a Blob into either the device's native share sheet (so it can be
  // sent straight to Messenger/a group chat) or, if sharing files isn't
  // supported, a plain file download as a fallback.
  const shareOrDownloadBlob = useCallback(async (blob, filename, mimeType) => {
    try {
      const file = new File([blob], filename, { type: mimeType });
      if (isMobileDevice() && navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: filename });
        return;
      }
    } catch (err) {
      if (err && err.name === "AbortError") return; // user cancelled the share sheet
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }, []);

  const exportSheet = useCallback(async (kind, sheetLabel) => {
    const source = sheetRef.current;
    if (!source || !window.html2canvas || exporting) return;
    setExporting(kind);
    let wrapper = null;
    try {
      // Render a real, detached copy of the sheet at a fixed "desktop" width
      // — actually laid out by the browser itself (not a virtual clone deep
      // inside html2canvas), so column proportions come out exactly like a
      // real desktop view/print, never squeezed or oddly stretched. It's
      // parked off-screen so the user's own on-screen view never flickers.
      const CAPTURE_SCALE = 2; // pixel-density multiplier for a crisp raster
      const CONTENT_W = 740; // css px matching the printable width on a letter page
      const clone = source.cloneNode(true);
      clone.style.zoom = "1"; // in case the live sheet was mid print-shrink
      clone.style.width = `${CONTENT_W}px`;
      clone.style.margin = "0";
      // The table is stretched to fill the page below, but the watermark
      // logo must NOT be stretched with it. So it's left out of this capture
      // and drawn separately (at its natural proportions) on the final page.
      clone.style.background = "transparent";
      const wmEl = clone.querySelector(".print-sheet-watermark");
      if (wmEl) wmEl.style.visibility = "hidden";
      wrapper = document.createElement("div");
      wrapper.style.position = "fixed";
      wrapper.style.top = "0";
      wrapper.style.left = "-99999px";
      wrapper.appendChild(clone);
      document.body.appendChild(wrapper);
      // Two animation frames make sure the browser has actually laid out
      // and painted the clone (and the watermark image) before we shoot it.
      await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      // Where the middle of START..END falls on the sheet (0-1), measured on
      // the clone before it's stretched to the page.
      const wmMidRatio = dividerMidRatio(clone);

      const rawCanvas = await window.html2canvas(clone, {
        scale: CAPTURE_SCALE,
        backgroundColor: null,
        useCORS: true,
      });
      document.body.removeChild(wrapper);
      wrapper = null;

      // Load the watermark so it can be drawn with its real aspect ratio.
      const wmImg = await new Promise((resolve) => {
        const im = new Image();
        im.onload = () => resolve(im);
        im.onerror = () => resolve(null);
        im.src = "./icons/VictoryWatermark.png";
      });

      // Compose the raster onto a white "sheet of paper" that is always
      // exactly US Letter size at 300 DPI (2550x3300px), with the same
      // 0.35in margins the print stylesheet uses. The table is stretched
      // to exactly fill the printable area (both width and height), so it
      // always fits the page edge-to-edge instead of leaving blank space
      // above/below when it's shorter than a full page.
      const DPI = 300;
      const pageW = Math.round(8.5 * DPI); // 2550
      const pageH = Math.round(11 * DPI); // 3300
      const margin = Math.round(0.35 * DPI);
      const usableW = pageW - margin * 2;
      const usableH = pageH - margin * 2;
      const drawW = usableW;
      const drawH = usableH;
      const drawX = margin;
      const drawY = margin;

      const canvas = document.createElement("canvas");
      canvas.width = pageW;
      canvas.height = pageH;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#FFFFFF";
      ctx.fillRect(0, 0, pageW, pageH);
      // Watermark first (behind the table), centered in the printable area,
      // smaller than on screen (31.7% of page width, max 238 of 740 css px) and
      // keeping its natural width:height ratio — never stretched.
      if (wmImg && wmImg.naturalWidth && wmImg.naturalHeight) {
        const wmW = Math.min(0.317 * drawW, (238 / CONTENT_W) * drawW);
        const wmH = wmW * (wmImg.naturalHeight / wmImg.naturalWidth);
        ctx.save();
        ctx.globalAlpha = 0.5;
        const wmCenterY = drawY + (wmMidRatio == null ? 0.46 : wmMidRatio) * drawH;
        ctx.drawImage(wmImg, drawX + (drawW - wmW) / 2, wmCenterY - wmH / 2, wmW, wmH);
        ctx.restore();
      }
      ctx.drawImage(rawCanvas, drawX, drawY, drawW, drawH);

      const safeName = sheetLabel.replace(/[\\/:*?"<>|]/g, "").trim();
      if (kind === "image") {
        await new Promise((resolve) => {
          canvas.toBlob(async (blob) => {
            if (blob) await shareOrDownloadBlob(blob, `${safeName}.png`, "image/png");
            resolve();
          }, "image/png");
        });
      } else {
        const { jsPDF } = window.jspdf;
        const imgData = canvas.toDataURL("image/jpeg", 0.95);
        const pdf = new jsPDF({ orientation: "portrait", unit: "px", format: [pageW / CAPTURE_SCALE, pageH / CAPTURE_SCALE] });
        pdf.addImage(imgData, "JPEG", 0, 0, pageW / CAPTURE_SCALE, pageH / CAPTURE_SCALE);
        await shareOrDownloadBlob(pdf.output("blob"), `${safeName}.pdf`, "application/pdf");
      }
    } catch (err) {
      if (wrapper && wrapper.parentNode) wrapper.parentNode.removeChild(wrapper);
      console.error(err);
      alert("Hindi na-export. Subukan muli.");
    }
    setExporting(null);
  }, [exporting, shareOrDownloadBlob]);

  // The run sheet's content (main table + side blocks + head count) can be
  // taller than a single printed page once a lot of rows/overrides are in
  // play. Rather than let the browser split it across two pages, shrink the
  // whole sheet down to fit one page's printable area right before printing
  // (both the in-app Print button and Ctrl+P trigger the same browser print
  // flow, so listening for window's print events covers both), then restore
  // it to full size afterward so the on-screen view is unaffected.
  // Keep the watermark vertically centered between the START and END
  // divider rows (it's placed by percentage, so print zoom doesn't affect it).
  const placeWatermark = useCallback(() => {
    const img = wmImgRef.current;
    if (!img) return;
    const r = dividerMidRatio(sheetRef.current);
    img.style.top = r == null ? "46%" : `${(r * 100).toFixed(2)}%`;
  }, []);
  useEffect(() => { if (view === "print") placeWatermark(); });
  useEffect(() => {
    if (view !== "print") return;
    let ro = null;
    if (window.ResizeObserver && sheetRef.current) {
      ro = new ResizeObserver(placeWatermark);
      ro.observe(sheetRef.current);
    }
    const mq = window.matchMedia ? window.matchMedia("print") : null;
    window.addEventListener("beforeprint", placeWatermark);
    window.addEventListener("afterprint", placeWatermark);
    if (mq && mq.addEventListener) mq.addEventListener("change", placeWatermark);
    return () => {
      if (ro) ro.disconnect();
      window.removeEventListener("beforeprint", placeWatermark);
      window.removeEventListener("afterprint", placeWatermark);
      if (mq && mq.removeEventListener) mq.removeEventListener("change", placeWatermark);
    };
  }, [view, placeWatermark]);

  useEffect(() => {
    if (view !== "print") return;
    const PAGE_WIDTH_PX = 740;
    const PAGE_HEIGHT_PX = 980;
    const applyPrintScale = () => {
      const el = sheetRef.current;
      if (!el) return;
      el.style.zoom = "1";
      const contentWidth = el.scrollWidth;
      const contentHeight = el.scrollHeight;
      const scale = Math.min(1, PAGE_WIDTH_PX / contentWidth, PAGE_HEIGHT_PX / contentHeight);
      el.style.zoom = scale < 1 ? scale : "1";
    };
    const resetPrintScale = () => {
      const el = sheetRef.current;
      if (el) el.style.zoom = "1";
    };
    window.addEventListener("beforeprint", applyPrintScale);
    window.addEventListener("afterprint", resetPrintScale);
    return () => {
      window.removeEventListener("beforeprint", applyPrintScale);
      window.removeEventListener("afterprint", resetPrintScale);
    };
  }, [view]);

  const rows = [];
  config.teams.forEach((team) => {
    team.roles.forEach((role) => {
      const key = assignKey(week, slot, team.id, role.id);
      const name = monthState.assignments[key] || "";
      const verse = (monthState.verses && monthState.verses[key]) || "";
      const checked = !!(monthState.checks && monthState.checks[key]);
      const issues = name ? findIssues(config, monthState, week, slot, team.id, role.id, name) : [];
      const meta = (monthState.editMeta && monthState.editMeta[key]) || null;
      rows.push({ key, team, role, name, verse, checked, issues, meta });
    });
  });
  const filled = rows.filter((r) => r.name).length;
  const infoKey = serviceInfoKey(week, slot);
  const info = (monthState.serviceInfo && monthState.serviceInfo[infoKey]) || {};
  const printSettings = config.printSettings || {};
  const dateLabel = weekDisplayLabel(week, monthState.weekLabels, year, month);

  // Search filters (and highlights) rows by team, role, or volunteer name
  // so a long list is quick to scan once there are a lot of volunteers.
  const searchQuery = norm(search);
  const searchLower = searchQuery.toLowerCase();
  const filteredRows = searchQuery
    ? rows.filter((r) =>
        r.team.name.toLowerCase().includes(searchLower) ||
        r.role.name.toLowerCase().includes(searchLower) ||
        r.name.toLowerCase().includes(searchLower))
    : rows;

  // Grouped by team for the simplified mobile card view — avoids repeating
  // "TEAM: Service Lead" on every single line, which is what made the
  // stacked mobile table hard to scan, and lets each team render as its
  // own card. Rows are already produced team-by-team above, so a new
  // section starts whenever the team changes.
  const teamSections = [];
  filteredRows.forEach((r) => {
    const current = teamSections[teamSections.length - 1];
    if (!current || current.team.id !== r.team.id) {
      teamSections.push({ team: r.team, rows: [r] });
    } else {
      current.rows.push(r);
    }
  });

  const toggleCheck = (key) => {
    updateMonthState((prev) => {
      const nextChecks = { ...(prev.checks || {}) };
      if (nextChecks[key]) delete nextChecks[key];
      else nextChecks[key] = true;
      return { ...prev, checks: nextChecks };
    });
  };

  if (view === "print") {
    const total = [info.headcountVolunteer, info.headcountAdult, info.headcountKids]
      .map((v) => parseInt(v, 10))
      .filter((n) => !isNaN(n))
      .reduce((a, b) => a + b, 0);
    const program = config.printProgram || defaultPrintProgram();
    const timeOffset = slotOffsetMinutes(slot);

    const setCustomValue = (rowId, value) => {
      updateMonthState((prev) => {
        const next = { ...(prev.customValues || {}) };
        const cvKey = `${week}|${slot}|${rowId}`;
        if (norm(value)) next[cvKey] = value;
        else delete next[cvKey];
        return { ...prev, customValues: next };
      });
    };

    const VolunteerCell = ({ row }) => {
      const r = resolvePrintRow(config, monthState, week, slot, row);
      const hasConflict = r.issues.some((x) => x.type === "Schedule Conflict");
      const hasDup = r.issues.some((x) => x.type === "duplicate");
      if (r.editable) {
        return (
          <input className="no-print-interactive" value={r.value} onChange={(e) => setCustomValue(row.id, e.target.value)}
            placeholder="—" style={{ width: "100%", boxSizing: "border-box", border: "none", background: "transparent", fontSize: 11.5, fontFamily: "system-ui, sans-serif", outline: "none" }} />
        );
      }
      return (
        <span style={{ color: hasConflict ? "var(--t8C2F22)" : hasDup ? "var(--t8A6A1A)" : "inherit", fontWeight: hasConflict || hasDup ? 700 : 400 }}>
          {r.value || ""}
        </span>
      );
    };

    return (
      <div className="print-sheet-wrap" style={styles.viewWrap}>
        <div className="no-print sheet-toolbar">
          <button onClick={() => setView("list")} style={{ ...styles.smallBtn, whiteSpace: "normal" }}>← Back to list view</button>
          <button onClick={() => window.print()} style={{ ...styles.smallBtn, background: "var(--bA9782F)", whiteSpace: "normal" }}>🖨 Print</button>
          <button onClick={() => exportSheet("image", `Master List - ${dateLabel} - ${slot}`)} disabled={!!exporting}
            style={{ ...styles.smallBtn, background: "var(--b2F4858)", opacity: exporting && exporting !== "image" ? 0.6 : 1, whiteSpace: "normal" }}>
            {exporting === "image" ? "Ginagawa…" : "🖼 Save as Image"}
          </button>
          <button onClick={() => exportSheet("pdf", `Master List - ${dateLabel} - ${slot}`)} disabled={!!exporting}
            style={{ ...styles.smallBtn, background: "var(--b2F4858)", opacity: exporting && exporting !== "pdf" ? 0.6 : 1, whiteSpace: "normal" }}>
            {exporting === "pdf" ? "Ginagawa…" : "📄 Save as PDF"}
          </button>
        </div>
        <div className="sheet-scroll">
        <div className="print-sheet paper" style={styles.sheet} ref={sheetRef}>
          <div className="print-sheet-watermark" style={styles.sheetWatermark} aria-hidden="true">
            <img ref={wmImgRef} src="./icons/VictoryWatermark.png" alt="" style={styles.sheetWatermarkImg} />
          </div>
          <div style={styles.sheetInner}>
          <div style={styles.sheetBannerMain}>{printSettings.churchName || "VICTORY ALFONSO CHURCH SUNDAY SERVICE"}</div>
          <div style={styles.sheetBannerSub}>
            {[printSettings.campus || "VICTORY ALFONSO", callTimeForSlot(printSettings, slot) && `CALLTIME: ${callTimeForSlot(printSettings, slot)}`, `SERVICE TIME: ${slot}`].filter(Boolean).join(" | ")}
          </div>
          {info.series && <div style={styles.sheetBannerBold}>{info.series.toUpperCase()}</div>}
          {(info.topic || info.verse) && <div style={styles.sheetBannerLight}>{[info.topic, info.verse].filter(Boolean).join("   ")}</div>}
          <div style={styles.sheetBannerSub}>{dateLabel}</div>

          <table style={{ ...styles.sheetTable, tableLayout: "fixed" }}>
            {/* fixed widths so the new column matches Program */}
            <colgroup>
              <col style={{ width: "9%" }} />
              <col style={{ width: "8%" }} />
              <col style={{ width: "17%" }} />
              <col style={{ width: "17%" }} />
              <col style={{ width: "25%" }} />
              <col style={{ width: "20%" }} />
              <col style={{ width: "4%" }} />
            </colgroup>
            <thead>
              <tr>
                <th style={styles.sheetTh}>Time</th>
                <th style={styles.sheetTh}>Duration</th>
                <th style={styles.sheetTh}>{PRINT_EXTRA_COL_LABEL}</th>
                <th style={styles.sheetTh}>Program</th>
                <th style={styles.sheetTh}>Task</th>
                <th style={styles.sheetTh}>Volunteer(s)</th>
                <th style={{ ...styles.sheetTh, width: 26 }}></th>
              </tr>
            </thead>
            <tbody>
              {program.sections.map((section) => {
                if (section.kind === "divider") {
                  return (
                    <tr key={section.id} data-divider="1">
                      <td colSpan={7} style={styles.sheetBand}>{shiftDividerLabel(section.label, slot)}</td>
                    </tr>
                  );
                }
                const visibleRows = (section.rows || []).filter((row) => rowVisibleForWeek(row, week));
                if (visibleRows.length === 0) return null;
                const extraLines = (section.programSubRoles || [])
                  .map((tag) => resolveRoleTagValue(config, monthState, week, slot, tag))
                  .filter((v) => norm(v));

                const timings = visibleRows.map((r) => resolveRowTiming(r, week, slot, timeOffset));
                const isBlankTiming = (t) => !norm(t.time) && !norm(t.duration);

                return visibleRows.map((row, i) => {
                  const timing = timings[i];
                  // blank rows below get merged into this one's Time/Duration
                  const startsTimeGroup = i === 0 || !isBlankTiming(timing);
                  let timeSpan = 1;
                  while (startsTimeGroup && i + timeSpan < visibleRows.length && isBlankTiming(timings[i + timeSpan])) timeSpan++;
                  const verseText = resolveRowVerse(config, monthState, week, slot, row);
                  return (
                    <tr key={row.id}>
                      {startsTimeGroup && <td rowSpan={timeSpan} style={styles.sheetTd}>{timing.time}</td>}
                      {startsTimeGroup && <td rowSpan={timeSpan} style={styles.sheetTd}>{timing.duration}</td>}
                      {i === 0 && (
                        <td rowSpan={visibleRows.length} style={{ ...styles.sheetTd, verticalAlign: "middle", whiteSpace: "pre-wrap" }}>
                          {section.extraCol || ""}
                        </td>
                      )}
                      {i === 0 && (
                        <td rowSpan={visibleRows.length} style={{ ...styles.sheetTd, fontWeight: 700, verticalAlign: "middle", whiteSpace: "pre-wrap" }}>
                          {section.program || ""}
                          {extraLines.length > 0 && (
                            <div style={{ fontWeight: 400, fontSize: 10.5, marginTop: 4 }}>
                              {extraLines.map((v, idx) => <div key={idx}>{v}</div>)}
                            </div>
                          )}
                        </td>
                      )}
                      <td style={styles.sheetTd}>
                        {row.task || ""}
                        {verseText && (
                          <div style={{ fontWeight: 400, fontStyle: "italic", fontSize: 10.5, marginTop: 3, color: "var(--t3B5A8A)" }}>{verseText}</div>
                        )}
                      </td>
                      <td style={styles.sheetTd}><VolunteerCell row={row} /></td>
                      <td style={{ ...styles.sheetTd, textAlign: "center" }}>
                        {row.checkbox && (
                          <input className="no-print-interactive" type="checkbox" checked={!!(monthState.checks && monthState.checks[`custom:${row.id}`])}
                            onChange={() => toggleCheck(`custom:${row.id}`)} />
                        )}
                      </td>
                    </tr>
                  );
                });
              })}
            </tbody>
          </table>

          {/* two independent columns so the left side doesn't wait on the taller ushering block */}
          {(() => {
            const sideBlocks = program.sideBlocks || [];
            const renderSideBlock = (block) => (
              <div key={block.id} style={{ marginBottom: 14 }}>
                <div style={styles.sheetSectionHead}>{block.title}</div>
                <table style={{ ...styles.sheetTable, tableLayout: "fixed", width: "100%" }}>
                  <colgroup>
                    <col style={{ width: "58%" }} />
                    <col />
                  </colgroup>
                  <tbody>
                    {(block.rows || []).map((row) => (
                      <tr key={row.id}>
                        <td style={styles.sheetTd}>{row.label}</td>
                        <td style={styles.sheetTd}><VolunteerCell row={row} /></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            );
            return (
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginTop: 14, alignItems: "start" }}>
                <div>
                  {sideBlocks.slice(0, 1).map(renderSideBlock)}
                  {(program.soloRows || []).length > 0 && (
                    <div style={{ marginBottom: 14 }}>
                      <table style={{ ...styles.sheetTable, tableLayout: "fixed", width: "100%" }}>
                        <colgroup>
                          <col style={{ width: "40%" }} />
                          <col />
                        </colgroup>
                        <tbody>
                          {program.soloRows.map((row) => (
                            <tr key={row.id}>
                              <td style={{ ...styles.sheetTdTall, background: "var(--b1F3864)", color: "#FFFFFF", fontWeight: 700 }}>{row.label.toUpperCase()}</td>
                              <td style={styles.sheetTdTall}><VolunteerCell row={row} /></td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}
                  <div style={{ maxWidth: 320 }}>
                    <div style={styles.sheetSectionHead}>HEAD COUNT</div>
                    <table style={styles.sheetTable}>
                      <tbody>
                        <tr><td style={styles.sheetTdTall}>Volunteer</td><td style={{ ...styles.sheetTdTall, width: 80 }}>{info.headcountVolunteer || ""}</td></tr>
                        <tr><td style={styles.sheetTdTall}>Adult</td><td style={styles.sheetTdTall}>{info.headcountAdult || ""}</td></tr>
                        <tr><td style={styles.sheetTdTall}>Kids</td><td style={styles.sheetTdTall}>{info.headcountKids || ""}</td></tr>
                        <tr><td style={{ ...styles.sheetTdTall, fontWeight: 700 }}>Total</td><td style={{ ...styles.sheetTdTall, fontWeight: 700 }}>{total || ""}</td></tr>
                      </tbody>
                    </table>
                  </div>
                </div>
                <div>
                  {sideBlocks.slice(1).map(renderSideBlock)}
                  <div>
                    <div style={styles.sheetSectionHead}>ANNOUNCEMENTS</div>
                    <div style={{ border: "1px solid var(--l23211D)", borderTop: "none", padding: "8px 10px", fontSize: 12.5, whiteSpace: "pre-wrap", minHeight: 30 }}>{info.announcements || ""}</div>
                  </div>
                </div>
              </div>
            );
          })()}
          </div>
        </div>
        </div>
      </div>
    );
  }

  const hasInfo = info.series || info.topic || info.verse || info.announcements;
  const infoItems = [
    info.series && { label: "Series", value: info.series },
    info.topic && { label: "Topic", value: info.topic },
    info.verse && { label: "Verse", value: info.verse },
    info.announcements && { label: "Announcements", value: info.announcements },
  ].filter(Boolean);
  const fillPct = rows.length ? Math.round((filled / rows.length) * 100) : 0;

  return (
    <div style={styles.viewWrap}>
      <header style={styles.viewHeader}>
        <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 12 }}>
          <h1 style={styles.h1}>Master List</h1>
          <ThemeToggle className="theme-toggle-view" />
        </div>
        <div style={styles.viewMeta}>
          {dateLabel} · {slot} · {filled} of {rows.length} roles filled
          {searchQuery && ` · ${filteredRows.length} match${filteredRows.length === 1 ? "" : "es"}`}
        </div>
        {rows.length > 0 && (
          <div style={styles.masterProgressTrack}>
            <div style={{ ...styles.masterProgressFill, width: `${fillPct}%` }} />
          </div>
        )}
      </header>
      <div style={{ marginBottom: 16, display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center" }}>
        <button onClick={() => setView("print")} style={styles.smallBtn}>🖨 Print-friendly run sheet</button>
        <input type="text" value={search} onChange={(e) => setSearch(e.target.value)}
          placeholder="Search team, role, or volunteer…"
          style={{ ...styles.toolbarInput, width: 240 }} />
        {searchQuery && (
          <button onClick={() => setSearch("")} style={styles.ghostBtn}>Clear</button>
        )}
      </div>
      {hasInfo && (
        <div style={{ ...styles.masterInfoCard, marginBottom: 16 }}>
          {infoItems.map((item, i) => (
            <div key={item.label} style={i === infoItems.length - 1 ? { ...styles.masterInfoItem, borderBottom: "none", paddingBottom: 0 } : styles.masterInfoItem}>
              <div style={styles.masterInfoLabel}>{item.label}</div>
              <div style={styles.masterInfoValue}>{item.value}</div>
            </div>
          ))}
        </div>
      )}

      <div className="master-outer" style={styles.masterCard}>
        <div className="master-table-wrap">
          <table style={styles.table} className="responsive-table">
            <thead>
              <tr>
                <th style={styles.th}>Team</th>
                <th style={styles.th}>Role</th>
                <th style={styles.th}>Volunteer</th>
                <th style={styles.th}>Verse</th>
                <th style={styles.th}>Status</th>
              </tr>
            </thead>
            <tbody>
              {filteredRows.length === 0 && (
                <tr><td colSpan={5} style={styles.emptyNote}>No teams, roles, or volunteers match "{searchQuery}".</td></tr>
              )}
              {filteredRows.map((r, idx) => {
                const hasConflict = r.issues.some((x) => x.type === "Schedule Conflict");
                const hasDup = r.issues.some((x) => x.type === "duplicate");
                return (
                  <tr key={r.key} className="master-row" style={{ background: hasConflict ? "var(--bFBE9E5)" : hasDup ? "var(--bFBF3DC)" : idx % 2 === 0 ? "var(--bFFFFFF)" : "var(--bFAF6EA)" }}>
                    <td style={styles.td} data-label="Team">{searchQuery ? highlightMatch(r.team.name, searchQuery) : r.team.name}</td>
                    <td style={styles.td} data-label="Role">{searchQuery ? highlightMatch(r.role.name, searchQuery) : r.role.name}</td>
                    <td style={{ ...styles.td, fontWeight: r.name ? 600 : 400 }} data-label="Volunteer">
                      <span style={r.name && hasConflict ? styles.nameConflict : r.name && hasDup ? styles.nameDup : undefined}>
                        {r.name ? (searchQuery ? highlightMatch(r.name, searchQuery) : r.name) : <span style={styles.tdMuted}>— open —</span>}
                        <MasterEditInfo meta={r.meta} />
                      </span>
                    </td>
                    <td style={styles.td} data-label="Verse">{r.role.hasVerse ? (r.verse || <span style={styles.tdMuted}>—</span>) : <span style={styles.tdMuted}>—</span>}</td>
                    <td style={styles.td} data-label="Status">
                      {hasConflict ? <span style={styles.badgeConflict}>Schedule Conflict</span>
                        : hasDup ? <span style={styles.badgeDup}>Duplicate</span>
                        : r.name ? <span style={styles.badgeOk}>Confirmed</span>
                        : <span style={styles.tdMuted}>—</span>}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>

        <div className="master-cards" style={styles.masterSectionWrap}>
          {teamSections.length === 0 && (
            <div style={styles.emptyNote}>No teams, roles, or volunteers match "{searchQuery}".</div>
          )}
          {teamSections.map((section) => (
            <div key={section.team.id} style={styles.masterSection}>
              <div style={styles.mcTeamHeader}>{searchQuery ? highlightMatch(section.team.name, searchQuery) : section.team.name}</div>
              {section.rows.map((r, i) => {
                const hasConflict = r.issues.some((x) => x.type === "Schedule Conflict");
                const hasDup = r.issues.some((x) => x.type === "duplicate");
                const isLast = i === section.rows.length - 1;
                return (
                  <div key={r.key} className="mc-row" style={{ ...styles.mcRow, borderBottom: isLast ? "none" : "1px solid var(--lF1EBDA)", background: i % 2 === 1 ? "var(--bFCFAF3)" : "var(--bFFFFFF)" }}>
                    <div style={styles.mcRoleCol}>
                      <div style={styles.mcRoleName}>{searchQuery ? highlightMatch(r.role.name, searchQuery) : r.role.name}</div>
                      {r.role.hasVerse && r.verse && <div style={styles.mcVerse}>{r.verse}</div>}
                      {hasConflict && <div style={styles.mcStatusNote}><span style={styles.badgeConflict}>Schedule Conflict</span></div>}
                      {!hasConflict && hasDup && <div style={styles.mcStatusNote}><span style={styles.badgeDup}>Duplicate</span></div>}
                    </div>
                    <div style={{ ...styles.mcVolunteer, color: r.name ? "var(--t2A2620)" : "var(--tB0A582)", fontWeight: r.name ? 600 : 400 }}>
                      <span style={r.name && hasConflict ? styles.nameConflict : r.name && hasDup ? styles.nameDup : undefined}>
                        {r.name ? (searchQuery ? highlightMatch(r.name, searchQuery) : r.name) : <span style={styles.mcOpen}>— open —</span>}
                        <MasterEditInfo meta={r.meta} />
                      </span>
                    </div>
                  </div>
                );
              })}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// Read-only view for any signed-in user (no editor/team access needed):
// scans every week/slot/team/role in the currently selected month and
// shows just the rows where the assigned volunteer's name matches this
// user's own name, grouped by week/date. Lets a non-editor find their
// own assignments without having to click through Master List one
// week+slot at a time.
function MyScheduleView({ config, monthState, userName, year, month, partial }) {
  // Some assignments are typed as a nickname the login name doesn't cover
  // (e.g. logged in as "Eduardo Cruz" but the sheet says "Jun"). This lets
  // each person add their own alias, saved locally on this device/browser
  // only (no Firebase write access needed, so it works even without editor
  // rights) so "My Schedule" can also catch those rows.
  const aliasStorageKey = `ministry-scheduler-alias-${normKey(userName)}`;
  const [alias, setAlias] = useState(() => {
    try { return localStorage.getItem(aliasStorageKey) || ""; } catch (e) { return ""; }
  });
  useEffect(() => {
    try { localStorage.setItem(aliasStorageKey, alias); } catch (e) { /* ignore */ }
  }, [alias, aliasStorageKey]);

  const myNames = [userName, alias].map(norm).filter(Boolean);
  const matchesMe = (assignedName) => myNames.some((n) =>
    (partial ? namePrefixMatch(assignedName, n) : false) || namesLikelyMatch(assignedName, n));

  const weeksData = WEEKS.map((week) => {
    const dateLabel = weekDisplayLabel(week, monthState.weekLabels, year, month);
    const slots = SLOTS.map((slot) => {
      const matches = [];
      config.teams.forEach((team) => {
        team.roles.forEach((role) => {
          const key = assignKey(week, slot, team.id, role.id);
          const name = monthState.assignments[key] || "";
          if (name && matchesMe(name)) {
            const issues = findIssues(config, monthState, week, slot, team.id, role.id, name);
            matches.push({ team, role, name, issues });
          }
        });
      });
      return { slot, matches };
    }).filter((s) => s.matches.length > 0);
    return { week, dateLabel, slots };
  }).filter((w) => w.slots.length > 0);

  const totalAssignments = weeksData.reduce(
    (sum, w) => sum + w.slots.reduce((s2, sl) => s2 + sl.matches.length, 0), 0
  );

  return (
    <div style={styles.viewWrap}>
      <header style={styles.viewHeader}>
        <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 12 }}>
          <h1 style={styles.h1}>My Schedule</h1>
          <ThemeToggle className="theme-toggle-view" />
        </div>
        <div style={styles.viewMeta}>
          {monthLabel(year, month)} · {totalAssignments} assignment{totalAssignments === 1 ? "" : "s"}
        </div>
      </header>

      <div style={{ ...styles.lightCard, marginBottom: 16 }}>
        <div style={styles.fieldLabel}>Also called (nickname, optional)</div>
        <input type="text" value={alias} onChange={(e) => setAlias(e.target.value)}
          placeholder="e.g. Huwana, if that's how you're listed in the schedule"
          style={{ ...styles.input, maxWidth: 320 }} />
        <div style={{ ...styles.pairNote, marginTop: 8, marginBottom: 0 }}>
          Matches "{userName}" automatically — by first name or by surname alone, plus
          nickname-style entries. Add a nickname here if assignments use a name this
          doesn't catch. Saved only on this device.
        </div>
      </div>

      {weeksData.length === 0 ? (
        <div style={styles.masterCard}>
          <div style={styles.emptyNote}>No assignments found for you this month yet.</div>
        </div>
      ) : (
        weeksData.map((w) => (
          <div key={w.week} style={{ ...styles.masterCard, marginBottom: 16 }}>
            <div style={styles.sheetSectionHead}>{w.dateLabel}</div>
            <table style={styles.table}>
              <thead>
                <tr>
                  <th style={styles.th}>Service</th>
                  <th style={styles.th}>Team</th>
                  <th style={styles.th}>Role</th>
                  <th style={styles.th}>Listed as</th>
                  <th style={styles.th}>Status</th>
                </tr>
              </thead>
              <tbody>
                {w.slots.flatMap((sl) =>
                  sl.matches.map((m, idx) => {
                    const hasConflict = m.issues.some((x) => x.type === "Schedule Conflict");
                    const hasDup = m.issues.some((x) => x.type === "duplicate");
                    const exactMatch = myNames.some((n) => normKey(n) === normKey(m.name));
                    return (
                      <tr key={`${sl.slot}-${m.team.id}-${m.role.id}`}
                        style={{ background: hasConflict ? "var(--bFBE9E5)" : hasDup ? "var(--bFBF3DC)" : idx % 2 === 0 ? "var(--bFFFFFF)" : "var(--bFAF6EA)" }}>
                        <td style={styles.td}>{sl.slot}</td>
                        <td style={styles.td}>{m.team.name}</td>
                        <td style={styles.td}>{m.role.name}</td>
                        <td style={styles.td}>
                          {m.name}{!exactMatch && !partial && <span style={styles.tdMuted}> (close match)</span>}
                        </td>
                        <td style={styles.td}>
                          {hasConflict ? <span style={styles.badgeConflict}>Schedule Conflict</span>
                            : hasDup ? <span style={styles.badgeDup}>Duplicate</span>
                            : <span style={styles.badgeOk}>Confirmed</span>}
                        </td>
                      </tr>
                    );
                  })
                )}
              </tbody>
            </table>
          </div>
        ))
      )}
    </div>
  );
}

function ManageView({ config, updateConfig, monthState, updateMonthState, monthLabelText, isMobile }) {
  const [manageTab, setManageTab] = useState("teams");
  const [newTeamName, setNewTeamName] = useState("");
  const [newRoleName, setNewRoleName] = useState({});
  const [restrictEmail, setRestrictEmail] = useState("");
  const [restrictTeamIds, setRestrictTeamIds] = useState([]);
  const [restrictCanManage, setRestrictCanManage] = useState(false);
  const [role1, setRole1] = useState("");
  const [role2, setRole2] = useState("");
  const [role3, setRole3] = useState("");
  const [role4, setRole4] = useState("");
  const [overrideDraft, setOverrideDraft] = useState({});
  const [newVolunteerName, setNewVolunteerName] = useState({});
  // Drag-to-reorder roles: { teamId, roleId, overId } while a handle is held
  const [roleDrag, setRoleDrag] = useState(null);
  const roleDragRef = useRef(null);
  roleDragRef.current = roleDrag;

  const moveRole = (teamId, fromId, toId) => {
    if (!fromId || !toId || fromId === toId) return;
    updateConfig((prev) => ({
      ...prev,
      teams: prev.teams.map((t) => {
        if (t.id !== teamId) return t;
        const list = t.roles.slice();
        const from = list.findIndex((r) => r.id === fromId);
        const to = list.findIndex((r) => r.id === toId);
        if (from < 0 || to < 0) return t;
        const [item] = list.splice(from, 1);
        list.splice(to, 0, item);
        return { ...t, roles: list };
      }),
    }));
  };

  useEffect(() => {
    if (!roleDrag) return;
    const onMove = (e) => {
      const cur = roleDragRef.current;
      if (!cur) return;
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const row = el && el.closest ? el.closest("[data-role-row]") : null;
      const overId = row && row.getAttribute("data-team-id") === cur.teamId ? row.getAttribute("data-role-id") : cur.overId;
      if (overId !== cur.overId) setRoleDrag({ ...cur, overId });
      // auto-scroll near the screen edges
      if (e.clientY < 70) window.scrollBy(0, -14);
      else if (e.clientY > window.innerHeight - 70) window.scrollBy(0, 14);
      e.preventDefault();
    };
    const onUp = () => {
      const cur = roleDragRef.current;
      if (cur) moveRole(cur.teamId, cur.roleId, cur.overId);
      setRoleDrag(null);
    };
    window.addEventListener("pointermove", onMove, { passive: false });
    window.addEventListener("pointerup", onUp);
    window.addEventListener("pointercancel", onUp);
    return () => {
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
      window.removeEventListener("pointercancel", onUp);
    };
  }, [!!roleDrag]);

  const printSettings = config.printSettings || {};
  const setPrintSetting = (field, value) => {
    updateConfig((prev) => ({ ...prev, printSettings: { ...(prev.printSettings || {}), [field]: value } }));
  };

  const allRoleOptions = config.teams.flatMap((t) =>
    t.roles.map((r) => ({ tag: roleTag(t.id, r.id), label: `${t.name} — ${r.name}` }))
  );
  const addGroup = () => {
    const picked = [role1, role2, role3, role4].filter(Boolean);
    const unique = Array.from(new Set(picked));
    if (unique.length < 2) return;
    updateConfig((prev) => ({ ...prev, compatibleGroups: [...(prev.compatibleGroups || []), unique] }));
    setRole1(""); setRole2(""); setRole3(""); setRole4("");
  };
  const removeGroup = (idx) => {
    updateConfig((prev) => ({ ...prev, compatibleGroups: (prev.compatibleGroups || []).filter((_, i) => i !== idx) }));
  };

  const addTeam = () => {
    const name = norm(newTeamName);
    if (!name) return;
    updateConfig((prev) => ({ ...prev, teams: [...prev.teams, { id: uid(), name, flexible: false, roles: [] }] }));
    setNewTeamName("");
  };
  const removeTeam = (teamId) => {
    updateConfig((prev) => ({
      ...prev,
      teams: prev.teams.filter((t) => t.id !== teamId),
      compatiblePairs: prev.compatiblePairs.filter((p) => !p.split("~").includes(teamId)),
    }));
  };
  const renameTeam = (teamId, name) => {
    updateConfig((prev) => ({ ...prev, teams: prev.teams.map((t) => (t.id === teamId ? { ...t, name } : t)) }));
  };
  const toggleFlexible = (teamId) => {
    updateConfig((prev) => ({ ...prev, teams: prev.teams.map((t) => (t.id === teamId ? { ...t, flexible: !t.flexible } : t)) }));
  };
  const addRole = (teamId) => {
    const name = norm(newRoleName[teamId]);
    if (!name) return;
    updateConfig((prev) => ({ ...prev, teams: prev.teams.map((t) => (t.id === teamId ? { ...t, roles: [...t.roles, { id: uid(), name }] } : t)) }));
    setNewRoleName((prev) => ({ ...prev, [teamId]: "" }));
  };
  const removeRole = (teamId, roleId) => {
    updateConfig((prev) => ({
      ...prev,
      teams: prev.teams.map((t) => (t.id === teamId ? { ...t, roles: t.roles.filter((r) => r.id !== roleId) } : t)),
    }));
  };
  const renameRole = (teamId, roleId, name) => {
    updateConfig((prev) => ({ ...prev, teams: prev.teams.map((t) => (t.id === teamId ? { ...t, roles: t.roles.map((r) => (r.id === roleId ? { ...r, name } : r)) } : t)) }));
  };
  const toggleRoleVerse = (teamId, roleId) => {
    updateConfig((prev) => ({ ...prev, teams: prev.teams.map((t) => (t.id === teamId ? { ...t, roles: t.roles.map((r) => (r.id === roleId ? { ...r, hasVerse: !r.hasVerse } : r)) } : t)) }));
  };
  const setRoleField = (teamId, roleId, field, value) => {
    updateConfig((prev) => ({ ...prev, teams: prev.teams.map((t) => (t.id === teamId ? { ...t, roles: t.roles.map((r) => (r.id === roleId ? { ...r, [field]: value } : r)) } : t)) }));
  };
  const togglePair = (aId, bId) => {
    const key = pairKey(aId, bId);
    updateConfig((prev) => ({ ...prev, compatiblePairs: prev.compatiblePairs.includes(key) ? prev.compatiblePairs.filter((p) => p !== key) : [...prev.compatiblePairs, key] }));
  };
  const setWeekLabel = (week, label) => {
    updateMonthState((prev) => ({ ...prev, weekLabels: { ...prev.weekLabels, [week]: label } }));
  };
  const toggleRestrictTeamId = (teamId) => {
    setRestrictTeamIds((prev) => (prev.includes(teamId) ? prev.filter((id) => id !== teamId) : [...prev, teamId]));
  };
  const addRestriction = () => {
    const email = normKey(restrictEmail);
    if (!email || restrictTeamIds.length === 0) return;
    updateConfig((prev) => ({ ...prev, restrictions: { ...(prev.restrictions || {}), [emailToKey(email)]: { teams: restrictTeamIds, canManage: restrictCanManage } } }));
    setRestrictEmail("");
    setRestrictTeamIds([]);
    setRestrictCanManage(false);
  };
  const editRestriction = (email, entry) => {
    setRestrictEmail(email);
    setRestrictTeamIds(entry.teams);
    setRestrictCanManage(entry.canManage);
  };
  const removeRestriction = (name) => {
    updateConfig((prev) => {
      const next = { ...(prev.restrictions || {}) };
      delete next[name];
      return { ...prev, restrictions: next };
    });
  };

  // ---- Per-role volunteer list (used for the Assign volunteers dropdown) ----
  // Draft input state is keyed by "teamId|roleId" so each role has its own
  // in-progress "add volunteer" field. Multiple names can be entered at
  // once, separated by commas and/or new lines (e.g. pasted from a list),
  // and they're all added together — duplicates (case-insensitive, against
  // the existing list and within the pasted batch) are skipped.
  const volunteerDraftKey = (teamId, roleId) => `${teamId}|${roleId}`;
  const parseVolunteerNames = (raw) =>
    (raw || "")
      .split(/[\n,]/)
      .map((s) => norm(s))
      .filter(Boolean);
  const addVolunteer = (teamId, roleId) => {
    const draftKey = volunteerDraftKey(teamId, roleId);
    const names = parseVolunteerNames(newVolunteerName[draftKey]);
    if (names.length === 0) return;
    updateConfig((prev) => ({
      ...prev,
      teams: prev.teams.map((t) => {
        if (t.id !== teamId) return t;
        return {
          ...t,
          roles: t.roles.map((r) => {
            if (r.id !== roleId) return r;
            const existing = r.volunteers || [];
            const seen = new Set(existing.map((v) => normKey(v)));
            const additions = [];
            names.forEach((name) => {
              const key = normKey(name);
              if (seen.has(key)) return;
              seen.add(key);
              additions.push(name);
            });
            if (additions.length === 0) return r;
            return { ...r, volunteers: [...existing, ...additions] };
          }),
        };
      }),
    }));
    setNewVolunteerName((prev) => ({ ...prev, [draftKey]: "" }));
  };
  const removeVolunteer = (teamId, roleId, name) => {
    updateConfig((prev) => ({
      ...prev,
      teams: prev.teams.map((t) => {
        if (t.id !== teamId) return t;
        return {
          ...t,
          roles: t.roles.map((r) => (r.id === roleId ? { ...r, volunteers: (r.volunteers || []).filter((v) => v !== name) } : r)),
        };
      }),
    }));
  };

  const rigidTeams = config.teams.filter((t) => !t.flexible);
  const restrictionEntries = Object.entries(config.restrictions || {});

  // ---- Print Program (run sheet layout) editing ----
  const program = config.printProgram || defaultPrintProgram();
  const updateProgram = (updater) => {
    updateConfig((prev) => {
      const cur = prev.printProgram || defaultPrintProgram();
      const next = typeof updater === "function" ? updater(cur) : updater;
      return { ...prev, printProgram: next };
    });
  };
  const moveInArray = (arr, idx, dir) => {
    const next = arr.slice();
    const j = idx + dir;
    if (j < 0 || j >= next.length) return arr;
    [next[idx], next[j]] = [next[j], next[idx]];
    return next;
  };
  const addSection = (kind) => {
    updateProgram((p) => ({
      ...p,
      sections: [...p.sections, kind === "divider"
        ? { id: uid(), kind: "divider", label: "NEW DIVIDER" }
        : { id: uid(), kind: "group", program: "", rows: [{ id: uid(), time: "", duration: "", task: "New task" }] }],
    }));
  };
  const removeSection = (id) => updateProgram((p) => ({ ...p, sections: p.sections.filter((s) => s.id !== id) }));
  const moveSection = (id, dir) => updateProgram((p) => ({ ...p, sections: moveInArray(p.sections, p.sections.findIndex((s) => s.id === id), dir) }));
  const updateSection = (id, field, value) => updateProgram((p) => ({ ...p, sections: p.sections.map((s) => (s.id === id ? { ...s, [field]: value } : s)) }));
  const addRow = (sectionId) => updateProgram((p) => ({ ...p, sections: p.sections.map((s) => (s.id === sectionId ? { ...s, rows: [...s.rows, { id: uid(), time: "", duration: "", task: "New task" }] } : s)) }));
  const removeRow = (sectionId, rowId) => updateProgram((p) => ({ ...p, sections: p.sections.map((s) => (s.id === sectionId ? { ...s, rows: s.rows.filter((r) => r.id !== rowId) } : s)) }));
  const updateRow = (sectionId, rowId, field, value) => updateProgram((p) => ({ ...p, sections: p.sections.map((s) => (s.id === sectionId ? { ...s, rows: s.rows.map((r) => (r.id === rowId ? { ...r, [field]: value } : r)) } : s)) }));
  const moveRowToSection = (fromSectionId, rowId, toSectionId) => {
    if (fromSectionId === toSectionId) return;
    updateProgram((p) => {
      let movedRow = null;
      const withoutRow = p.sections.map((s) => {
        if (s.id === fromSectionId) {
          movedRow = s.rows.find((r) => r.id === rowId);
          return { ...s, rows: s.rows.filter((r) => r.id !== rowId) };
        }
        return s;
      });
      if (!movedRow) return p;
      const withRow = withoutRow.map((s) => (s.id === toSectionId ? { ...s, rows: [...s.rows, movedRow] } : s));
      return { ...p, sections: withRow };
    });
  };
  const toggleRowWeek = (sectionId, rowId, row, w) => {
    const cur = row.showWeeks && row.showWeeks.length ? row.showWeeks : WEEKS.slice();
    const next = cur.includes(w) ? cur.filter((x) => x !== w) : [...cur, w].sort((a, b) => a - b);
    updateRow(sectionId, rowId, "showWeeks", next.length === WEEKS.length ? null : next);
  };
  const addProgramSubRole = (sectionId, tag) => {
    if (!tag) return;
    updateProgram((p) => ({ ...p, sections: p.sections.map((s) => (s.id === sectionId ? { ...s, programSubRoles: [...(s.programSubRoles || []), tag] } : s)) }));
  };
  const removeProgramSubRole = (sectionId, tag) => {
    updateProgram((p) => ({ ...p, sections: p.sections.map((s) => (s.id === sectionId ? { ...s, programSubRoles: (s.programSubRoles || []).filter((t) => t !== tag) } : s)) }));
  };

  // ---- Per-week/slot Time & Duration overrides for a print-program row ----
  const getOverrideDraft = (rowId) => overrideDraft[rowId] || { weeks: [], slots: [], time: "", duration: "" };
  const setOverrideDraftField = (rowId, field, value) => {
    setOverrideDraft((prev) => ({ ...prev, [rowId]: { ...getOverrideDraft(rowId), [field]: value } }));
  };
  const toggleOverrideDraftWeek = (rowId, w) => {
    const cur = getOverrideDraft(rowId);
    const weeks = cur.weeks.includes(w) ? cur.weeks.filter((x) => x !== w) : [...cur.weeks, w].sort((a, b) => a - b);
    setOverrideDraftField(rowId, "weeks", weeks);
  };
  const toggleOverrideDraftSlot = (rowId, s) => {
    const cur = getOverrideDraft(rowId);
    const slots = cur.slots.includes(s) ? cur.slots.filter((x) => x !== s) : [...cur.slots, s];
    setOverrideDraftField(rowId, "slots", slots);
  };
  const addRowOverride = (sectionId, rowId) => {
    const d = getOverrideDraft(rowId);
    if (!norm(d.time) && !norm(d.duration)) return;
    if (d.weeks.length === 0 && d.slots.length === 0) return;
    updateRow(sectionId, rowId, "overrides", [
      ...(program.sections.find((s) => s.id === sectionId).rows.find((r) => r.id === rowId).overrides || []),
      { id: uid(), weeks: d.weeks, slots: d.slots, time: norm(d.time), duration: norm(d.duration) },
    ]);
    setOverrideDraft((prev) => ({ ...prev, [rowId]: { weeks: [], slots: [], time: "", duration: "" } }));
  };
  const removeRowOverride = (sectionId, rowId, overrideId) => {
    const row = program.sections.find((s) => s.id === sectionId).rows.find((r) => r.id === rowId);
    updateRow(sectionId, rowId, "overrides", (row.overrides || []).filter((o) => o.id !== overrideId));
  };

  // ---- Same per-week/slot Time override mechanism, but for a divider's
  // own displayed time (e.g. "END OF 9:00 AM SERVICE — 10:10"), so the
  // printed end time can be pushed later/earlier on weeks where an earlier
  // row's duration was overridden and the service is expected to run long
  // or short. Reuses the same override draft state, keyed by section id
  // instead of row id.
  const addSectionOverride = (sectionId) => {
    const d = getOverrideDraft(sectionId);
    if (!norm(d.time) && !norm(d.duration)) return;
    if (d.weeks.length === 0 && d.slots.length === 0) return;
    const sec = program.sections.find((s) => s.id === sectionId);
    updateSection(sectionId, "overrides", [
      ...(sec.overrides || []),
      { id: uid(), weeks: d.weeks, slots: d.slots, time: norm(d.time), duration: norm(d.duration) },
    ]);
    setOverrideDraft((prev) => ({ ...prev, [sectionId]: { weeks: [], slots: [], time: "", duration: "" } }));
  };
  const removeSectionOverride = (sectionId, overrideId) => {
    const sec = program.sections.find((s) => s.id === sectionId);
    updateSection(sectionId, "overrides", (sec.overrides || []).filter((o) => o.id !== overrideId));
  };

  const addSideBlock = () => updateProgram((p) => ({ ...p, sideBlocks: [...(p.sideBlocks || []), { id: uid(), title: "NEW SECTION", rows: [{ id: uid(), label: "New row" }] }] }));
  const removeSideBlock = (id) => updateProgram((p) => ({ ...p, sideBlocks: (p.sideBlocks || []).filter((b) => b.id !== id) }));
  const updateSideBlockTitle = (id, title) => updateProgram((p) => ({ ...p, sideBlocks: (p.sideBlocks || []).map((b) => (b.id === id ? { ...b, title } : b)) }));
  const addSideRow = (blockId) => updateProgram((p) => ({ ...p, sideBlocks: (p.sideBlocks || []).map((b) => (b.id === blockId ? { ...b, rows: [...b.rows, { id: uid(), label: "New row" }] } : b)) }));
  const removeSideRow = (blockId, rowId) => updateProgram((p) => ({ ...p, sideBlocks: (p.sideBlocks || []).map((b) => (b.id === blockId ? { ...b, rows: b.rows.filter((r) => r.id !== rowId) } : b)) }));

                      <span style={{ fontSize: 11.5, color: "var(--t8A7F5E)" }}>Show on weeks:</span>
                      {WEEKS.map((w) => (
                        <label key={w} style={{ display: "flex", alignItems: "center", gap: 3, fontSize: 11.5, color: "var(--t8A7F5E)" }}>
                          <input type="checkbox"
                            checked={!row.showWeeks || row.showWeeks.length === 0 || row.showWeeks.includes(w)}
                            onChange={() => toggleRowWeek(section.id, row.id, row, w)} />
                          {w}
                        </label>
                      ))}
                    </div>
                    <div style={{ display: "flex", flexDirection: "column", gap: 6, paddingTop: 4, borderTop: "1px dashed var(--lE4DCC6)" }}>
                      <span style={{ fontSize: 11.5, color: "var(--t8A7F5E)" }}>
                        Overrides for specific weeks/slots (optional) — different Time or Duration on certain weeks, or a whole separate slot (e.g. future 3:00 PM):
                      </span>
                      {(row.overrides || []).length > 0 && (
                        <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                          {(row.overrides || []).map((ov) => (
                            <div key={ov.id} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11, background: "var(--bF6F1E4)", borderRadius: 6, padding: "4px 8px" }}>
                              <span style={{ flex: 1 }}>
                                {(ov.weeks && ov.weeks.length ? `Wk ${ov.weeks.join(",")}` : "All weeks")}
                                {" · "}
                                {(ov.slots && ov.slots.length ? ov.slots.join(", ") : "All slots")}
                                {" → "}
                                {[ov.time, ov.duration].filter((v) => norm(v)).join(" / ") || "—"}
                              </span>
                              <button onClick={() => removeRowOverride(section.id, row.id, ov.id)} style={styles.iconDanger} aria-label="Remove override">×</button>
                            </div>
                          ))}
                        </div>
                      )}
                      <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center" }}>
                        <span style={{ fontSize: 11, color: "var(--t8A7F5E)" }}>Weeks:</span>
                        {WEEKS.map((w) => (
                          <label key={w} style={{ display: "flex", alignItems: "center", gap: 2, fontSize: 11, color: "var(--t8A7F5E)" }}>
                            <input type="checkbox" checked={draft.weeks.includes(w)} onChange={() => toggleOverrideDraftWeek(row.id, w)} />
                            {w}
                          </label>
                        ))}
                        <span style={{ fontSize: 11, color: "var(--t8A7F5E)", marginLeft: 6 }}>Slots:</span>
                        {SLOTS.map((s) => (
                          <label key={s} style={{ display: "flex", alignItems: "center", gap: 2, fontSize: 11, color: "var(--t8A7F5E)" }}>
                            <input type="checkbox" checked={draft.slots.includes(s)} onChange={() => toggleOverrideDraftSlot(row.id, s)} />
                            {s}
                          </label>
                        ))}
                      </div>
                      <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                        <input value={draft.time} onChange={(e) => setOverrideDraftField(row.id, "time", e.target.value)}
                          placeholder="Override time (optional)" style={{ ...styles.roleEditInput, fontSize: 11.5, padding: "5px 7px" }} />
                        <input value={draft.duration} onChange={(e) => setOverrideDraftField(row.id, "duration", e.target.value)}
                          placeholder="Override duration (optional)" style={{ ...styles.roleEditInput, fontSize: 11.5, padding: "5px 7px" }} />
                        <button onClick={() => addRowOverride(section.id, row.id)} style={styles.smallBtn}>Add override</button>
                      </div>
                    </div>
                    <div style={{ display: "flex", gap: 6, alignItems: "center", paddingTop: 2, borderTop: "1px dashed var(--lE4DCC6)" }}>
                      <span style={{ fontSize: 11.5, color: "var(--t8A7F5E)" }}>Move to section:</span>
                      <select value="" onChange={(e) => { if (e.target.value) moveRowToSection(section.id, row.id, e.target.value); }}
                        style={{ ...styles.restrictSelect, fontSize: 11.5, padding: "4px 6px" }}>
                        <option value="">— choose a group —</option>
                        {program.sections.filter((s) => s.kind === "group" && s.id !== section.id).map((s) => (
                          <option key={s.id} value={s.id}>{s.program || "(untitled group)"}</option>
                        ))}
                      </select>
                    </div>
                  </div>
                  );
                })}
                <button onClick={() => addRow(section.id)} style={styles.smallBtn}>Add row</button>
                </div>
              </React.Fragment>
            )}
            </div>
          </details>
          );
        })}
        <div style={{ display: "flex", gap: 8, marginTop: 6 }}>
          <button onClick={() => addSection("group")} style={styles.smallBtn}>Add program group</button>
          <button onClick={() => addSection("divider")} style={styles.smallBtn}>Add divider</button>
        </div>

        <div style={{ ...styles.sectionLabel, marginTop: 24 }}>Side-by-side sections (e.g. Kids Coaches, Ushering)</div>
        <div style={styles.manageGrid}>
          {(program.sideBlocks || []).map((block) => (
            <details key={block.id} style={styles.teamCard} open={!isMobile}>
              <summary style={styles.teamCardSummary}>{block.title || "Untitled section"}</summary>
              <div style={styles.teamCardBody}>
              <div style={styles.teamCardHead}>
                <input value={block.title} onChange={(e) => updateSideBlockTitle(block.id, e.target.value)} style={styles.teamNameInput} />
                <button onClick={() => removeSideBlock(block.id)} style={styles.linkDanger}>Remove</button>
              </div>
              <div style={styles.roleList}>
                {(block.rows || []).map((row) => (
                  <div key={row.id} style={{ display: "flex", flexDirection: "column", gap: 3 }}>
                    <div style={styles.roleEditRow}>
                      <input value={row.label} onChange={(e) => updateSideRow(block.id, row.id, "label", e.target.value)} style={styles.roleEditInput} />
                      <button onClick={() => removeSideRow(block.id, row.id)} style={styles.iconDanger} aria-label="Remove row">×</button>
                    </div>
                    <select value={row.linkedRole || ""} onChange={(e) => updateSideRow(block.id, row.id, "linkedRole", e.target.value)}
                      style={{ ...styles.restrictSelect, fontSize: 12 }}>
                      <option value="">— free text —</option>
                      {allRoleOptions.map((r) => <option key={r.tag} value={r.tag}>{r.label}</option>)}
                    </select>
                  </div>
                ))}
                <button onClick={() => addSideRow(block.id)} style={styles.smallBtn}>Add row</button>
              </div>
              </div>
            </details>
          ))}
          <div style={styles.newTeamCard}>
            <div style={styles.newTeamLabel}>Add a side-by-side section</div>
            <button onClick={addSideBlock} style={styles.smallBtn}>Add section</button>
          </div>
        </div>

        <div style={{ ...styles.sectionLabel, marginTop: 24 }}>Small label/value rows (e.g. Admin, Tech, Photographer)</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 6, maxWidth: 420 }}>
          {(program.soloRows || []).map((row) => (
            <div key={row.id} style={{ display: "flex", gap: 6, alignItems: "center" }}>
              <input value={row.label} onChange={(e) => updateSoloRow(row.id, "label", e.target.value)} style={{ ...styles.roleEditInput, maxWidth: 140 }} />
              <select value={row.linkedRole || ""} onChange={(e) => updateSoloRow(row.id, "linkedRole", e.target.value)}
                style={{ ...styles.restrictSelect, fontSize: 12, flex: 1 }}>
                <option value="">— free text —</option>
                {allRoleOptions.map((r) => <option key={r.tag} value={r.tag}>{r.label}</option>)}
              </select>
              <button onClick={() => removeSoloRow(row.id)} style={styles.iconDanger} aria-label="Remove row">×</button>
            </div>
          ))}
          <button onClick={addSoloRow} style={styles.smallBtn}>Add row</button>
        </div>
      </div>
      )}

      {manageTab === "editors" && (
      <div style={{ marginTop: 28 }}>
        <div style={styles.sectionLabel}>Editors list</div>
        <div style={styles.pairNote}>
          Type the exact email a person signs in with and check every ministry they're
          allowed to edit — one or several. Editing Service Details also requires the
          Service Lead ministry to be checked, and Manage Teams requires the "can also
          open Manage Teams" box below. Access is matched by login email, not by the
          nickname someone typed at signup — that nickname is only used to match their
          name against the schedule and has no effect on what they can edit. If an entry
          below still looks like a name instead of an email, that's a leftover from
          before this list switched to email-based access — edit it, replace it with
          that person's actual login email, and save so it stays secure. Anyone
          whose email is NOT on this list cannot edit anything, and cannot open Manage
          Teams — the app is view only for them until they're added. Make sure at least
          one email here always has "can manage teams" checked, or no one will be able
          to get back into this screen. This applies across every month.
        </div>
        <div style={styles.restrictAddRow}>
          <input value={restrictEmail} onChange={(e) => setRestrictEmail(e.target.value)}
            placeholder="Email (the one they sign in with)" style={styles.roleEditInput}
            type="email"
            onKeyDown={(e) => { if (e.key === "Enter") addRestriction(); }} />
        </div>
        <div style={styles.pairGrid}>
          {config.teams.map((t) => (
            <label key={t.id} style={styles.pairItem}>
              <input type="checkbox" checked={restrictTeamIds.includes(t.id)} onChange={() => toggleRestrictTeamId(t.id)} />
              {t.name}
            </label>
          ))}
        </div>
        <label style={{ ...styles.flexToggle, marginTop: 10 }}>
          <input type="checkbox" checked={restrictCanManage} onChange={() => setRestrictCanManage((v) => !v)} />
          Can also open Manage Teams (add/rename teams and roles, edit this editors list)
        </label>
        <div style={{ marginTop: 10 }}>
          <button onClick={addRestriction} style={styles.smallBtn}>Save editor</button>
        </div>
        {restrictionEntries.length > 0 && (
          <div style={styles.restrictList}>
            {restrictionEntries.map(([key, raw]) => {
              const email = keyToEmail(key);
              const entry = normalizeRestriction(raw);
              const teamNames = entry.teams
                .map((id) => (config.teams.find((t) => t.id === id) || {}).name || "(deleted team)")
                .join(", ");
              return (
                <div key={key} style={styles.restrictRow}>
                  <span style={styles.restrictName}>{email}</span>
                  <span style={styles.restrictTeam}>
                    can edit: {teamNames || "(none yet)"}{entry.canManage ? " · can manage teams" : ""}
                  </span>
                  <button onClick={() => editRestriction(email, entry)} style={styles.linkDanger}>Edit</button>
                  <button onClick={() => removeRestriction(key)} style={styles.linkDanger}>Remove</button>
                </div>
              );
            })}
          </div>
        )}
      </div>
      )}
    </div>
  );
}
